<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980" role="img"><title>Figure 1.6. The network around the charger</title><rect width="920" height="980" fill="white"/><g font-family="Inter, sans-serif" fill="#111"><text x="460" y="40" text-anchor="middle" font-size="26" font-weight="600">The network around the charger</text><text x="460" y="70" text-anchor="middle" font-size="14" fill="#666">A public programme organised by the length of the pause</text><circle cx="460" cy="520" r="398" fill="white" stroke="#111" stroke-width="1.25" stroke-dasharray="5 7"/><circle cx="460" cy="520" r="302" fill="#f0efed" stroke="#111" stroke-width="1.25"/><circle cx="460" cy="520" r="205" fill="#f7f6f4" stroke="#111" stroke-width="1.25"/><circle cx="460" cy="520" r="104" fill="white" stroke="#111" stroke-width="1.25"/><circle cx="460" cy="520" r="58" fill="#111"/><g transform="translate(428 488)" fill="white"><path d="M38 3L12 36H28L23 61L52 25H35L42 3Z"/></g><text x="460" y="153" text-anchor="middle" font-size="21" font-weight="600">A night</text><text x="460" y="177" text-anchor="middle" font-size="14" fill="#666">rooms · showers · a drivers’ kitchen</text><text x="460" y="249" text-anchor="middle" font-size="21" font-weight="600">1–2 h</text><text x="460" y="273" text-anchor="middle" font-size="14" fill="#666">gym · clinic · reading room · workspace</text><text x="460" y="347" text-anchor="middle" font-size="21" font-weight="600">20 min</text><text x="460" y="371" text-anchor="middle" font-size="14" fill="#666">seats · food · washrooms · play</text><g transform="translate(292.3 551.0) scale(0.6875)"><g fill="#111"><path d="M12 4H20V32H52V40H48V60H41V40H20V60H12Z"/></g></g><g transform="translate(376.6 640.3) scale(0.6875)"><g fill="#111"><path d="M10 4H15V22H17V4H22V22H24V4H29V26Q29 33 22 34V60H15V34Q10 33 10 26ZM46 4Q34 14 36 36H42V60H50V4Z"/></g></g><g transform="translate(499.4 640.3) scale(0.6875)"><g fill="#111"><circle cx="18" cy="9" r="6"/><