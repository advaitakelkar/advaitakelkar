name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency advisories
        run: |
          mkdir -p review
          pnpm audit --json > review/dependencies.json

      - name: Check design rules and build integrity
        run: pnpm check

      - name: Install browser for responsive checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Check responsive layouts before deployment
        timeout-minutes: 10
        run: |
          pnpm preview --ignore-lock --host 127.0.0.1 --port 4331 > /tmp/portfolio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4331/ > /dev/null; then break; fi
            sleep 1
          done
          SHOOT_BASE=http://127.0.0.1:4331 pnpm audit:responsive

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-quality
          path: review/*json
          if-no-files-found: ignore

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADVAITAKELKAR_SITE }}

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          out=$(npx firebase-tools@15.34.0 deploy --only hosting --project advaitakelkar-site 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # Firebase returns an error when the uploaded build is byte-identical
            # to what's already live ("is the current active version"). That's a
            # no-op, not a failure — treat it as success so the run stays green.
            if echo "$out" | grep -q "is the current active version"; then
              echo "::notice::No content changes detected — site already up to date. Treating as success."
              exit 0
            fi
            exit $code
          fi
