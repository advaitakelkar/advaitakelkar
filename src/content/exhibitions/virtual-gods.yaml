        body:
          - "Zaha Hadid was well known for her fluid forms."
          - "Using organic shapes inspired from nature she designed various"
          - "Forms reflecting in space. Abstract forms were evolved from her ideology."
          - "Roberto Burle Marx designed world famous parks and gardens."
          - "Vibrant and colourful patterns were the key factor in all his representation drawings. Significant patterns of his were chosen for further exploration."
          - "Roberto Burle Marx by Advaita Kelkar (left); Zaha Hadid by Yash Pradhan (right)"
          - "Hadid and Marx both have a definite, distinct style."
          - "But, both also have similarities like using organic shapes inspired from the nature that are surrounded by morphed forms of their design."
