      - slug: "sohil-jinal"
        label: "Sohil Soni × Jinal Wadgama"
        film: "sohil-jinal"
        sketchfab: "d373e5a54b5946e699123991bf7d136c"
        body:
          - "Elements were extracted from each illustration while encapsulating the architect’s design language. The compromising form, clear construction and grounded volumes stood forefront for Venturi. On the other hand, the intricate Construction, clear form and suspended volumes defined Zumthor x Radic."
          - "Illustrations exchanged between Sohil Soni (repping Peter Zumthor + Radic) and Jinal Wadgama (repping Robert Venturi)"
          - "These contrasting elements sculpted together to create a monolithic representation."
          - "This was achieved by compromising forms from clear forms, applying clearly intricate construction and counterbalancing the volumes existing within the space."
