description: |
  <p>GOONJ was a temporary environment for a music festival at Forest Hills, Tala, on 24 December 2019. Developed with Varun Mehta and Nayan Mote, the project distributed small gathering spaces and playful installations across the campground, with Peter Cat Recording Co. and Ditty headlining.</p>
  <p>Locally available bamboo, hay, reused fabric and cotton shaped an economical material palette. Light, movement and tactile objects created intimate encounters rather than a single spectacle. Illuminated cotton clouds brought another layer of activity after dark.</p>
  <p>The material strategy continued beyond the event: bamboo returned to construction scaffolding, hay became animal fodder, and cloud lights were reused in the venue’s tents. Photography is credited to Bombay Frameworks.</p>

