designBrief:
  abstract: >-
    Bombay Then, Mumbai Now is a B.Arch design thesis proposing the redevelopment of the Richardson & Cruddas works in Byculla as a cultural centre celebrating Mumbai’s transformation through public memory, performance and exhibition. It brings the lives, struggles and collective actions of the city’s people into a former industrial setting. The thesis reads Mumbai through cinema, culture and art, infrastructure, science and technology, and politics and conflicts, tracing events and people from the early Koli settlements to the city’s renaming in 1995. This chronology becomes a starting point for architectural design: a way to bring public memory, industrial labour, cultural expression and the struggle for change into shared space. A performing arts centre, multipurpose hall and exhibition centre form the core programme, connected by public routes and spaces for everyday gathering. The proposal explores how the industrial site can retain a legible relationship to its past while accommodating contemporary cultural life. Plans, sections and circulation studies test the relationship between historical interpretation, live performance, informal encounter and the practical demands of events. The project asks how architecture can celebrate a changing city while making room for the different voices that continue to shape it.
  hypothesis: >-
    Redeveloping the Richardson & Cruddas works as a cultural centre, with performance and exhibition spaces connected by an accessible public route through the city’s histories, can turn industrial memory into an active civic setting. If historical interpretation and everyday cultural use share this route, the centre can support encounters between communities and generations while keeping the struggles and collective actions behind Mumbai’s transformation visible. The design will test this through route legibility, opportunities for informal gathering and the ability of public spaces to remain usable alongside scheduled events.
