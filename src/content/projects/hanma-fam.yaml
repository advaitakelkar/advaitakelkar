description: |
  <div class="desc-scroll">
    <p>Baki is a manga about bodies. Its whole argument is carried in anatomy — who is dense, who is long, who has been rebuilt, who is simply old and still unbeatable — and that argument is drawn, so it never has to answer to a real skeleton. This set makes it answer. Twenty-nine of the cast photographed as though a casting director had found them, in one session, under one light.</p>
    <p>The system is deliberately narrow so the bodies are the only variable: vertical 3:4, a tight crop from head to waist, plain black studio background, hard sculpting key light and a restrained rim in the character's own colour. No environment, no props, no poster effects. Real skin — pores, sweat, scar tissue, age — instead of the smooth inflation that generated muscle usually defaults to.</p>
    <p>Not everyone gets the gym-god treatment, which is the point. The elderly keep their age, and the non-fighters keep their ordinary build. A cast portrait is only worth taking if the cast is allowed to be uneven.</p>
    <p>Built from a 29-character prompt set originally written for Flux 2 and re-adapted for GPT image generation; Yujiro, Yuichiro and Retsu were rewritten for closer manga fidelity.</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
    <em>Characters in this study: Baki Hanma, Yujiro Hanma, Jack Hanma, Yuichiro Hanma, Atsushi Suedou, Biscuit Oliva, Doppo Orochi, Dorian, Gaia, Gerry Strydum, Gouki Shibukawa, Hector Doyle, Iron Michael, Izou Motobe, Jaku Kaioh, Jun Guevaru, Kaku Kaioh, Kaoru Hanayama, Katsumi Orochi, Kiyosumi Katou, Kosho Shinogi, Kureha Shinogi, Mitsunari Tokugawa, Mohammad Alai Jr., Pickle, Retsu Kaioh, Ryuukou Yanagi, Sikorsky, Spec.</em>
  </p>
  </div>

