    <div class="prompt-body">
      <span class="prompt-text">"Photorealistic cinematic fitness-editorial portrait of [Character Name] from Baki, reimagined as a believable live-action character. Vertical 3:4. Tight head-and-torso crop ending at the waist or upper thighs; the subject fills most of the frame. Plain black studio background, no scenery or props. Retain the character's distinctive physique, face, hair, clothing and expression; elderly, slender and non-fighter characters retain their own build. Real skin pores, natural imperfections, subtle perspiration, credible muscle and veins. High-end photographic realism, hard sculpting studio key light, restrained signature-colour rim light, deep shadows with visible detail. Keep hands anatomically coherent if in frame. No environment, no text, no logos, no watermark."</span>
    </div>
  </div>
