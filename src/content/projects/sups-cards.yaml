    </div>
    <div class="prompt-body">
      <span class="prompt-text">"[Character] as a believable live-action portrait. Head and shoulders, vertical crop, plain black seamless studio background. The costume reads as real material — fabric, lacquer, metal, prosthetic — never as illustration. Real skin with pores, sweat and scars. Hard sculpting key light, restrained signature-colour rim, deep shadows with detail retained. Direct gaze into the lens. One frame per character, no variations. No environment, no text, no logos, no watermark."</span>
    </div>
