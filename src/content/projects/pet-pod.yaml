description: |
  <p>Pet Pod is a logo and identity project for Kuldeep Jhangid’s pet furniture brand, developed with Varun Mehta. The brief called for a simple visual language that could connect the name, the product and the animals it serves.</p>
  <p>The identity uses circles and consistent orthogonal strokes to construct a combination mark. Concentric forms connect the pet, its collar and the surrounding pod, while the lettering balances rounded shapes with straight additions of the same weight.</p>
  <p>The system extends into logo lockups, product tags and related animal graphics. Sketches and animated construction studies show how these elements share a common geometry.</p>

