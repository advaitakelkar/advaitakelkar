chapters:
  - title: "T4D"
    subtitle: "The 4th Dimension"
    body: "<p><a href=\"/archv-in/T4D.html\">The original page on archv.in \u2197</a></p><img src=\"/images/the-4th-dimention/01.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/the-4th-dimention/02.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/the-4th-dimention/03.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/the-4th-dimention/04.webp\" alt=\"\" loading=\"lazy\" /><p><strong>Home</strong></p><p><strong>The 4th Dimension</strong></p><p><strong>Published:</strong></p><p>Dhal Ni Pol Heritage Festival,</p><p><strong>AHMDBD</strong></p><p>18th-25th November 2019</p><p><strong>Mentors:</strong></p><p><strong>Siddhesh Kadam</strong></p><p><strong>Participants:</strong></p><p><strong>Ashish NR</strong></p><p><strong>Nayan Mote</strong></p><p><strong>Varun Mehta</strong></p><img src=\"/archv-in/images/T4D/001_T4D-Banner_20.01.03.gif\" alt=\"T4D\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>T4D is an ode to 2 dimensional planar geometries attempting to create 3 dimensional forms. This transformation is investigated through an understanding of interlocking, stacking, folding, bending, and joining.</p><p>It enables one to understand the variables involved in creating quick sustainable products out of locally available sheet materials.</p><p>A collective of designers have translated this study into an open source design library</p><p>of sustainable products..</p><p><strong>Aim:</strong></p><p>To understand how to create 3D forms from 2D geometries.</p><p>See our open source design library\ue04e</p><p>enter\ue04e</p><p>Please mention your name and the project name in the form</p>"
  - title: "Introduction"
    subtitle: "A \u00b7 Introduction"
    body: "<p><strong>Abstract:</strong></p><p>Designers often use easily available sheet materials for quick construction and prototyping purposes. But a lot of these methods can also be used to create sustainable products by inspecting material usage, availabilty and crafting simple methods of making. To do this, one has to first understand easily available materials and their attributes.</p><p>Every readily available sheet material has its own physical propeties which might pose as limitations. To create an understanding that is free of this, we study characteristics of a 2D Planar geometry &amp; observe the process it can go through to become a 3D form.</p><p>Thus, to have an open understanding of possibilities, we have explored the processes of interlocking, stacking, bending and folding in our study.</p><p>The forth dimension is an experimental case study that is an ode to planar geometries attempting to form 3 dimensional sculptural creations. This study consists of forms as by-products.</p><p>It will be expressed into an open source of DIY parametric furniture kits, made through the participation and collaboration of multiple desingers.</p><p><strong>Aim:</strong></p><p>To understand how to create 3D forms from 2D planar geometries.</p><p><strong>Objectives:</strong></p><ul><li>Develop a material archive of easily available sheet materials. Compare their attributes, and map their limitations.</li><li>Understand Interlocking mechanisms for tool-less construction, without glue or screws.</li><li>Understand methods of stacking sheet materials to develop corner joineries and amorphous forms.</li><li>Understand different methods of modular folding and complex surface development.</li><li>Understand parametric patterns that allow sheet materials to bend in multiple axes.</li><li>Look into extension, expansion and other attributes that would be restricted only to thick sheet materials.</li><li>Express our understanding into an open source of parametric furniture pieces.</li></ul><p>It will use local readily available materials and resources with minimum wastage and a DIY method for construction.</p>"
  - title: "Material Archive"
    subtitle: "B \u00b7 Material Archive"
    body: "<p>Every material has its own restrictions based on its physical properties, we have created a comparative local list of materials that fit into the category of two dimensional planar surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/003_T4D---Sheet1.jpg\" alt=\"T4D Material Archive\" loading=\"lazy\" />"
  - title: "Nomenclature"
    subtitle: "C \u00b7 Nomenclature"
    body: "<img src=\"/archv-in/images/T4D-Beta-2-0/004_ARCHV-T4D-NOMEN-2DPLANE.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p>Two dimensional planar surfaces (2D plane)</p><p>Surfaces where the thickness is extremely less compared to its length and width. Also referred to as thin surfaces or sheets.</p><p>They do not exist in the physical world.</p><p>Since every physical material has some thickness to it.</p><img src=\"/archv-in/images/T4D-Beta-2-0/005_ARCHV-T4D-NOMEN-INDNT.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Indent/Incision/Notch</strong></p><p>Is a cutout on the surface, where the,</p><p>thickness of the surface is usually equal to the width of the cutout. If the width is greater than the thickness it is considered to be a void.</p><img src=\"/archv-in/images/T4D-Beta-2-0/006_ARCHV-T4D-NOMEN-VOID.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Void</strong></p><p>A void is also a cutout on a surface whose form is not restricted. It can be of any size and shape within the area of the surface.</p><img src=\"/archv-in/images/T4D-Beta-2-0/007_ARCHV-T4D-NOMEN-INTRLCK.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Interlock</strong></p><p>When 2 or more surfaces fit into each other either through indents, sliding or stacking</p><img src=\"/archv-in/images/T4D-Beta-2-0/008_ARCHV-T4D-NOMEN-STACK.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Stack</strong></p><p>Is piling up/ overlapping of multiple surfaces on top of each other in a particular arrangement.</p><img src=\"/archv-in/images/T4D-Beta-2-0/009_ARCHV-T4D-NOMEN-FOLD.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Fold</strong></p><p>Bend something along a defined crease line to morph its appearance and/or strength</p><img src=\"/archv-in/images/T4D-Beta-2-0/010_ARCHV-T4D-NOMEN-BEND-.jpg\" alt=\"T4D Nomenclature\" loading=\"lazy\" /><p><strong>Bend</strong></p><p>When a surface with low tensile strength is forced to curve along a single or multiple axis</p><p>Misc. Definitions:</p><ul><li>A slit made perpendicular to the thickness of a material is called a kerf . This could either be made by a saw, or a CNC mill/laser.</li><li>Units used to measure thickness: mm</li><li>Instrument used to measure thickness:</li></ul><p><strong>Vernier calliper or Screw gauge</strong></p>"
  - title: "Interlocks"
    subtitle: "D \u00b7 Interlocks"
    body: "<p><strong>Introduction</strong></p><p><strong>Description:</strong></p><p>Interlocking mechanisms are the simplest and the most efficient way to join 2D planar geometries. They assist a tool-less, no glue, no screw construction process.</p><p>The crux of interlocking 2D planar geometries, lies in the position and shape of the indent. An indent can either be positioned on the edge or on the surface itself. After identifying different forms of indents, we built an analog algorithm that explores permutations and combinations of different kinds of interlocks and their applications.</p><p>With the same understanding, we have also explored the combination of interlocks with voids through a few examples.</p><p><strong>Materials:</strong></p><ul><li>Ply wood Sheet</li><li>Acrylic Sheet</li><li>MDF Sheet</li><li>Particle Board Sheet</li><li>Balsa Wood Sheet</li><li>Foam Board</li><li>Corrugated Card Sheet</li><li>Card Board</li></ul><p><strong>Helpful Software:</strong></p><ul><li>Deep Nest (Nesting Software)</li><li>Autodesk Fusion 360 (Parametric Software)</li><li>Sketch Up or Rhino (Conceptual Modeling)</li><li>Autodesk Autocad (CAD)</li></ul><p><strong>Understanding</strong></p><p><strong>Types of Indents</strong></p><p>Following are categoriesed cases based on the position of the indent on the two dimensional plane.</p><p>They are kept in a simple rounded rectancgle form for easy understanding.</p><p>Indents positioned on the edge of the two dimensional plane (A-E)</p><p>Indents positioned on the surface of the two dimensional plane (F-J)</p><p>Miscellaneous Cases (K-M)</p><img src=\"/archv-in/images/T4D-Beta-2-0/011_A.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>A</strong></p><p>Single Orthogonal Indent on Edge of 2D plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/012_B.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>B</strong></p><p><strong>L-Shaped Indent on Edge of 2D plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/013_C.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>C</strong></p><p><strong>T-Shaped Indent on Edge of 2D plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/014_D.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>D</strong></p><p>+-Shaped Indent on Edge of 2D plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/015_E.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>E</strong></p><p><strong>Single Oblique Indent on Edge of 2D plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/016_F.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>F</strong></p><p>Single Orthogonal Indent on Surface of 2D plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/017_G.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>G</strong></p><p><strong>L-Shaped Indent on Surface of 2D plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/018_H.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>H</strong></p><p><strong>T-Shaped Indent on Surface of 2D plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/019_I.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>I</strong></p><p>+-Shaped Indent on Surface of 2D plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/020_J.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>J</strong></p><p>Single Oblique Indent on Surface of 2D plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/021_L.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>K</strong></p><p><strong>Multiple Edge indents on 2S plane</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/022_M.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>L</strong></p><p>Multiple Intersecting Surface Indents on 2S plane</p><img src=\"/archv-in/images/T4D-Beta-2-0/023_K.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>M</strong></p><p><strong>Circular Void on Surface of 2D plane</strong></p><p><strong>Voids + Indents</strong></p><p>Combining indents with voids often helps in the following ways</p><ul><li>Allows interlocking multiple parts through the same void.</li><li>It also guides the turning of secondary parts.</li><li>Attaching a void to an indent helps in interlocking parts bigger in size. In this case the part size will be related to the size of the void and not the indent.</li><li>Circular voids are preferable for 360 degree turning and locking of another material.</li></ul><p>Here are a few 2D planes that feature the combination of voids and indents.</p><img src=\"/archv-in/images/T4D-Beta-2-0/024_001.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V1</strong></p><p><strong>A rectangular void added to part B</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/025_002.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V2</strong></p><p><strong>A rectangular void added to part G</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/026_003.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V3</strong></p><p><strong>A circular void added to part B</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/027_004.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V4</strong></p><p><strong>A circular void added to part I</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/028_005.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V5</strong></p><p><strong>A circular void added to part D</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/029_006.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V6</strong></p><p><strong>An indent attached to part M</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/030_007.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>V7</strong></p><p>Indents attached to the edges of triangular voids</p><p><strong>The Matrix</strong></p><p>A representational graphical matrix that reflects an analog alorithmic approach to interlocking.</p><p>The exercise attempt to comibine the 10 different types of indents, with each other in a multitude of permutations and combinations.</p><img src=\"/archv-in/images/T4D-Beta-2-0/031_Matrix.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p>This symmetrical diagram definately makes the process look more complicated than it is.</p><p><strong>Observations:</strong></p><ul><li>L-shaped indents on edge (B) work the best when one indent from the L is made wider, for a gravity lock mechanism.Could be used as an example for combination with voids.</li><li>+-shaped(C) and T-shaped(D) shaped indent on edge behave almost the same, and help interlocking in 3 axes.</li><li>Angled indents (J) will behave the same as orthogonal incisions.</li><li>When indent is on the surface of a 2D plane, the other parts need to be as wide as the length of the Indent, in order to pass through.</li><li>No uses recognized for L-shaped (G) and T-shaped (H) indents on the surface of a 2D plane.</li><li>Turning and locking is only possible with a void attached to an indent on a 2D plane.</li></ul><p>Here are a few useful curated combinations based from the matrix</p><p><strong>Simple two piece interlocks:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/032_ARCHV_T4D-AA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>AA</strong></p><p>Two identical surfaces with orthogonal notches interlocking into each other</p><img src=\"/archv-in/images/T4D-Beta-2-0/033_ARCHV_T4D-EA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>EA</strong></p><p>AN oblique notch interlocking to a othtogonal notch</p><img src=\"/archv-in/images/T4D-Beta-2-0/034_ARCHV_T4D-EE_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>EE</strong></p><p>Interlocking two surfaces with obliques notches</p><img src=\"/archv-in/images/T4D-Beta-2-0/035_0000-ARCHV_T4D-FA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>FA</strong></p><p>The width of the interlocking surface needs to be equal to the length of the indent on the surface</p><p>Three piece interlocks, are used as locking mechanisms in three axis. Their main application is used in joineries where the use of glue or screws is restricted.</p><img src=\"/archv-in/images/T4D-Beta-2-0/036_ARCHV_T4D-EC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>EC+A</strong></p><p>Parts interlocking in three axis creates a locking mechanism</p><img src=\"/archv-in/images/T4D-Beta-2-0/037_ARCHV_T4D-FC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>FC+A</strong></p><p>Parts interlocking in three axis creates a locking mechanism</p><img src=\"/archv-in/images/T4D-Beta-2-0/038_ARCHV_T4D-FDA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>FD+A</strong></p><p>Parts interlocking in three axis creates a locking mechanism</p><img src=\"/archv-in/images/T4D-Beta-2-0/039_0000-ARCHV_T4D-ED_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>ED+A</strong></p><p>Parts interlocking in three axis creates a locking mechanism</p><img src=\"/archv-in/images/T4D-Beta-2-0/040_0000-ARCHV_T4D-JC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>JC+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/041_0000-ARCHV_T4D-CA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>CA+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/042_0000-ARCHV_T4D-DA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>DA+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/043_0000-ARCHV_T4D-FF_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>FF+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/044_0000-ARCHV_T4D-IA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>IA+A</strong></p><p>We have also curated a few fun form compositions, which might not have any particular function. But are just a by-product of the exercise.</p><img src=\"/archv-in/images/T4D-Beta-2-0/045_00-ARCHV_T4D-BA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>BA+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/046_00-ARCHV_T4D-CC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>CC</strong></p><p><strong>Useful for angular parts to pass through</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/047_00-ARCHV_T4D-DC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>DC+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/048_00-ARCHV_T4D-GC_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>G+CA+CA</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/049_00-ARCHV_T4D-DD_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>DD+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/050_00-ARCHV_T4D-EB_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>EB+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/051_00-ARCHV_T4D-FE_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>FE</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/052_00-ARCHV_T4D-DB_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>DB+A</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/053_00-ARCHV_T4D-JE_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>JE</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/054_00-ARCHV_T4D-GA_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>GA</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/055_00-ARCHV_T4D-GD_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>G+DA+DA</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/056_00-ARCHV_T4D-GE_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>G+EE</strong></p><p>When voids are combined with indents, they assist interlocking of bigger sized parts as well as turning.</p><img src=\"/archv-in/images/T4D-Beta-2-0/057_0000-ARCHV_T4D-Voids-001_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/058_0000-ARCHV_T4D-Voids-002_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/059_0000-ARCHV_T4D-Voids-003_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/060_0000-ARCHV_T4D-Voids-004_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/061_0000-ARCHV_T4D-Voids-005_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/062_0000-ARCHV_T4D-Voids-006_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/063_0000-ARCHV_T4D-Voids-007_20.03.gif\" alt=\"T4D Interlocks\" loading=\"lazy\" /><p><strong>Reference Study</strong></p><p><strong>Julien Nolin Ws22</strong></p><p>This meticulously crafted furniture piece not only takes into account interlocking mechanisms, but also the material usage.</p><p><strong>Nobel Truong</strong></p><p>Simple interlocked geometries hand crafted by casting pigmented transluscent acrylic.</p><img src=\"/archv-in/images/T4D-Beta-2-0/064_I001_WS22.jpg\" alt=\"T4D Interlocks\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/065_I002_No-bel.png\" alt=\"T4D Interlocks\" loading=\"lazy\" />"
  - title: "Stacking"
    subtitle: "E \u00b7 Stacking"
    body: "<p><strong>Introduction</strong></p><p><strong>Description:</strong></p><p>Multiple parts of sheets materials can be stacked up and stuck together to form 3D objects. The various parts involved can be simulated digitally as well as crafted manually. A basic analogy would be to stack up slices of bread to make a loaf. Just imagine this loaf to be a 3 dimensional form.</p><p>Stacking of sheet materials in a staggered fashion can also be used to design orthogonal corner joineries as well as simple channel guides to assist sliding.</p><p>This method often requires a bonding material like glue to stick all the pieces together. The joining can also be done through interlocking mechanisms.</p><p>Here we have investigated available digital tools that assist the process of converting amourphous forms into stackable parts. Along with a few examples for corner joineries and their applications.</p><p>This will help you to get a basic understanding of what the possibilities with this process could be.</p><p><strong>Materials:</strong></p><ul><li>Ply wood Sheet</li><li>Acrylic Sheet</li><li>MDF Sheet</li><li>Particle Board Sheet</li><li>Balsa Wood Sheet</li><li>Foam Board</li><li>Corrugated Card Sheet</li><li>Card Board</li></ul><p><strong>Helpful Software:</strong></p><ul><li>Slicer for fusion 360 (Slicing Software)</li><li>Deep Nest (Nesting Software)</li><li>Autodesk Fusion 360 or Grasshopper for Rhino (Parametric Modelling)</li><li>Blender or Cinema4D (Digital Sculpting)</li><li>Sketch Up or Rhino (Conceptual Modelling)</li><li>Autodesk Autocad</li></ul><p><strong>Understanding</strong></p><p><strong>Cube</strong></p><p>Understanding the process of forming a cube out of stacked surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/066_ARCHV_T4D_Stack_Cube.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>Dimensions:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/067_C001.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><ul><li>Surface Spacing or thickness (T)</li><li>Length of cube (L)</li><li>Breath of cube (B)</li><li>Height of cube (H)</li></ul><p>Here, that direction of stacking is considered to be along the height. This can be altered based on the requirement</p><p><strong>Profile construction:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/068_C003.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>In this case the profile would be the the length and the breath.</p><p>Since the stacking is done in the direction of the height.</p><p><strong>Surface Profiles:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/069_C002.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Number of parts (N) : H/T</p><p>Here the number of parts is determined by the spacing and the distance to be stacked</p><p><strong>Tetrahedron</strong></p><p>Understanding the process of forming a tetrahedron out of stacked surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/070_ARCHV_T4D_Base-Stack_Tetrahedron.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>Dimensions:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/071_T001.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Surface Spacing or thickness: T</p><p>Side of Tertagedron (S)</p><p>Height of Tertagedron (H)</p><p>Here, that direction of stacking is considered to be along the height. This can be altered based on the requirement</p><p><strong>Profile construction:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/072_T003.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>The profile sizes would variate.</p><p>This is because the side (S) of each trigular profile stacked would be determined by the surface spacing/thickness (T) intersecting the profile of the base triangle.</p><p><strong>Surface Profiles:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/073_T002.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Above you can view the sizes of the triangular profiels reducing.</p><p><strong>Sphere</strong></p><p>Understanding the process of forming a sphere out of stacked surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/074_ARCHV_T4D_Base-Stack_Sphere.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>Dimensions:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/075_S001.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Surface Spacing or thickness: T</p><p>Diameter (D)</p><p>Number of parts= D/T</p><p><strong>Profile construction:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/076_S003.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>The profiles would be circular in shape, and would reduce in diameter.</p><p>This diameter would be determined by the surface spacing/thickness (T) intersecting the profile of the base circle.</p><p><strong>Surface Profiles:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/077_S002.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Above you can view the reducing sizes of the circular profiles. Because the sphere is a symmetrical shape, the profiles beow and above the base circlur profile would be the same.</p><p><strong>Organic Sculpted Form</strong></p><p>Understanding the process of slicing a sculpted form into stacked surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/078_Stacked-Banner.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>Organic Form:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/079_OSF.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Digital Software for sculpting OBJ or STL files:</p><p><strong>Autodesk Fusion 360</strong></p><p><strong>Rhino</strong></p><p><strong>Blender</strong></p><p><strong>Cinema 4D</strong></p><p>If you have handsculpted the form or have a physical reference of the form you would want to model.</p><p>Click multiple images of your exisitng physical model and stictch them together.</p><p>This will help you generate a mock up of your physical model</p><p><strong>Surface Profiles:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/080_OSF009.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Since all profiles would have a unique shape, digital aid simplifies the task.</p><p>To slice the digital model into multiple surfaces, we reccomend Slicer for Fusion 360 .</p><p><strong>Here are a few tutorials for reference:</strong></p><p><strong>Tutorial 1</strong></p><p><strong>Tutorial 2</strong></p><p>This could also be generated by a grasshopper parametric script.</p><p><strong>Stacked form:</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/081_Rotating.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>The parameters you need to keep in mind:</strong></p><ul><li>Material</li><li>Sheet size and thickness</li><li>Axis of stacking</li><li>Dimension of the model</li><li>Method of attaching the surfaces together</li></ul><p>(glue or screws)</p><p><strong>Staggered Stacking</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/082_ARCHV_T4D_Base-Stack_Stagger.gif\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>Two dimensional surfaces that are thick can be stacked in a staggered form sectionally, to increase their joining applications.</p><p>These joineries can either be used to fix two staggered sufaces linearly or orthogonally to form edges and corners.</p><p>The below examples represent sectional views of thick two dimensional stacked surfaces:</p><img src=\"/archv-in/images/T4D-Beta-2-0/083_ST01.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>01. Corner Joint</p><p>Idnentical Stacked surfaces in a stepped stagger can be used to form orthoganal corner joineries</p><img src=\"/archv-in/images/T4D-Beta-2-0/084_ST02.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>02. Expansion Joint</p><p>These sections can also be used to expand the size of stacked sheet material</p><img src=\"/archv-in/images/T4D-Beta-2-0/085_ST03.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>03. Expansion Joint</p><p>Similar to the tongue and groove wooden joint or the male female joinery</p><img src=\"/archv-in/images/T4D-Beta-2-0/086_ST04.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p>04. Channel Gap</p><p>The above section formed by stacking 3 staggered surfaces, act as a channel guide for a single sheet to pass through</p><p><strong>Reference Study</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/087_S001_David-Spriggs.png\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>David Spriggs</strong></p><p>David Spriggs uses tranparent sheets that stack up to form a dynamic 3D compositions.</p><img src=\"/archv-in/images/T4D-Beta-2-0/088_S002_Topo-Arts.jpg\" alt=\"T4D Stacking\" loading=\"lazy\" /><p><strong>Dennis van hoof</strong></p><p>Experiments with stacking plywood in multiple axis and CNCing sculpted forms to reveal the organic grains of the material edges.</p>"
  - title: "Folding"
    subtitle: "F \u00b7 Folding"
    body: "<p><strong>Introduction</strong></p><p><strong>Description:</strong></p><p>A single surface can be folded into multiple surfaces that create a 3D object. Splitting up a 3D object into multiple foldable parts allows for portabilty and allows ease of transportaion and storage. Folding a surface in a particular format also increases its structural integrity.</p><p>The roots of the folding geometry lie in folding simple planar material like paper through origami. Now they have now found its applications in more complex dployable mechanisms.</p><p>We have explored development of surfaces as well as a few crease methods and patterns to undertand the potential of folding surfaces.</p><p><strong>Materials:</strong></p><ul><li>Paper (various GSM)</li><li>Steel, aluminium Sheets</li><li>Corrugated Card</li><li>File Card</li></ul><p><strong>Helpful Software:</strong></p><ul><li>Pepakura</li><li>Slicer for fusion 360 (Slicing Software)</li><li>Deep Nest (Nesting Software)</li><li>Autodesk Fusion 360 or Grasshopper for Rhino (Parametric Modelling)</li><li>Blender or Cinema4D (Digital Sculpting)</li><li>Sketch Up or Rhino (Conceptual Modelling)</li><li>Autodesk Autocad</li></ul><p><strong>Understanding</strong></p><p><strong>Symbols Nomenclature</strong></p><p>Below are universal symbols used to represnt folding instructions.</p><img src=\"/archv-in/images/T4D-Beta-2-0/089_ARCHV_Folding_Diagrams_Nomencloature-001.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p>Inspired by Origami, here are different kinds of folds possible with thin surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/090_ARCHV_Folding_Diagrams_Nomencloature-002.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Creases</strong></p><p>A crease is a line on a planar surface produced by folding along that line.</p><p>In thinner materials like paper, these creases are easy to create.</p><p>Whereas in slightly thicker materials with higher density, perforations might be required along the creases line. These perforations reduce the torsional stress along the crease line, making it easy to fold along the crease axis. Perforated crease folds are commonly used in thicker materials like steel, aluminium sheets.</p><img src=\"/archv-in/images/T4D-Beta-2-0/091_ARCHV_Folding-GIF_00A.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/092_ARCHV_Folding-GIF_00B.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Crease Patterns</strong></p><p>Different kinds of folds can be made along different composition of crease patterns. Paul Jackson\u2019s book Folding Techniques, uses paper as a base material and explains the potential of folding techniques very thoroughly. Like Ikea instructions, origami instructions diagrams in the book are a language by themselves. Learning from the book, we have experimented with different crease patterns to represent folding can morph a 2D flat surface into a 3D form.</p><img src=\"/archv-in/images/T4D-Beta-2-0/093_ARCHV_Folding_Diagrams_Pattern-001.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 001</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/094_ARCHV_Folding_Diagrams_Pattern-002.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 002</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/095_ARCHV_Folding_Diagrams_Pattern-003.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 003</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/096_ARCHV_Folding-GIF_001c.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 001 Folded</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/097_ARCHV_Folding-GIF_002c.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 002 Folded</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/098_ARCHV_Folding-GIF_003c.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Pattern 003 Folded</strong></p><p><strong>Deployable Structures</strong></p><p>Folding also allows a surface to be compressed into a compact version and expand itself into its complete form. These mechanisms have a lot of applications when it comes to transportation, storage and engineering. Brigham Young Universities CMR (Compliment Mechanisms Research Group) involves students and faculty who are involved in the fields of Compliant Mechanisms , Developable Mechanisms and Origami-Inspired Mechanisms.</p><img src=\"/archv-in/images/T4D-Beta-2-0/099_ARCHV_Folding-GIF_005c.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Deployable example 001</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/100_ARCHV_Folding-GIF_004c.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Deployable 002</strong></p><p>Surface Development for Basic and Complex Geometries</p><p>Many dots make a line, many lines make a surface and many surfaces make a 3D object. 3D objects with a Gaussian curvature as 0 are developable.</p><p>A developable surface is a surface that can be opened up or unfolded into parts of flat surface.</p><p>The figure below shows unfolded versions of the 3D objects in a flat format. These flat formats include the number of surfaces and their shape that make up the 3D object.</p><p>Likewise, all developable 3D object can be opened up into a series of flat surfaces, which can be folded and joined together.</p><p>3D objects and surfaces that involve curvatures in multiple axis, such as a sphere, need to be simplified in order to be developed.</p><img src=\"/archv-in/images/T4D-Beta-2-0/101_ARCHV_Folding_Diagrams_Surface-Development-Basic.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p>Complex sculpted geometries can be converted into simpler developable surfaces too.</p><p>This is done with the help of digital tools like Pepakura or Slicer by fusion 360, which convert STL/OBJ file into developed surfaces.</p><img src=\"/archv-in/images/T4D-Beta-2-0/102_0000-ARCHV_T4D-Folding-B12_20.04.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Complex Organic Sculpted form</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/103_ARCHV_Folding_Diagrams_Folded-Buddha.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p>Developed surfaces that can be joined together</p><img src=\"/archv-in/images/T4D-Beta-2-0/104_0000-ARCHV_T4D-Folding-B2_20.04.gif\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Simplified developed geometry</strong></p><p><strong>Reference Study</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/105_F001_Buxton_Mikroworld_15_small.jpg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Sam Buxton</strong></p><p>Uses tiny thin metal sheets that open up to potray beautiful scenes.</p><img src=\"/archv-in/images/T4D-Beta-2-0/106_F002_Compliant.png\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Compliant Mechanisms</strong></p><p>Is a reseach group that is involved in the field of Developable Mechanisms and Origami-Inspired Mechanisms.</p><img src=\"/archv-in/images/T4D-Beta-2-0/107_F003_Choma.jpeg\" alt=\"T4D Folding\" loading=\"lazy\" /><p><strong>Joseph Choma</strong></p><p>He is the author of Morphing: A Guide to Mathematical Transformations for Architects and Designers . which looks into the intersection of mathematics, folding, structure and materials.</p>"
  - title: "Bending"
    subtitle: "G \u00b7 Bending"
    body: "<p><strong>Introduction</strong></p><p><strong>Description:</strong></p><p>Sheet materials with extremely low bending capacity do not have the ability to fold or curve. But this can be easily changed by adding kerf cuts along the surface. A slit made perpendicular to the thickness of a material is called a kerf cut . They essentially reduce the thickness of the surface at regular intervals, since thinner sections are easier to bend.</p><p>The orientation and form of the kerf cuts determine the ability of the sheet material to bend organically into any desired three dimensional form.</p><p>In a small book, DIGITAL Gehry Material Resistance Digital Construction (Bruce Lindsey, Bitkh\u00e4user 2001) writes that if flat piece cost one dollar, single curvature piece cost two dollars, double curvature piece cost ten dollars. This is true for all materials.</p><p><strong>Materials:</strong></p><ul><li>Ply wood Sheet</li><li>Acrylic Sheet</li><li>MDF Sheet</li><li>Balsa Wood Sheet</li></ul><p><strong>Helpful Software:</strong></p><ul><li>Adobe Photoshop+Illustrator</li><li>Autodesk Fusion 360 or Grasshopper for Rhino (Parametric Software)</li><li>AutoCAD (CAD)</li></ul><p><strong>Understanding</strong></p><p><strong>Simple Straight Kerf Cuts</strong></p><p>A two dimensional surface can be bent simply by the help of living hinges.</p><p>A living hinge is made of the same material as the two pieces it connects. It is either a cut or a thinned portion, that allows the surface to bend. Due to the reduced thickness, it becomes easier for the material to defrom at that point.</p><p>The cut (also known as kerfs) can be along a single line or multiple lines, based on the material and the radius of the bend.</p><p>The parameters would vary with respect to the physical properties of the material.</p><p>With the help of kerfs, sheet materials can be bent by a particular radius along a single axis.</p><img src=\"/archv-in/images/T4D-Beta-2-0/108_ARCHV_Bending_Diagrams_20.04.06.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>Kerfs are usually made perpendicular to the thickness of the sheet material.</p><p>The number and distance of the kerf lines are dependant upon the following parameters:</p><ul><li>Angle of Bend (\u00f8)</li><li>Radius of the curve (R)</li><li>Thickness/Width of the kerf, based on the tool that is being used (T)</li><li>However the optimum depth (D) of the kerf cut cannot be pre-determined. It depends on the physical properties of the sheet material in hand. So it is advised to test the kerf depth once on scrap material before.</li></ul><p>The number and distance of the kerf lines is determined in the following way:</p><p>001 //</p><p>The Length of the arc (L) essentially helps us determine the length of the sheet material that would have kerf marks.</p><p>Length of the Arc (L)= R x \u00f8</p><p>002 //</p><p>The number of kerf marks can be determined by the following formula\u2019</p><p>Number of kerf marks (n)= 0.133 x \u00f8</p><p>(rounded of the closest integer)</p><p>003 //</p><p>The Kerf distance (K) is the distance between the kerf lines within the protion of the sheet material covering the arc length.</p><p>Kerf Distance (K)= L / n</p><p><strong>For example:</strong></p><p>180deg(\u00f8) bend- 24 lines of kerf will be divided equally along the lenth of the arc</p><p>90deg(\u00f8) bend- 12 lines of kerf will be divided equally along the lenth of the arc</p><p>This method helps us understand the logic behind bending sheet materials and can be easily applied while making kerfs manually or with the help of CNC.</p><p>You can find a Online Kerf Spacing calculator: here</p><p><strong>Lattice hinges</strong></p><p>In order to increase the flexibilty of rigid materials, the straight kerf lines have been evolved into lattice hinges.</p><p>They are fomred when overlapping alternating cuts divide the surface of a material into smaller linked surfaces, as shown in the diagram below by Deferred Procrastination. These surface links make it easier for the each column to twist along its own length.</p><p>Bending in lattice hinges is caused by columns of torsional links which are easily twisted. They are interconnected on fixed points, by increasing the distance between these fixed points and decreasing width of the torsional link we can increase flexibility to a surface.</p><img src=\"/archv-in/images/T4D-Beta-2-0/109_Torsional_Links.png\" alt=\"T4D Bending\" loading=\"lazy\" /><p><strong>Images from defproc</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/110_bending.png\" alt=\"T4D Bending\" loading=\"lazy\" /><p>The math behind the torsional force acting on the hinge is thoroughly explained by the engineers at Defproc. You can visit the link here: ( Link 1 ) ( Link 2 )</p><p><strong>Patterns</strong></p><p>The idea of lattice hinges has been explored further in form of 2D experimental patterns by the folks at fequalsf, obrary and kofactor lab.</p><p>We have arranged them in a hierarchy of evolution to understand and analyse the attributes of their forms.</p><img src=\"/archv-in/images/T4D-Beta-2-0/024_001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>001</p><p><strong>Straight Lattice</strong></p><p>Here the overlapping kerf lines divide the surface into smaller torsional links, allowing them to deform in parts</p><img src=\"/archv-in/images/T4D-Beta-2-0/025_002.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>002</p><p>Rhombus Voids \u2022 The kerf line is replaced by a void in the form of a rhoumbus.</p><ul><li>This decreases the size of the link and increase the clearance for the link to twist.</li><li>The thin links become a cross shape with rhombus voids.</li><li>If stretched vertically the pattern become an orthogonal grid at 45\u00ba.</li><li>The shorter diagonal of the rhombus keeps the link clearance just about enough for the long link to twist.</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/026_003.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>003</p><p><strong>Isoceles Triangluar Voids</strong></p><ul><li>The longer diagonal of the rhombus are attached to form an extra link.</li><li>This in turn forms 2 back to back isoceles triangualar voids.</li><li>The extra link assists retaining the surface\u2019s strength.</li><li>The lengths of the links variate</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/027_004.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>004</p><p><strong>Eliptical Curves</strong></p><ul><li>The edges of the rhombus are filletted</li><li>Curved edges variate the widths of the lnks formed.</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/028_005.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>005</p><p><strong>Three Elliptical Voids</strong></p><ul><li>The repititiv rhythm of curved voids forms undulating links of variating widths and lengths.</li><li>The organic form of the links might assist in twisting along a defined axis.</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/029_006.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>006</p><p>Waves \u2022 The overlap between the kerf cuts is extremely short.</p><ul><li>The displacement of the the straight makes the link widths taper on either sides.</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/030_007.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>007</p><p><strong>Cross Lattice</strong></p><ul><li>Branching kerf cuts, forms links in 4 angles in opposite directions.</li><li>The more braches, porbably the more directions/ angles to bend in .</li><li>Concentric links formed, with a the surfaces twisting on the peripheriy of the middle piece.</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/118_008.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>008</p><p><strong>Hexagonal Voids</strong></p><ul><li>Hexagonal voids with kerf cuts on the perpheriry.</li><li>This creates different sizes of links in 6 different angles, mirrored in to opposite directin</li></ul><img src=\"/archv-in/images/T4D-Beta-2-0/119_009.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>009 Concentric Triangle</p><p>The straight overlapping alternating kerf cut lines, translated into a concentric triangular format</p><img src=\"/archv-in/images/T4D-Beta-2-0/120_010.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>010 Spiral</p><p>Links formed in a perpendicular direction spiral in opposite direction. This is explained further below in Multiaxial Bending.</p><p>Based on our observations the flexibility of a surface can be increased by</p><ul><li>Increasing the thickness of the kerf, essentially converting a cut to a void</li><li>Preventing sharp edged corners, hence filleting the corners and edges.</li><li>Increasing the length and width of the link</li><li>Branching kerf cuts in multiple directions, make the torsional links twist in different directions.</li></ul><p>Below are a few experimental pattern developments using the combination of voids and kerfs and concentric grid systems.</p><img src=\"/archv-in/images/T4D-Beta-2-0/121_ARCHV_Bending_Diagrams_P004.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/122_ARCHV_Bending_Diagrams_P002.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/123_ARCHV_Bending_Diagrams_P001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/124_ARCHV_Bending_Diagrams_P003.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>You can email us for the open files of the above patterns, to experiment yourself.</p><p>You will need a CNC mill or laser machines cut these precise patterns on sheet materials like plywood and acrylic.</p><p><strong>Multiaxial Bending</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/125_Bending-Dev-001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>Adding alternate simple kerfs cuts on opposite sides of a thick surface enables it to bend in two directions, as shown in the above diagram.</p><p>For a surface to bend in muliple axes they can be divided into developable and non-developable surfaces.</p><p>A developable surface is a surface that can be opened up or unfolded into a flat surface. Refer to Surface development in the Folding Section.</p><p>A non- developable on the other hand cannot be opened or unfolded into a flat surface. They are made up of curves that bend in multiple axis, hence having a Positive or Negative value for their Gaussian curvature.</p><p><strong>Curved developable surface</strong></p><p>Surfaces can be bent in multiple directions by using lattice hinge patterns with rigid materials. To create a developable curve, a surface can be bent either by kerfs in the form of parallel lattice hinges or spiral pattern.</p><p><strong>Lattice pattern for developable surface:</strong></p><p><strong>A Grasshopper experiment</strong></p><p>We have used a method developed by fequalsf (Download grasshopper script) to understand how a lattice pattern can be applied to a curved surface. The approach is a crude approximation.</p><img src=\"/archv-in/images/T4D-Beta-2-0/126_Multiaxial-Bending-001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/127_0000-ARCHV_T4D-Bending_20.04.gif\" alt=\"T4D Bending\" loading=\"lazy\" /><p><strong>Nomenclature:</strong></p><ul><li>U Count is the number of divisions in the U direction (parallel to the cuts)</li><li>V Count is the number of divisions in the V direction (perpendicular to the cuts)</li></ul><p>For the grasshopper script to work we need 3 inputs:</p><p>(1) 3d curved surface</p><p>(2) An Unrolled surface you can do this by unroll command in rhino ( Surface&gt;Unroll Developable Srf ).</p><p>(3) 2d kerf pattern unit</p><p>Hereby knowing the change in curvature across the surface. Areas with very little change can have wider and less flexible hinges, while areas with a lot of change will need thinner and more flexible hinges.</p><p>The settings at the beginning of the definition will change your pattern for laser cutting. Typically it will be smaller U count and larger V count so that your lattice pattern is longer and more flexible.</p><p>The Domain start and Domain end sliders are the factors determining the curvature of the surface setting the Domain end value to somewhere between 0.4 and 0.6 tends to work the best.</p><p>For detailed understanding refer this (Link)</p><p><strong>Spiraling pattern creation</strong></p><p>The logic behind lattice hinges is translated by kofactor lab, by converting the linear parallel forms of the lattice hinges into a rectangular spiral. (pattern 10 analysed above)</p><p>This allows the segments to twist in two opposite directions simultaneously, making the distance between the fixed points longer. This all amounts to morphing a rigid surface into a flexible surface.</p><p>Below are a few experimental pattern developments using the same understanding.</p><img src=\"/archv-in/images/T4D-Beta-2-0/128_Dev-006.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/129_Dev-001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/130_Dev-003.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><img src=\"/archv-in/images/T4D-Beta-2-0/131_Dev-004.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>Non-developable surfaces also can be formed by expanding the lattice hinge pattern, but this is possible with flexible materials only. Since flexible materials have the ability to stretch into a doubly curved surface. A flexible surface is hence allowed to stretch and open up, leaving the vertices of the lattice hinges connected. The gaussian curvature of the surface is directly proportional to opening/voids in the pattern.</p><p><strong>Reference Study</strong></p><img src=\"/archv-in/images/T4D-Beta-2-0/132_B001.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p><strong>Andreas Bastian</strong></p><p>Mesostructure patterns allows manipulations of bulk material properties.</p><img src=\"/archv-in/images/T4D-Beta-2-0/133_B003.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p>fequalsf</p><p>Experiments with parametric multiaxial kerf patterns</p><img src=\"/archv-in/images/T4D-Beta-2-0/134_B002.jpg\" alt=\"T4D Bending\" loading=\"lazy\" /><p><strong>Kofactor Lab</strong></p><p>Developed the spiral kerf pattern, allowing multiaxial bending in rigid materials</p>"
