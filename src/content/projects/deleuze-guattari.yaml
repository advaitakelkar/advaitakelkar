description: |
  <div class="desc-scroll">
    <p>Deleuze and Guattari wrote in plateaus rather than chapters — twelve of them, each one enterable from anywhere and none of them a conclusion. This is that book read back as pictures: twelve plateaus, three panels each, one figure standing in every one of them.</p>
    <p>The figure is always the same, always centred, always opened to show the mechanism inside — circuit-scaffold, cable looms, enamel chips. What changes is what the mechanism is doing, and the three panels of a plateau are its three states: the thing appears and locks, a hairline cut opens it, and the flows escape. The cut is the event, not the reveal. Panel two is almost panel one.</p>
    <p>Everything else is held still so that change is the only thing you can read. Nineteenth-century engraving throughout, a locked nine-colour palette on a near-black ground, eye-level full figure at the same scale, no perspective, no vanishing point, architecture only along the ground line. No borders — the canvas reaches every edge, which is the one rule the book itself would have insisted on.</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
    <em>Plateaus: Desiring-Machines · Body without Organs · Three Social Machines · Rhizome and Tree · Faciality · Becoming-Animal · Smooth and Striated · The Bent Head · Contiguous Offices · Chaos and the Plane · Three Forms of Thought · The Monument.</em>
  </p>
  </div>

