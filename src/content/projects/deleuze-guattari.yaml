description: |
  <div class="desc-scroll">
    <p>Deleuze and Guattari wrote in plateaus rather than chapters — twelve of them, each enterable from anywhere and none of them a conclusion. This is that book read back as pictures: twelve plateaus, nine panels each, one figure standing in every one of them.</p>
    <p>The nine are an argument, not a gallery. Panels a to c are molar — the thing appears, organises, and locks. Panels d to f are molecular — a hairline opens, the cut widens, the flows overrun it. Panels g to i are the line of flight — the form breaks, the content disperses, and something remains standing. The cut is the event rather than the reveal, which is why panel d is almost panel c: one hairline apart, and everything after it follows from that.</p>
    <p>Everything else is held still so that the change is the only thing you can read. Nineteenth-century engraving throughout, a locked nine-colour palette on a near-black ground, the same figure at eye level at the same scale, no perspective, no vanishing point, architecture only along the ground line. No borders — the canvas reaches every edge, which is the one rule the book itself would have insisted on.</p>
    <p>The first plateau ends on One Standing Line. So does the twelfth.</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
    <em>Plateaus: Desiring-Machines · Body without Organs · Three Social Machines · Rhizome and Tree · Faciality · Becoming-Animal · Smooth and Striated · The Bent Head · Contiguous Offices · Chaos and the Plane · Three Forms of Thought · The Monument.</em>
  </p>
  </div>

  <div class="prompt-box">
    <div class="prompt-header">
      <span class="prompt-header-title">Prompt</span>
      <button class="copy-prompt-btn" aria-label="Copy prompt">
        <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span class="copy-btn-text">Copy</span>
      </button>
    </div>
    <div class="prompt-body">
      <span class="prompt-text">"19th-century masterwork engraving and etching, chromoxylography style. A single full figure at eye level, middle distance, occupying about 55 percent of frame height. No perspective, no vanishing point. Wide bare black above and to the sides. The figure's body is opened to show mechanism: circuit-scaffold, cable looms, pastel enamel chips. Architecture enters only along the ground line — a low sea wall, tetrapods, plumbing — running off both edges, nothing built above that line. Strictly edge-to-edge canvas with zero borders or frames. Locked nine-colour palette on a near-black ground."</span>
    </div>
  </div>
