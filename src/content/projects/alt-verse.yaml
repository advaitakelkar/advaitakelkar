description: |
  <div class="desc-scroll">
    <p>Fifty iconic Hollywood characters, recast as if each film had been conceived and shot in Indian cinema. Across fifteen landmark films — from 1970s gangster epics to 1990s cult cinema and modern auteur works — the role, dramatic status, and psychological core of each character are preserved in full, while the casting, wardrobe, props, and environments are transplanted into period-authentic Indian settings.</p>
    <p>Each film inhabits a specific Indian world: The Godfather on a 1940s Malabar Hill estate, Goodfellas through the smuggling docks of 1970s Bombay, Pulp Fiction across 1990s Irani cafes, Shawshank within a colonial Deccan central jail, and Home Alone inside a winter-fogged Delhi bungalow. Photographed in waist-up 35mm film stills with dramatic chiaroscuro lighting, tactile natural textures, and period-correct tailoring.</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
      <em>The Godfather (6): Don Vito Corleone, Michael Corleone, Sonny Corleone, Fredo Corleone, Tom Hagen, Kay Adams<br><br>
      Goodfellas (5): Henry Hill, Jimmy Conway, Tommy DeVito, Karen Hill, Paulie Cicero<br><br>
      Pulp Fiction (5): Jules Winnfield, Vincent Vega, Mia Wallace, Marsellus Wallace, Butch Coolidge<br><br>
      Fight Club (3): The Narrator, Tyler Durden, Marla Singer<br><br>
      The Shawshank Redemption (3): Andy Dufresne, Ellis Redding, Warden Samuel Norton<br><br>
      Home Alone (3): Kevin McCallister, Harry, Marv<br><br>
      Rocky (3): Rocky Balboa, Adrian Pennino, Mickey Goldmill<br><br>
      The Terminator (3): The T-800, Sarah Connor, Kyle Reese<br><br>
      Reservoir Dogs (3): Mr. White, Mr. Pink, Mr. Blonde<br><br>
      Inglourious Basterds (3): Colonel Hans Landa, Lieutenant Aldo Raine, Shosanna Dreyfus<br><br>
      Django Unchained (3): Django, Dr. King Schultz, Calvin Candie<br><br>
      Kill Bill: Vol. 1 (3): The Bride, O-Ren Ishii, Bill<br><br>
      Scarface (3): Tony Montana, Elvira Hancock, Manny Ribera<br><br>
      Taxi Driver (2): Travis Bickle, Betsy<br><br>
      Once Upon a Time in Hollywood (2): Rick Dalton, Cliff Booth</em>
    </p>
  </div>

