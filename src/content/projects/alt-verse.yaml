      <span class="prompt-text">"Tack sharp cinematic 35mm film still from an Indian remake of [Film], set in [Indian Place & World]. [Character], [Role], recast as an Indian [Archetype] with the exact iconic physical body features, facial structure, and silhouette of the original character transposed to Indian casting. Role, status and psychology exactly as in the original; everything cultural is Indian and period-correct. Wearing [Authentic Indian Wardrobe]. Setting: [Period Setting]. [Iconic Prop]. Expression: [Psychological Expression]. Medium shot, waist-up portrait, the character slightly off-centre and looking just off-camera, the room or street behind them clearly readable. Lighting: dramatic chiaroscuro, sculpting facial features and casting rich cinematic shadows while keeping the face clearly visible and readable. Cinematic movie quality, tack sharp focus on face and eyes, visible natural skin texture with pores, authentic fine 35mm film grain, muted earthy period palette, anatomically perfect realistic hands."</span>
