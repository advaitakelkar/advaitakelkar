description: |
  <p>A civic landscape intervention designed for the Brihanmumbai Municipal Corporation (BMC) transforming an underused public parcel in Borivali into Mumbai’s premier dedicated pet park. The project rethinks the public ground, offering domestic animals and their owners a shared, high-functioning recreational commons carved out of dense suburban fabric.</p>
  <p>The ground plane is sculpted into a series of undulating earth mounds integrated with reinforced concrete crawl tunnels, timber ramps, stepping tires, and crushed aggregate play courses designed to encourage agility and exercise. Mature canopy trees are preserved and framed with solid green marble cube benches, creating cool, shaded seating nodes for handlers and neighborhood visitors along the perimeter.</p>
  <p>Self-initiated with Faizan Khatri and Devarsh Deth, the project was officially presented to and approved by the Mayor of Mumbai and municipal corporators, establishing a replicable prototype for animal-friendly civic infrastructure across the metropolitan region.</p>

