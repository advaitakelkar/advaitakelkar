designBrief:
  abstract: >-
    This M.Arch urban design study reimagines Union Pier as a waterfront neighbourhood with distinct quarters. The south draws on the French Quarter through fuller street walls, shaded shopfronts, shutters and iron balconies. The western neighbourhood reinterprets Ansonborough through houses, side piazzas and planted courts. Larger northern apartment blocks use masonry piers, steep roofs and restrained Gothic references to establish a different civic scale. Most southern and western buildings rise three to four storeys; the northern courts rise four to five, with hotels and selected cultural buildings forming taller landmarks. The Bennett Rice Mill façade anchors a heritage garden linked to a contemporary gateway. Between the two principal lawns and the harbour, the ground rises as a continuous planted landform, carrying walking routes and level market terraces. A proposed extension of the Battery's protective edge supports a fixed public platform, with covered parking below and a contemporary market and promenade above. Beyond the fixed terrace, a timber pier on stilts breaks from the city grid. Six larger garden halls and twelve smaller, rotated market halls frame outdoor courts. Iron roof trusses and translucent glazing shelter visible stalls; connected paths lead through planted ground to the public pier. A single service lane reaches the upper platform, with a limited number of service and shop bays beside it. The proposal combines a denser urban fabric with shaded passages, tree canopy and an accessible public ambition at the water.
  hypothesis: >-
    Can a protective waterfront edge become a continuous piece of public landscape? Distinct neighbourhood quarters, shaded courts and a local market extend Charleston's pedestrian life across the former port site, while a graded park connects the two main lawns to the raised waterfront.
  brief: >-
    Reconnect Union Pier through denser courtyard blocks, distinct neighbourhood characters and a continuous planted approach to the waterfront. Support local traders in eighteen covered market halls, keep a G+1 maximum, and connect gardens, outdoor courts and the stilt-supported timber pier. Keep parking out of the market courts; provide lower covered parking and limited upper service and shop bays beside one continuous lane. Shape the harbour edge for fishing and sitting, with separate courts that collect rainwater. Use the actual model to check walking-route grades and seasonal shade. Model levels, building access, parking, drainage and the protective edge require further survey and engineering coordination.
description: >-
  <p>ARCH 717 — Graduate Studio I: Urban Design and Development. An academic proposal for Charleston's Union Pier, developed through site planning, architectural massing and public-space design.</p>
  <p>The neighbourhood study reads Ansonborough, Lodge Alley and Charleston's piazzas as patterns of brick, thresholds and courts. These references guide the western homes, southern mixed-use streets and selected civic accents, while a shared material palette gives the quarters a related but distinct identity. <a href="#charleston-study">Read the urban study</a> · <a href="#material-palette">Explore the material palette</a> · <a href="#soft-city">Follow the Soft City narrative and review</a>.</p>
  <p>The south, west and north have different architectural characters. French Quarter influences inform the southern street walls, balconies and shopfronts; Ansonborough informs western houses and piazzas. Larger northern courtyard apartments introduce steep roofs, masonry rhythms and selected pointed openings. These are contemporary design interpretations, developed alongside the existing urban context. Terraced hotels, sculpted cultural buildings and a daylit museum form six modern landmarks. Warm ivory, buff stone and muted green metal relate them to their neighbourhoods; the garden hotel gains a substantially deeper wing.</p>
  <p>The two principal lawns continue into an urban landform that rises toward the harbour. Broad walking routes cross this planted slope and meet level market terraces. Trees and covered edges accompany the route; the former abrupt grey platform edge becomes part of the landscape. The current model tests three main walks at 4.4 metres wide, with maximum centreline grades of approximately 4.6%, 3.7% and 3.5%. These are geometric checks, with detailed accessibility and construction coordination still to follow.</p>
  <p>The bazaar combines six larger garden halls with twelve smaller halls scattered in different directions towards the pier. Open stalls, exposed roof trusses, coloured gable glazing and translucent roof panels reinterpret Barcelona’s La Boqueria. Six outdoor sitting areas and thirty entrance connections extend trading into a network of public courts and garden walks. The old rectangular market deck patches and seating grid are removed.</p>
  <p>Covered parking remains below the inner terrace. One 4.2-metre service lane continues onto the pier through a smooth cut in the platform, with eight limited service bays. Market courts remain free of parking. The sampled service-road centreline reaches about 2.65%; the new market entrance branches remain below 4.58%. These geometry checks do not establish accessibility or emergency-vehicle compliance.</p>
  <p>Beyond the fixed terrace, a timber pier on conceptual piles accommodates five harbour cutouts, six open shade pavilions, two activity courts and two separate rain courts. Fishing, sitting, exercise and views shape a public waterfront without a swimming or new boat-docking programme.</p>
  <p>David Sim’s <em>Soft City</em> guides a six-part narrative and nine evidence-based design questions. Public projects by Studio Gang and Steven Holl Architects inform the original landmark studies; those architects did not design or endorse this proposal. Earlier shade percentages are superseded by revision G and must be recalculated, including the glazing’s transmission. Historical context mapping, surveyed levels, coastal engineering and detailed access remain further study stages. This independent academic proposal is separate from the official Union Pier redevelopment.</p>
