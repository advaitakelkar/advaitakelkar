smallIntro: >-
  From port ground to a waterfront neighbourhood: streets, gardens, market terraces and a public route to
  Charleston’s harbour.
people:
  - Catalina Pesea-Ogletree
  - Advaita Kelkar
category: academic
designBrief:
  abstract: >-
    Union Pier is an academic proposal for a mixed-use waterfront neighbourhood in Charleston. It connects the
    city to the harbour through housing courts, shared gardens, a market and a public timber platform. The
    project reads the scale of surrounding streets and neighbourhoods, then develops a sequence from the front
    door to the water. A central park brings the quarters together, while terraced public space connects the
    lawns, civic buildings and raised waterfront edge. Plans, block studies and sectional perspectives examine
    this relationship at different scales.
  hypothesis: >-
    Can the former port become a connected part of everyday city life? Streets, shaded courts and shared
    gardens form a public sequence that reaches across the site to the harbour.
  brief: >-
    Develop a waterfront neighbourhood with housing, commerce, civic buildings and continuous public space.
    Connect the city’s streets to the park, market and pier. Use plan and section together to study
    thresholds, level changes, covered parking and the raised public edge. The project remains a design study;
    coastal protection, structural systems and detailed access require further development.
description: >-
  <p>ARCH 717 — Graduate Studio I: Urban Design and Development. A M.Arch design study for Charleston’s Union
  Pier.</p>

  <p>The proposal turns a large port parcel into a sequence of streets, planted courts, lawns and market
  terraces. Different block types give housing, shops and civic uses a place within that sequence, while the
  public platform extends everyday activity to the harbour.</p>

  <p>The documentation moves from the peninsula to the masterplan, then into individual blocks, street
  sections and material details. <a href="#project-documentation">Explore the project documentation</a> · <a
  href="#up-transformation">Compare before and proposed views</a>.</p>
