designBrief:
  abstract: >-
    This M.Arch urban design project proposes the redevelopment of Union Pier in Charleston as a mixed-use waterfront district. It examines how a large, heavily paved site can reconnect with the scale, streets and public life of the historic city. The proposal retains the historic Battery Wall as an organising edge and places public parking in a semi-basement to support a pedestrian-oriented ground level. A waterfront bazaar and commercial spaces activate the lower levels, with housing above and green spaces between built clusters. A cantilevered pier deck extends public access over the water. The design develops the relationship between heritage, contemporary development and everyday use through a masterplan, building massing, street sections and a connected sequence of public spaces.
  brief: >-
    Reconnect Union Pier to Charleston through a mixed-use waterfront masterplan. Unite the Battery Wall, market quarter, housing and pier deck around continuous public space, with semi-basement parking below.
