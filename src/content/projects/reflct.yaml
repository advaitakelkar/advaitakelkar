chapters:
  - title: "RFLCT"
    subtitle: "RFLCT at Celebrate Bandra"
    body: "<p class=\"ch-statement\">A self-funded, mirrored tetrahedral light sculpture that caught the street and the people passing through, reflecting the neighbourhood back at itself.</p><ul class=\"ch-facts\"><li><span>Shown at</span><span>Celebrate Bandra Festival, public art exhibition \u00b7 17\u201325 November 2018</span></li><li><span>Form</span><span><ul class=\"ch-list\"><li>Tetrahedron</li><li>Mirror</li><li>Light</li></ul></span></li><li><span>With</span><span><ul class=\"ch-list\"><li>Sneha Desai</li><li>Varun Mehta</li><li>Nayan Mote</li><li>Advaita Kelkar</li></ul></span></li></ul><div class=\"ch-prose\"><h4>Installation</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/images/reflct/01.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/02.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/03.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/04.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/05.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>Light</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/images/reflct/06.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/07.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/08.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/09.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>Making</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/images/reflct/10.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure><figure><img src=\"/images/reflct/11.webp\" alt=\"RFLCT\" loading=\"lazy\" /></figure></div>"
  - title: "HY.PR"
    subtitle: "HY.PR, the kinetic study"
    body: "<p class=\"ch-statement\">An experimental kinetic form: basic geometries morphing into dynamic, complex forms.</p><ul class=\"ch-facts\"><li><span>Published</span><span>Celebrate Bandra Festival, public art exhibition \u00b7 17\u201325 November 2018</span></li><li><span>Participants</span><span><ul class=\"ch-list\"><li>Varun Mehta</li></ul></span></li><li><span>Fabrication</span><span><ul class=\"ch-list\"><li>Zia Bhai + Javed Bhai \u00b7 metal</li><li>Siddhant Patel \u00b7 3D printing</li></ul></span></li><li><span>Aim</span><span>To understand scalable multi-axial pivot mechanisms in the digital and physical realm.</span></li></ul><div class=\"ch-prose\"><p>The forms are the result of a systematic composition of multi-axial pivot mechanisms onto concentric polygons and solids. The study documented physical mock-ups through fabrication techniques like 3D milling and printing. The CAD for RFLCT is filed as HY.PR RFLCT \u2014 the Celebrate Bandra work was documented under HY.PR.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/HY-PR/001_ezgif-7-f1375f918406.gif\" alt=\"HY.PR\" loading=\"lazy\" /><figcaption><strong>Morphing</strong></figcaption></figure><figure><img src=\"/archv-in/images/HY-PR/003_Top-View.gif\" alt=\"HY.PR\" loading=\"lazy\" /><figcaption><strong>Top view</strong></figcaption></figure></div><p class=\"ch-origin\"><a href=\"/archv-in/HY-PR.html\">The original page on archv.in \u2197</a></p>"
