    body: "<p><a href=\"/archv-in/HY-PR.html\">The original page on archv.in \u2197</a></p><p><strong>Published:</strong></p><p>Celebrate Bandra Festival, Public Art exhibition</p><p>17th-25th November 2018</p><p><strong>Mentors:</strong></p><p><strong>Participants:</strong></p><p><strong>Zia Bhai + Javed Bhai- Metal Fabrication</strong></p><p><strong>Siddhant Patel- 3D Printing</strong></p><p><strong>Varun Mehta</strong></p><img src=\"/archv-in/images/HY-PR/001_ezgif-7-f1375f918406.gif\" alt=\"HY.PR\" loading=\"lazy\" /><img src=\"/archv-in/images/HY-PR/003_Top-View.gif\" alt=\"HY.PR\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>An experimental kinetic form exploration that investigates basic geometries morphing into dynamic complex forms.</p><p>They are a result of a systematic composition of Multi-axial Pivot Mechanisms onto concentric polygons+solids.</p><p>This study documents physical mock ups by exploring fabrication techniques like 3D milling and printing.</p><p><strong>Aim:</strong></p><p>To understand Scalable Multiaxial Pivot Mechanisms in the digital and physical realm.</p><p>member access\ue04e</p><p>This project is a WIP and is currently being documented.</p><p>It is only accesible by our participants and patrons for the time being.</p><p>Please mention your name and the project name in the form</p>"
