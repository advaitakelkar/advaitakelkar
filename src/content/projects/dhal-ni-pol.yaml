chapters:
  - title: "Traces and Territory"
    subtitle: "Traces and Territory"
    body: "<p class=\"ch-statement\">A dichroic acrylic installation strung across the courtyard of Dhal Ni Pol, reading the pol\u2019s heritage fabric through reflected colour.</p><ul class=\"ch-facts\"><li><span>Where</span><span>Dhal Ni Pol, a walled neighbourhood of old Ahmedabad</span></li><li><span>When</span><span>Dhal Ni Pol Heritage Festival \u00b7 18\u201325 November 2019</span></li><li><span>Material</span><span><ul class=\"ch-list\"><li>Dichroic acrylic</li><li>Laser cut</li><li>Suspended</li></ul></span></li><li><span>With</span><span><ul class=\"ch-list\"><li>Sneha Desai</li><li>Varun Mehta</li><li>Nayan Mote</li><li>Advaita Kelkar</li></ul></span></li></ul><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/images/dhal-ni-pol/cover-2.webp\" alt=\"Dichroic acrylic piece\" loading=\"lazy\" /><figcaption><strong>The piece</strong><span>Dichroic acrylic, in hand</span></figcaption></figure><figure><img src=\"/images/dhal-ni-pol/view-01.webp\" alt=\"Dhal Ni Pol installation\" loading=\"lazy\" /><figcaption><strong>Installed</strong><span>Light through the dichroic panels</span></figcaption></figure><figure><img src=\"/images/dhal-ni-pol/view-02.webp\" alt=\"Dhal Ni Pol courtyard\" loading=\"lazy\" /><figcaption><strong>The courtyard</strong><span>Looking up into the pol</span></figcaption></figure><figure><img src=\"/images/dhal-ni-pol/view-03.webp\" alt=\"Dhal Ni Pol courtyard\" loading=\"lazy\" /><figcaption><strong>The courtyard</strong><span>Wide, from below</span></figcaption></figure></div><div class=\"ch-prose\"><h4>Cut files</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/images/dhal-ni-pol/cutfile.webp\" alt=\"Cut file\" loading=\"lazy\" /><figcaption><strong>Cut file</strong></figcaption></figure><figure><img src=\"/images/dhal-ni-pol/cutfile-alt.webp\" alt=\"Cut file, alternate\" loading=\"lazy\" /><figcaption><strong>Cut file</strong><span>Alternate</span></figcaption></figure></div><div class=\"ch-prose\"><p>The same festival showed ARCHV\u2019s study <a href=\"/projects/the-4th-dimention\">The 4th Dimension</a> and the type system dev.SYS.</p></div>"
  - title: "dev.SYS"
    subtitle: "dev.SYS, a type system"
    body: "<p class=\"ch-statement\">A simple geometric type set of Latin and Devanagari scripts, sharing the same construction attributes.</p><ul class=\"ch-facts\"><li><span>Published</span><span><ul class=\"ch-list\"><li>Dhal Ni Pol Heritage Festival, Ahmedabad</li><li>Skateboards by Urban Monkey</li><li>Vashi Social Wall Graphic</li></ul></span></li><li><span>Mentors</span><span><ul class=\"ch-list\"><li>Mumbai Typostammtisch</li><li>Motaitalic</li><li>Ektype \u2014 Tanya, Kimaya, Rob, Noopur</li></ul></span></li><li><span>Participants</span><span><ul class=\"ch-list\"><li>Sneha Desai</li><li>Harit Lakhani</li><li>Nayan C + Diplo</li><li>Advaita Kelkar</li><li>Varun Mehta</li></ul></span></li><li><span>Aim</span><span>A digital system that assists the conversion of existing Latin display typefaces into Devanagari.</span></li></ul><div class=\"ch-prose\"><p>dev.SYS began as an ambition to make a display typeface that expresses the complex Devanagari script in a minimal system, following the glyph attributes of its Latin counterpart.</p><p>The study then mapped the correlations between the anatomy of both scripts, and is being tested against other existing fonts with variable grid systems for a broader understanding.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/dev-SYS/001_ARCHV_Instagram-2.0_2019Grid-System-GIF.gif\" alt=\"dev.SYS grid system\" loading=\"lazy\" /><figcaption><strong>Grid system</strong></figcaption></figure></div><p class=\"ch-origin\"><a href=\"/archv-in/dev-SYS.html\">The original page on archv.in \u2197</a></p>"
