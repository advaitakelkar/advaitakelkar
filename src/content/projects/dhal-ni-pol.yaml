    body: "<p><a href=\"/archv-in/dev-SYS.html\">The original page on archv.in \u2197</a></p><p><strong>Published:</strong></p><ul><li>Dhal Ni Pol Heritage Festival,</li></ul><p><strong>AHMDBD</strong></p><p>18th-25th November 2019</p><ul><li>Skateboards by Urban Monkey</li><li>Vashi Social Wall Graphic</li></ul><p><strong>Mentors:</strong></p><p><strong>Mumbai_Typostammtisch</strong></p><p><strong>Motaitalic</strong></p><p><strong>Ektype</strong></p><p>(Tanya, Kimaya, Rob, Noopur)</p><p><strong>Participants:</strong></p><p><strong>Sneha Desai</strong></p><p><strong>Harit Lakhani</strong></p><p><strong>Nayan C + Diplo</strong></p><p><strong>Advaita Kelkar</strong></p><p><strong>Varun Mehta</strong></p><img src=\"/archv-in/images/dev-SYS/001_ARCHV_Instagram-2.0_2019Grid-System-GIF.gif\" alt=\"dev.SYS\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>dev.SYS began as an ambition to make a simple geometric type set of Latin and Devanagari scripts sharing the same construction attributes.</p><p>This was acquired by defining a display typeface which expresses the complex Devanagri script in a minimal system and is concurrently followed by the glyph attributes of its Latin counterpart.</p><p>The study then attempted to map out the correlations between the anatomy of both the scripts.</p><p>Currently the study is being tested with other existing fonts that have variable grid systems for a broader understanding.</p><p><strong>Aim:</strong></p><p>To create a digital system that assists the conversion of existing Latin Display Typefaces into Devanagari format.</p><p>enter\ue04e</p><p>Please mention your name and the project name in the form</p>"
