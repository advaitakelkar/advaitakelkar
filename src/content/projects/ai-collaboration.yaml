description: |
  <p>Exploring AI in architectural design through ethics, image generation and spatial workflows.</p>
  <p>Course studies span text-to-image and image-to-image tools, guided image editing, LoRA training, and tower experiments that connect images with 3D, video, compositing and printing.</p>
chapters:
  - title: "AI Ethics Debate"
    subtitle: "The AI Ethics Debate"
    body: "<p class=\"ch-small\">Two perspectives on creative AI: protecting human authorship and exploring new design possibilities.</p><div class=\"ch-duo ai-debate\"><article><figure><span class=\"ai-debate-portrait molly-crabapple\"><img src=\"/images/ai-collaboration/molly-crabapple.webp\" alt=\"Portrait of Molly Crabapple\" loading=\"lazy\" width=\"600\" height=\"600\"></span><figcaption>Photo: Benjamin Aleshire · <a href=\"https://www.mollycrabapple.com/about\" target=\"_blank\" rel=\"noopener noreferrer\">Portrait source ↗</a></figcaption></figure><h4>Molly Crabapple · Protect human artists</h4><p>In her 2023 open letter with CAIR, Crabapple argues that training image generators on artists’ work without consent or compensation, then using their output to replace paid illustration, threatens both livelihoods and human expression. She calls on publishers to commission human-made art.</p><p><a href=\"https://artisticinquiry.org/AI-Open-Letter\" target=\"_blank\" rel=\"noopener noreferrer\">Read the open letter ↗</a></p></article><article><figure><span class=\"ai-debate-portrait wolf-prix\"><img src=\"/images/ai-collaboration/wolf-prix.webp\" alt=\"Portrait of Wolf dPrix\" loading=\"lazy\" width=\"600\" height=\"800\"></span><figcaption>Photo: Gianmaria Gava · <a href=\"https://coop-himmelblau.at/people/wolf-dprix/\" target=\"_blank\" rel=\"noopener noreferrer\">Portrait source ↗</a></figcaption></figure><h4>Wolf dPrix · Expand architectural creativity</h4><p>Prix presents AI as a tool that can extend what architects imagine and design. His practice’s Deep Himmelblau research explores machine learning to generate forms and augment designers’ creativity, while questioning the future relationship between architects and their tools.</p><p><a href=\"https://coop-himmelblau.at/method/deep-himmelblau/\" target=\"_blank\" rel=\"noopener noreferrer\">Explore Deep Himmelblau ↗</a></p></article></div><div class=\"ch-small\"><p>These positions frame different ends of this course’s discussion: consent and creative labor on one side, design experimentation on the other. They address different fields and are not a direct exchange between the two speakers.</p></div>"
  - title: "Text to Image"
    subtitle: "Text to Image"
    body: "<div class=\"ch-small\"><p>A ComfyUI guide to generating an architectural image from a written brief. Begin with a working model template, then test one decision at a time.</p><h4>Core node path · checkpoint workflow</h4><p>Load Checkpoint → CLIP Text Encode (positive + negative) → KSampler → VAE Decode → Save Image. Empty Latent Image supplies the canvas to KSampler; the checkpoint supplies MODEL, CLIP and VAE to their matching inputs.</p></div><div class=\"ch-duo\"><div><h4>01 · Set up the canvas</h4><p>Select an installed checkpoint and choose width, height and batch size in Empty Latent Image. Keep the template’s model-specific sampling settings for the first run.</p><h4>02 · Write the brief</h4><p>Describe the subject, spatial arrangement, material, light and camera. Use the negative prompt for unwanted features where the workflow supports it.</p><h4>03 · Generate and compare</h4><p>Queue the graph. Fix the seed while refining the prompt; change it when exploring new compositions. Decode the result with the matching VAE and save the image.</p></div><div><h4>Architectural prompt exercise</h4><p>A compact courtyard library, brick walls and timber roof, planted central courtyard, eye-level view from the entrance, soft morning light, architectural photograph.</p><h4>Change one variable</h4><p>Keep the seed and camera description fixed. Compare brick, rammed earth and exposed concrete; then repeat with morning and evening light. Record the prompt, model and seed beside each result.</p><h4>FLUX / FLUX Krea</h4><p>Use the matching official template. Krea uses Load Diffusion Model, DualCLIPLoader and Load VAE rather than the single checkpoint loader. Select compatible model files and retain its guidance and sampler setup.</p></div></div><p class=\"ch-origin\"><a href=\"https://docs.comfy.org/tutorials/basic/text-to-image\" target=\"_blank\" rel=\"noopener noreferrer\">Official ComfyUI text-to-image guide ↗</a> · <a href=\"https://docs.comfy.org/tutorials/flux/flux1-krea-dev\" target=\"_blank\" rel=\"noopener noreferrer\">FLUX Krea guide ↗</a> · <a href=\"https://github.com/Comfy-Org/workflow_templates/blob/main/templates/flux1_krea_dev.json\" target=\"_blank\" rel=\"noopener noreferrer\">Krea workflow JSON ↗</a></p>"
  - title: "Image to Image"
    subtitle: "Image to Image"
    body: "<div class=\"ch-small\"><p>A ComfyUI guide to transforming a reference image with a prompt. Start with a sketch, massing view or render, then explore changes in material, atmosphere and style.</p><h4>Core node path · checkpoint workflow</h4><p>Load Image → VAE Encode → KSampler → VAE Decode → Save Image. Connect the checkpoint’s VAE to both VAE nodes, its MODEL to KSampler, and the encoded positive and negative prompts to the sampler’s conditioning inputs.</p></div><div class=\"ch-duo\"><div><h4>01 · Prepare the reference</h4><p>Load the image and size it for the chosen model. Replace the text-to-image graph’s Empty Latent Image with VAE Encode, so KSampler receives the reference latent.</p><h4>02 · Describe the intended result</h4><p>State what should remain and what should change. Example: retain the courtyard composition; reinterpret the walls in pale brick, add timber screens and soft overcast daylight.</p><h4>03 · Test denoise strength</h4><p>Lower denoise generally keeps the result closer to the reference; higher values permit larger changes. At 1, the reference latent is fully noised. Keep the seed fixed for comparisons.</p></div><div><h4>Controlled comparison</h4><p>Try denoise 0.25, 0.50 and 0.75 with the same image, prompt and seed. These are experiment values, not presets: compare geometry, material change and loss of detail before choosing a result.</p><h4>Preserving geometry</h4><p>A prompt and low denoise do not guarantee exact outlines. If the camera, edges or depth must remain constrained, use a model-compatible structural guidance workflow rather than relying on the prompt alone.</p><h4>Record the transformation</h4><p>Place the reference beside the output. Note the checkpoint, prompt, seed and denoise value. Keep this image transformation separate from the later image-to-3D exercise; instruction-based tools belong in Image Edit.</p></div></div><p class=\"ch-origin\"><a href=\"https://docs.comfy.org/tutorials/basic/image-to-image\" target=\"_blank\" rel=\"noopener noreferrer\">Official ComfyUI image-to-image guide and loadable example workflow ↗</a></p>"
