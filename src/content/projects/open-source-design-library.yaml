  - title: "Design Library"
    subtitle: "The Open Source Design Library"
    body: "<p><a href=\"/archv-in/Open-Source-Library.html\">The original page on archv.in \u2197</a></p><p><strong>Design Library</strong></p><p>Open Source Design is the development of ideas without the retention of intellectual property. The goal of this library is to propagate a community of designers that are enthusiastic to selfless creation.</p><p>The Design Library is supported by Maker\u2019s Asylum and Raw Collaborative .</p><p>To participate with us view the breif and submission requirements here\ue04e</p><p>Email your submissions to collab@archv.in</p><p>This Open Source Design Library is a by product of our experimental study called,</p><p>The 4th Dimension .</p><p>The objective is to use locally available materials consciously with minimum wastage. While promoting a DIY culture of making.</p><p>It has been formulated by a pool of designers that have come together and created this compilation of various objects and products. They range from furniture pieces, installations, modular shelters, jewellery, animal pods, and lighting.</p><p>The first collaboration took place in May 2020. Where 12 designers connected virtually, during the COVID 19 Lockdown for a month long exchange of conversations, ideas and processes.</p><p><strong>Designers involved:</strong></p><p>Nayan Mote, Yash Pendse, Siddhesh Kadam, Faizan Khatri, Arko Saha, Varun Mehta, Shashank Ahuja, Samir Raut, Saumya Mutneja, Ashish NR, Dhruv Chavan, Harshita Jhamtani.</p><p>The library is being curated by ARC.HV and is open to external submissions.</p><p>\ue04e Support ARC.HV on Patreon \ue04e</p><p>This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License .</p><p><strong>You are free to:</strong></p><p><strong>Share</strong></p><p>Copy and redistribute the material in any medium or format</p><p><strong>Adapt</strong></p><p>Remix, transform, and build upon the material</p><p><strong>Under the following terms:</strong></p><p><strong>Attribution</strong></p><p>You must give appropriate credit , provide a link to the license, and indicate if changes were made . You may do so in any reasonable manner, but not in any way that suggests the licensor endorses you or your use.</p><p><strong>Non-Commercial</strong></p><p>You may not use the material for commercial purposes</p><p><strong>No additional restrictions</strong></p><p>You may not apply legal terms or technological measures that legally restrict others from doing anything the license permits.</p><p><strong>Read terms and conditions in detail here</strong></p>"
