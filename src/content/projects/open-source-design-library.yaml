  - image: "/archv-in/images/017-FurnitureMandala/001_ARCHV_T4DOSL017_FURNITURE-MANDALA-002.jpg"
    room: "017 FurnitureMandala"
    note: "A small table near a window (or TV) can become a site for many activities at different times; a place to eat, to study, as a footrest, an extension of a kitchen platform and at night, a clearing to place a mattress. In this context, Furniture templates attempt to offer a larger imagination of space, time and scale in the vector space of Autocad. The templates are made by dimensions derived from a choreography of human movements and behaviours; walls and surfaces are suggestions that follow. They can be used as tools for design that have inbuilt in them many possible interpretations of place. Rules: 1. If an access arrow meets a wall there must be an opening 2. Only circulation space (hatched portions/tiles) of one template may overlap with anothersst, an extension of a kitchen platform and at night, a clearing to place a mattress. In this context, Furniture templates attempt to offer a larger imagination of space, time and scale in the vector space of Autocad. Designed by Chandani Patel."
  - image: "/archv-in/images/017-FurnitureMandala/003_ARCHV_T4DOSL017_FURNITURE-MANDALA-001.jpg"
