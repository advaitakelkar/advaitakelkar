    room: "015 C432S"
    note: "A DIY modular chess kit that can be played by a pair or 3-4 players. An attempt to make not so easily available chess modules, buildable, at a very minimal cost. Designed by Siddhant Bothra (XYZ Design Studio)."
  - image: "/archv-in/images/OSL-015-C432S/003_ARCHV_T4DOSL015_002.jpg"
