  - image: "/archv-in/images/OSL-003-THOC/001_ARCHV_T4DOSL003_THOC-_Parts.jpg"
    room: "003 The House of Cards"
    note: "Build before you discard. All you need is a deck of plastic playing cards. These playing cards gives you a scope to build a bird-house to hang outside your window for sheltering small birds like sparrows. 13 combinations of interlocked cards can house a bird. Stack and glue 4 cards for each combination which will give sufficient strength and stability to the structure. Thus, modelling up the deck to its full use. Designed by Yash Pendse."
