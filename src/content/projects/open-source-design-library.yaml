  - image: "/archv-in/images/016-Organiser/001_ARCHV_T4DOSL016_Desk-Organiser-002.jpg"
    room: "016 Organiser"
    note: "This organiser is here for you to less your stuff in your desk. You don't have to waste time in finding other objects to organize your pencils, pens, rulers, erasers etc. It's eco friendly because it is made of cardboard and easy to manufacture. You have only to fold a paper measuring 30x27cm three times and it\u2019s ready! Stable and easy to take it with you wherever you go, it can hold your phone too! Designed by Jenny Andritsou."
  - image: "/archv-in/images/016-Organiser/003_ARCHV_T4DOSL016_Desk-Organiser-001.jpg"
    room: "016 Organiser"
  - image: "/archv-in/images/016-Organiser/004_ARCHV_T4DOSL016_Desk-Organiser-003.gif"
