  - image: "/archv-in/images/OSL-014-Alter/001_01-ARCHV_T4DOSL014_ALTER_COVER.jpg"
    room: "014 The ALTER"
    note: "The ALTER is about transformation. It calls upon the trend of upcycling, or creative reuse, in order to transform waste into a new product. An obtuse television cardboard box is transformed into something sleek, sturdy and unique. The idea of creating a piece of furniture to be used while watching a Samsung television further reinforces the connection between the cardboard used to make ALTER, and the television that it once held. The ALTER\u2019s design is angular, mirroring the cardboard box that it's made from, but softened through the sleek slenderness of the design. The cardboard box is further transformed from a rectangle, into a series of triangular shapes which add to the ALTER\u2019s ability to bear weight. The design uses folding and cardboard joinery techniques to transform a four sided piece of cardboard into a multifaceted piece of furniture using only four simple steps. Designed by Amaory Portorreal."
  - image: "/archv-in/images/OSL-014-Alter/003_02-ARCHV_T4DOSL014_ALTER_GUIDE.jpg"
    room: "014 The ALTER"
  - image: "/archv-in/images/OSL-014-Alter/004_03-ARCHV_T4DOSL014_ALTER_SPECS.jpg"
    room: "014 The ALTER"
  - image: "/archv-in/images/OSL-014-Alter/005_04-ARCHV_T4DOSL014_ALTER_VID.gif"
    room: "014 The ALTER"
