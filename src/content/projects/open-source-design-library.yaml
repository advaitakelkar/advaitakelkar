  - image: "/archv-in/images/OSL-001-The-Nudron-Shelf/001_ARCHV_T4DOSL001_The-Nudron-Shelf_Poster.jpg"
    room: "001 The Nudron Shelf"
    note: "A Modular Shelving structural system, created to reduce the material usage in the vertical and horizontal members of a shelf. This lightweight and transparent design consists of 6 different repetitve parts, composed in a single 8\u2019x4\u2019 plywood sheet. The method of construction does not require tools, glue or screws and is fairly easy to assemble. The compilation below consists of the specifications and an assembly guide of the design. The images can be saved and printed for reference. Designed for: Nudron.com HQ, Mumbai Designed by Varun Mehta."
