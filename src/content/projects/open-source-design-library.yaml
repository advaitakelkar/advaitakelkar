    room: "013 Blinkers"
    note: "Working from home and online meetings has become a new normal in this pandemic. One disadvantage of attending such online webinars and meetings is letting others peep in our home, which is quite annoying sometimes! This simple product can block the side views and can also block the camera to prevent malware to record and invade our privacy unauthorisedly. Designed by Rahul Malandkar (apt-studio)."
