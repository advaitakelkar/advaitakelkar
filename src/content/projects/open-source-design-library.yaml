  - image: "/archv-in/images/OSL-010-SPS/001_01-ARCHV_T4DOSL010_TSPS_Poster.jpg"
    room: "010 Scale Pack Sheet"
    note: "This system attempts to reduce the amount and space consumed by conventional packaging methods. The sheet adapts to multiple objects, varying in size and shape while remaining reusable. Inspired by YankoDesign\u2019s Universal Packaging system, this method explores the role of stabilizing the whole form using interlocking clips made from the same material. The packaging kit, inscribed in an A3 Tyvek paper sheet, consists of two main parts, the foldable sheet, and the interlock clips. The sheet is made of 80 square tiles measuring 37.1mm x 37.1mm each, perforated into four triangles and a plus-shaped cutout at the center. Once wrapped around the object, the remaining sheet edges slide into the plus-shaped cutout. The paper interlocks also slide through these cutouts and can then be folded to lock the packaged form to provide stability. Designed by Saumya Mutneja."
