chapters:
  - title: "Library"
    subtitle: "The Open Source Design Library"
    body: "<p class=\"ch-statement\">Open Source Design is the development of ideas without the retention of intellectual property. The goal of this library is to propagate a community of designers who are enthusiastic about selfless creation.</p><div class=\"ch-prose\"><p>A by-product of our experimental study, <a href=\"/projects/the-4th-dimention\">The 4th Dimension</a>: use locally available materials consciously, with minimum wastage, while promoting a DIY culture of making. A pool of designers came together to compile objects and products \u2014 furniture pieces, installations, modular shelters, jewellery, animal pods and lighting \u2014 each with the files and guide to build it.</p><p>The library is curated by ARC.HV and open to external submissions. It is supported by Maker\u2019s Asylum and Raw Collaborative.</p></div><ul class=\"ch-facts\"><li><span>Season 1</span><span>The Initiation \u00b7 May 2020 \u2014 12 designers, connected virtually during the COVID-19 lockdown, for a month-long exchange of conversations, ideas and processes</span></li><li><span>Designers</span><span><ul class=\"ch-list\"><li>Nayan Mote</li><li>Yash Pendse</li><li>Siddhesh Kadam</li><li>Faizan Khatri</li><li>Arko Saha</li><li>Varun Mehta</li><li>Shashank Ahuja</li><li>Samir Raut</li><li>Saumya Mutneja</li><li>Ashish NR</li><li>Dhruv Chavan</li><li>Harshita Jhamtani</li></ul></span></li><li><span>Licence</span><span>Creative Commons Attribution-NonCommercial 4.0 International</span></li><li><span>You may</span><span><ul class=\"ch-list\"><li>Share \u2014 copy and redistribute</li><li>Adapt \u2014 remix, transform, build upon</li></ul></span></li><li><span>On terms</span><span><ul class=\"ch-list\"><li>Attribution</li><li>Non-commercial</li><li>No additional restrictions</li></ul></span></li></ul><p class=\"ch-origin\"><a href=\"/archv-in/Open-Source-Library.html\">The original page on archv.in \u2197</a></p>"
  - title: "Catalogue"
    subtitle: "Sixteen buildable designs"
    body: "<div class=\"ch-grid ch-grid--frame ch-grid--fluid\" style=\"--cols:3;--ratio:4/5\"><figure><img src=\"/archv-in/images/OSL-001-The-Nudron-Shelf/001_ARCHV_T4DOSL001_The-Nudron-Shelf_Poster.jpg\" alt=\"The Nudron Shelf\" loading=\"lazy\" /><figcaption><strong>001 \u00b7 The Nudron Shelf</strong>Varun Mehta<ul class=\"ch-list\"><li>1875(l) x 395(b) x 830(h) mm</li><li>Plywood (12.5mm thick)</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-002-EX04/001_01-ARCHV_T4DOSL002_Exofour_Poster.jpg\" alt=\"EXO.4\" loading=\"lazy\" /><figcaption><strong>002 \u00b7 EXO.4</strong>Faizan Khatri</figcaption></figure><figure><img src=\"/archv-in/images/OSL-003-THOC/001_ARCHV_T4DOSL003_THOC-_Parts.jpg\" alt=\"The House of Cards\" loading=\"lazy\" /><figcaption><strong>003 \u00b7 The House of Cards</strong>Yash Pendse<ul class=\"ch-list\"><li>6\u201d CUSQ</li><li>Playing Cards</li><li>PDF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-004-Flattels/001_ARCHV_T4DOSL004_Flattels_Assembly.gif\" alt=\"Flattels\" loading=\"lazy\" /><figcaption><strong>004 \u00b7 Flattels</strong>Arko Saha<ul class=\"ch-list\"><li>1.5\u201d</li><li>200GSM Paper</li><li>PDF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-005-4XDINE/001_ARCHV_T4DOSL005_4XDINE_POSTER.jpg\" alt=\"4XDINE\" loading=\"lazy\" /><figcaption><strong>005 \u00b7 4XDINE</strong>Nayan Mote<ul class=\"ch-list\"><li>1200(l) x 800(b) x 770(h) mm</li><li>18mm thk Plywood</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-006-TFF/001_ARCHV_T4DOSL006_TFF_ASSEMBLY.jpg\" alt=\"Temporary Feline Foster Home\" loading=\"lazy\" /><figcaption><strong>006 \u00b7 Temporary Feline Foster Home</strong>Shashank Ahuja<ul class=\"ch-list\"><li>450(l) x 250(b) x 350(h) mm</li><li>Corrugated Card (2.5mm thick)</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-007-Make-A-Mask/001_ARCHV_T4DOSL007_Make-a-Mask-_Description.jpg\" alt=\"Make a mask\" loading=\"lazy\" /><figcaption><strong>007 \u00b7 Make a mask</strong>Dhruv Chavan<ul class=\"ch-list\"><li>NA</li><li>Reused Fabric</li><li>PDF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-008-Mod-Pod/001_ARCHV_T4DOSL008_mod-pod-_ASSEMBLY-SHEET-1.jpg\" alt=\"Mod Pod\" loading=\"lazy\" /><figcaption><strong>008 \u00b7 Mod Pod</strong>Siddhesh Kadam<ul class=\"ch-list\"><li>8\u2019(l) x 3.75\u2019(b) x 7\u2019(h)</li><li>Plywood</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-009-Pop-Up/001_ARCHV_T4DOSL009_Pop-Up_DIY-Guide_02.png\" alt=\"Pop-Up Table\" loading=\"lazy\" /><figcaption><strong>009 \u00b7 Pop-Up Table</strong>Ashish NR<ul class=\"ch-list\"><li>1000(l) x 1200(b) x 350(h) mm</li><li>7MM thk Corrugated Cardboard</li><li>DWG + STL</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-010-SPS/001_01-ARCHV_T4DOSL010_TSPS_Poster.jpg\" alt=\"Scale Pack Sheet\" loading=\"lazy\" /><figcaption><strong>010 \u00b7 Scale Pack Sheet</strong>Saumya Mutneja<ul class=\"ch-list\"><li>A3</li><li>Tyvek paper</li><li>PDF and DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-012-SWL/001_04-ARCHV_T4DOSL012_Step-Wall_Assembly.jpg\" alt=\"Step Wall Light\" loading=\"lazy\" /><figcaption><strong>012 \u00b7 Step Wall Light</strong>Harshita Jhamtani<ul class=\"ch-list\"><li>200mm x 200mm</li><li>Refurbished Plywood</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-013-Blinkers/001_01-ARCHV_T4DOSL013_BLINKERS_POSTER.jpg\" alt=\"Blinkers\" loading=\"lazy\" /><figcaption><strong>013 \u00b7 Blinkers</strong>Rahul Malandkar (apt-studio)<ul class=\"ch-list\"><li>45-50(l) x 30(b) x 30(h) mm</li><li>18mm thk ply</li><li>DWG</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-014-Alter/001_01-ARCHV_T4DOSL014_ALTER_COVER.jpg\" alt=\"The ALTER\" loading=\"lazy\" /><figcaption><strong>014 \u00b7 The ALTER</strong>Amaory Portorreal<ul class=\"ch-list\"><li>340(l) x 480(b) x 630(h) mm</li><li>6.25mm thk corrugated card</li><li>DWG</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/OSL-015-C432S/001_ARCHV_T4DOSL015_001.jpg\" alt=\"C432S\" loading=\"lazy\" /><figcaption><strong>015 \u00b7 C432S</strong>Siddhant Bothra (XYZ Design Studio)<ul class=\"ch-list\"><li>NA</li><li>Carboard or acrylic or MDF + Paper</li><li>DXF</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/016-Organiser/001_ARCHV_T4DOSL016_Desk-Organiser-002.jpg\" alt=\"Organiser\" loading=\"lazy\" /><figcaption><strong>016 \u00b7 Organiser</strong>Jenny Andritsou<ul class=\"ch-list\"><li>30cm x 27cm x 1.5mm</li><li>Card</li><li>dwg</li></ul></figcaption></figure><figure><img src=\"/archv-in/images/017-FurnitureMandala/001_ARCHV_T4DOSL017_FURNITURE-MANDALA-002.jpg\" alt=\"FurnitureMandala\" loading=\"lazy\" /><figcaption><strong>017 \u00b7 FurnitureMandala</strong>Chandani Patel<ul class=\"ch-list\"><li>NA</li><li>NA</li><li>Dwg</li></ul></figcaption></figure></div>"
  - title: "Build guides"
    subtitle: "Every sheet, design by design"
    body: "<div class=\"ch-int\"><div><h4>The Nudron Shelf</h4><p class=\"ch-int__tagline\">OSL 001 \u00b7 Varun Mehta</p><p class=\"ch-int__desc\">A Modular Shelving structural system, created to reduce the material usage in the vertical and horizontal members of a shelf. This lightweight and transparent design consists of 6 different repetitve parts, composed in a single 8\u2019x4\u2019 plywood sheet.</p><p class=\"ch-int__desc\">The method of construction does not require tools, glue or screws and is fairly easy to assemble.</p><p class=\"ch-int__desc\">The compilation below consists of the specifications and an assembly guide of the design. The images can be saved and printed for reference.</p><p class=\"ch-int__desc\">Designed for: Nudron.com HQ, Mumbai</p><ul class=\"ch-list\"><li>1875(l) x 395(b) x 830(h) mm</li><li>Plywood (12.5mm thick)</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-001-The-Nudron-Shelf/001_ARCHV_T4DOSL001_The-Nudron-Shelf_Poster.jpg\" alt=\"The Nudron Shelf\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-001-The-Nudron-Shelf/003_ARCHV_T4DOSL001_The-Nudron-Shelf_Part-Map.jpg\" alt=\"The Nudron Shelf\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-001-The-Nudron-Shelf/004_ARCHV_T4DOSL001_The-Nudron-Shelf_-Assembly-Guide.gif\" alt=\"The Nudron Shelf\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>EXO.4</h4><p class=\"ch-int__tagline\">OSL 002 \u00b7 Faizan Khatri</p><p class=\"ch-int__desc\">EXO.4 is a DIY modular exoskeleton system for specially abled animals facilitating natural movement mimicing mobility as well as physio stimulations</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-002-EX04/001_01-ARCHV_T4DOSL002_Exofour_Poster.jpg\" alt=\"EXO.4\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-002-EX04/003_02-ARCHV_T4DOSL002_Exofour_Technical-drawings-1.jpg\" alt=\"EXO.4\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-002-EX04/004_03-ARCHV_T4DOSL002_Exofour_Technical-drawings-2.jpg\" alt=\"EXO.4\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>The House of Cards</h4><p class=\"ch-int__tagline\">OSL 003 \u00b7 Yash Pendse</p><p class=\"ch-int__desc\">Build before you discard.</p><p class=\"ch-int__desc\">All you need is a deck of plastic playing cards.</p><p class=\"ch-int__desc\">These playing cards gives you a scope to build a bird-house to hang outside your window for sheltering small birds like sparrows.</p><p class=\"ch-int__desc\">13 combinations of interlocked cards can house a bird.</p><p class=\"ch-int__desc\">Stack and glue 4 cards for each combination which will give sufficient strength and stability to the structure. Thus, modelling up the deck to its full use.</p><ul class=\"ch-list\"><li>6\u201d CUSQ</li><li>Playing Cards</li><li>PDF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-003-THOC/001_ARCHV_T4DOSL003_THOC-_Parts.jpg\" alt=\"The House of Cards\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-003-THOC/003_ARCHV_T4DOSL003_THOC-_Poster.jpg\" alt=\"The House of Cards\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-003-THOC/004_ARCHV_T4DOSL003_THOC-_Specifications.jpg\" alt=\"The House of Cards\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Flattels</h4><p class=\"ch-int__tagline\">OSL 004 \u00b7 Arko Saha</p><p class=\"ch-int__desc\">Paper Jewellery.</p><ul class=\"ch-list\"><li>1.5\u201d</li><li>200GSM Paper</li><li>PDF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-004-Flattels/001_ARCHV_T4DOSL004_Flattels_Assembly.gif\" alt=\"Flattels\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-004-Flattels/003_ARCHV_T4DOSL004_Flattels_POSTER.jpg\" alt=\"Flattels\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-004-Flattels/004_ARCHV_T4DOSL004_Flattels_A4Print.jpg\" alt=\"Flattels\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>4XDINE</h4><p class=\"ch-int__tagline\">OSL 005 \u00b7 Nayan Mote</p><p class=\"ch-int__desc\">4Xdine was designed keeping sustainability in mind where, the least amount of material was used with minimum wastage, to create a set of furniture that can be used by as many people as possible. It comprises of one table and four stools made out of just one sheet of plywood. The 2D parts made of this sheet material make it easier to transport.</p><ul class=\"ch-list\"><li>1200(l) x 800(b) x 770(h) mm</li><li>18mm thk Plywood</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-005-4XDINE/001_ARCHV_T4DOSL005_4XDINE_POSTER.jpg\" alt=\"4XDINE\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-005-4XDINE/003_ARCHV_T4DOSL005_4XDINE-_dETAIL-SHEET-1.jpg\" alt=\"4XDINE\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-005-4XDINE/004_ARCHV_T4DOSL005_4XDINE-_ASSEMBLY-SHEET-1.jpg\" alt=\"4XDINE\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Temporary Feline Foster Home</h4><p class=\"ch-int__tagline\">OSL 006 \u00b7 Shashank Ahuja</p><p class=\"ch-int__desc\">A temporary foster home for rescue cats that have been designed to have minimal carbon-footprint, from the choice of material to the manufacturing process and minimal transport requirements and can be easily assembled without any tools or glue. This product is made from recycled paper and is biodegradable.</p><ul class=\"ch-list\"><li>450(l) x 250(b) x 350(h) mm</li><li>Corrugated Card (2.5mm thick)</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-006-TFF/001_ARCHV_T4DOSL006_TFF_ASSEMBLY.jpg\" alt=\"Temporary Feline Foster Home\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-006-TFF/003_ARCHV_T4DOSL006_TFF_POSTER.jpg\" alt=\"Temporary Feline Foster Home\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-006-TFF/004_ARCHV_T4DOSL006_TFF-_SPECIFICATIONS.jpg\" alt=\"Temporary Feline Foster Home\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-006-TFF/005_ARCHV_T4DOSL006_TFF_CONSTRUCTION.gif\" alt=\"Temporary Feline Foster Home\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Make a mask</h4><p class=\"ch-int__tagline\">OSL 007 \u00b7 Dhruv Chavan</p><p class=\"ch-int__desc\">A mask that attaches to the frame of specs or sunglasses. Encourage making instead of hoarding. Have fun, stay safe, make-a-mask.</p><ul class=\"ch-list\"><li>NA</li><li>Reused Fabric</li><li>PDF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-007-Make-A-Mask/001_ARCHV_T4DOSL007_Make-a-Mask-_Description.jpg\" alt=\"Make a mask\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-007-Make-A-Mask/003_ARCHV_T4DOSL007_Make-a-Mask-_Poster.jpg\" alt=\"Make a mask\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-007-Make-A-Mask/004_ARCHV_T4DOSL007_Make-a-Mask-_Guide.jpg\" alt=\"Make a mask\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-007-Make-A-Mask/005_ARCHV_T4DOSL007_Make-a-Mask-_Template.jpg\" alt=\"Make a mask\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Mod Pod</h4><p class=\"ch-int__tagline\">OSL 008 \u00b7 Siddhesh Kadam</p><p class=\"ch-int__desc\">mod - pod is a temporary and portable</p><p class=\"ch-int__desc\">cabin structure which is constructed out of</p><p class=\"ch-int__desc\">flat-pack and easy to assemble parts</p><p class=\"ch-int__desc\">for mobile and short-term situations.</p><p class=\"ch-int__desc\">The built module provide comfortable</p><p class=\"ch-int__desc\">activity space for one or two people</p><p class=\"ch-int__desc\">which is apt for vendors to sale out from</p><p class=\"ch-int__desc\">or travellers to have offsite camp adobe or</p><p class=\"ch-int__desc\">for anyone to have multipurpose function within.</p><p class=\"ch-int__desc\">The entire assembly structure is made out of</p><p class=\"ch-int__desc\">4 nos. of birch plywood sheets</p><p class=\"ch-int__desc\">(8 feet x 4 feet x 18 mm thk)</p><p class=\"ch-int__desc\">which are CNC Router cut</p><p class=\"ch-int__desc\">and can be assembled at any flat surface</p><p class=\"ch-int__desc\">without any screws or glues or tools.</p><p class=\"ch-int__desc\">Multiple modules of mod-pod</p><p class=\"ch-int__desc\">can be stacked together to create a cohesive</p><p class=\"ch-int__desc\">experience of living or working spaces.</p><ul class=\"ch-list\"><li>8\u2019(l) x 3.75\u2019(b) x 7\u2019(h)</li><li>Plywood</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-008-Mod-Pod/001_ARCHV_T4DOSL008_mod-pod-_ASSEMBLY-SHEET-1.jpg\" alt=\"Mod Pod\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-008-Mod-Pod/003_ARCHV_T4DOSL008_mod-pod-_THUMBNAIL-POSTER.jpg\" alt=\"Mod Pod\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-008-Mod-Pod/004_02-ARCHV_T4DOSL008_mod-pod-_CONCEPT-POSTER.jpg\" alt=\"Mod Pod\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-008-Mod-Pod/005_ARCHV_T4DOSL008_mod-pod-_ASSEMBLY-SHEET-2.jpg\" alt=\"Mod Pod\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Pop-Up Table</h4><p class=\"ch-int__tagline\">OSL 009 \u00b7 Ashish NR</p><p class=\"ch-int__desc\">An origami foldable table that can be easily assembled or collapsed into a flat sheet as required.</p><ul class=\"ch-list\"><li>1000(l) x 1200(b) x 350(h) mm</li><li>7MM thk Corrugated Cardboard</li><li>DWG + STL</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-009-Pop-Up/001_ARCHV_T4DOSL009_Pop-Up_DIY-Guide_02.png\" alt=\"Pop-Up Table\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-009-Pop-Up/003_ARCHV_T4DOSL009_Pop-Up_DIY-Guide_01.jpg\" alt=\"Pop-Up Table\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-009-Pop-Up/004_ARCHV_T4DOSL009_Pop-Up_DIY-Guide_03.png\" alt=\"Pop-Up Table\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Scale Pack Sheet</h4><p class=\"ch-int__tagline\">OSL 010 \u00b7 Saumya Mutneja</p><p class=\"ch-int__desc\">This system attempts to reduce the amount and space consumed by conventional packaging methods. The sheet adapts to multiple objects, varying in size and shape while remaining reusable. Inspired by YankoDesign\u2019s Universal Packaging system, this method explores the role of stabilizing the whole form using interlocking clips made from the same material.</p><p class=\"ch-int__desc\">The packaging kit, inscribed in an A3 Tyvek paper sheet, consists of two main parts, the foldable sheet, and the interlock clips. The sheet is made of 80 square tiles measuring 37.1mm x 37.1mm each, perforated into four triangles and a plus-shaped cutout at the center. Once wrapped around the object, the remaining sheet edges slide into the plus-shaped cutout. The paper interlocks also slide through these cutouts and can then be folded to lock the packaged form to provide stability.</p><ul class=\"ch-list\"><li>A3</li><li>Tyvek paper</li><li>PDF and DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-010-SPS/001_01-ARCHV_T4DOSL010_TSPS_Poster.jpg\" alt=\"Scale Pack Sheet\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-010-SPS/003_02-ARCHV_T4DOSL010_TSPS_Specification.jpg\" alt=\"Scale Pack Sheet\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-010-SPS/004_03-ARCHV_T4DOSL010_TSPS_Assembly-1.gif\" alt=\"Scale Pack Sheet\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-010-SPS/005_04-ARCHV_T4DOSL010_TSPS_Assembly-2.gif\" alt=\"Scale Pack Sheet\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Step Wall Light</h4><p class=\"ch-int__tagline\">OSL 012 \u00b7 Harshita Jhamtani</p><p class=\"ch-int__desc\">A stacked wall light created by using plywood (also the perfect solution to the leftover materials on interior sites). The light can be made from a wide range of materials with endless possibilities. The product comes together in 8 parts which are mirrored and a base plate, all composed in a single sheet of plywood.</p><p class=\"ch-int__desc\">Requirements: Laser cutting of all the parts and assembling and stacking using glue/nails.</p><p class=\"ch-int__desc\">The compilation below consists of the specifications and an assembly guide of the design. The images can be saved and printed for references.</p><ul class=\"ch-list\"><li>200mm x 200mm</li><li>Refurbished Plywood</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-012-SWL/001_04-ARCHV_T4DOSL012_Step-Wall_Assembly.jpg\" alt=\"Step Wall Light\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-012-SWL/003_01-ARCHV_T4DOSL012_Step-Wall_Poster.gif\" alt=\"Step Wall Light\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-012-SWL/004_03-ARCHV_T4DOSL012_Step-Wall_Details.jpg\" alt=\"Step Wall Light\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-012-SWL/005_02-ARCHV_T4DOSL012_Step-Wall_Assembly.gif\" alt=\"Step Wall Light\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Blinkers</h4><p class=\"ch-int__tagline\">OSL 013 \u00b7 Rahul Malandkar (apt-studio)</p><p class=\"ch-int__desc\">Working from home and online meetings has become a new normal in this pandemic. One disadvantage of attending such online webinars and meetings is letting others peep in our home, which is quite annoying sometimes! This simple product can block the side views and can also block the camera to prevent malware to record and invade our privacy unauthorisedly.</p><ul class=\"ch-list\"><li>45-50(l) x 30(b) x 30(h) mm</li><li>18mm thk ply</li><li>DWG</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-013-Blinkers/001_01-ARCHV_T4DOSL013_BLINKERS_POSTER.jpg\" alt=\"Blinkers\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-013-Blinkers/003_02-ARCHV_T4DOSL013_BLINKERS_SPECS.jpg\" alt=\"Blinkers\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-013-Blinkers/004_03-ARCHV_T4DOSL013_BLINKERS_GIF1.gif\" alt=\"Blinkers\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-013-Blinkers/005_04-ARCHV_T4DOSL013_BLINKERS_PLACMENET.jpg\" alt=\"Blinkers\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-013-Blinkers/006_05-ARCHV_T4DOSL013_BLINKERS_GIF2.gif\" alt=\"Blinkers\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>The ALTER</h4><p class=\"ch-int__tagline\">OSL 014 \u00b7 Amaory Portorreal</p><p class=\"ch-int__desc\">The ALTER is about transformation. It calls upon the trend of upcycling, or creative reuse, in order to transform waste into a new product. An obtuse television cardboard box is transformed into something sleek, sturdy and unique. The idea of creating a piece of furniture to be used while watching a Samsung television further reinforces the connection between the cardboard used to make ALTER, and the television that it once held. The ALTER\u2019s design is angular, mirroring the cardboard box that it&#x27;s made from, but softened through the sleek slenderness of the design. The cardboard box is further transformed from a rectangle, into a series of triangular shapes which add to the ALTER\u2019s ability to bear weight. The design uses folding and cardboard joinery techniques to transform a four sided piece of cardboard into a multifaceted piece of furniture using only four simple steps.</p><ul class=\"ch-list\"><li>340(l) x 480(b) x 630(h) mm</li><li>6.25mm thk corrugated card</li><li>DWG</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-014-Alter/001_01-ARCHV_T4DOSL014_ALTER_COVER.jpg\" alt=\"The ALTER\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-014-Alter/003_02-ARCHV_T4DOSL014_ALTER_GUIDE.jpg\" alt=\"The ALTER\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-014-Alter/004_03-ARCHV_T4DOSL014_ALTER_SPECS.jpg\" alt=\"The ALTER\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-014-Alter/005_04-ARCHV_T4DOSL014_ALTER_VID.gif\" alt=\"The ALTER\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>C432S</h4><p class=\"ch-int__tagline\">OSL 015 \u00b7 Siddhant Bothra (XYZ Design Studio)</p><p class=\"ch-int__desc\">A DIY modular chess kit that can be played by a pair or 3-4 players. An attempt to make not so easily available chess modules, buildable, at a very minimal cost.</p><ul class=\"ch-list\"><li>NA</li><li>Carboard or acrylic or MDF + Paper</li><li>DXF</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/OSL-015-C432S/001_ARCHV_T4DOSL015_001.jpg\" alt=\"C432S\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-015-C432S/003_ARCHV_T4DOSL015_002.jpg\" alt=\"C432S\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-015-C432S/004_ARCHV_T4DOSL015_003.jpg\" alt=\"C432S\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/OSL-015-C432S/005_ARCHV_T4DOSL015_004.jpg\" alt=\"C432S\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>Organiser</h4><p class=\"ch-int__tagline\">OSL 016 \u00b7 Jenny Andritsou</p><p class=\"ch-int__desc\">This organiser is here for you to less your stuff in your desk. You don&#x27;t have to waste time in finding other objects to organize your pencils, pens, rulers, erasers etc. It&#x27;s eco friendly because it is made of cardboard and easy to manufacture. You have only to fold a paper measuring 30x27cm three times and it\u2019s ready! Stable and easy to take it with you wherever you go, it can hold your phone too!</p><ul class=\"ch-list\"><li>30cm x 27cm x 1.5mm</li><li>Card</li><li>dwg</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/016-Organiser/001_ARCHV_T4DOSL016_Desk-Organiser-002.jpg\" alt=\"Organiser\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/016-Organiser/003_ARCHV_T4DOSL016_Desk-Organiser-001.jpg\" alt=\"Organiser\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/016-Organiser/004_ARCHV_T4DOSL016_Desk-Organiser-003.gif\" alt=\"Organiser\" loading=\"lazy\" /></figure></div></div><div class=\"ch-int\"><div><h4>FurnitureMandala</h4><p class=\"ch-int__tagline\">OSL 017 \u00b7 Chandani Patel</p><p class=\"ch-int__desc\">A small table near a window (or TV) can become a site for many activities at different times; a place to eat, to study, as a footrest, an extension of a kitchen platform and at night, a clearing to place a mattress. In this context, Furniture templates attempt to offer a larger imagination of space, time and scale in the vector space of Autocad.</p><p class=\"ch-int__desc\">The templates are made by dimensions derived from a choreography of human movements and behaviours; walls and surfaces are suggestions that follow. They can be used as tools for design that have inbuilt in them many possible interpretations of place.</p><p class=\"ch-int__desc\">Rules:</p><p class=\"ch-int__desc\">1. If an access arrow meets a wall there must be an opening</p><p class=\"ch-int__desc\">2. Only circulation space (hatched portions/tiles) of one template may overlap with anothersst, an extension of a kitchen platform and at night, a clearing to place a mattress. In this context, Furniture templates attempt to offer a larger imagination of space, time and scale in the vector space of Autocad.</p><ul class=\"ch-list\"><li>NA</li><li>NA</li><li>Dwg</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/017-FurnitureMandala/001_ARCHV_T4DOSL017_FURNITURE-MANDALA-002.jpg\" alt=\"FurnitureMandala\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/017-FurnitureMandala/003_ARCHV_T4DOSL017_FURNITURE-MANDALA-001.jpg\" alt=\"FurnitureMandala\" loading=\"lazy\" /></figure></div></div>"
