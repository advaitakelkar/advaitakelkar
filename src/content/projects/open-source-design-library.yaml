  - image: "/archv-in/images/OSL-008-Mod-Pod/001_ARCHV_T4DOSL008_mod-pod-_ASSEMBLY-SHEET-1.jpg"
    room: "008 Mod Pod"
    note: "mod - pod is a temporary and portable cabin structure which is constructed out of flat-pack and easy to assemble parts for mobile and short-term situations. The built module provide comfortable activity space for one or two people which is apt for vendors to sale out from or travellers to have offsite camp adobe or for anyone to have multipurpose function within. The entire assembly structure is made out of 4 nos. of birch plywood sheets (8 feet x 4 feet x 18 mm thk) which are CNC Router cut and can be assembled at any flat surface without any screws or glues or tools. Multiple modules of mod-pod can be stacked together to create a cohesive experience of living or working spaces. Designed by Siddhesh Kadam."
