    note: "A stacked wall light created by using plywood (also the perfect solution to the leftover materials on interior sites). The light can be made from a wide range of materials with endless possibilities. The product comes together in 8 parts which are mirrored and a base plate, all composed in a single sheet of plywood. Requirements: Laser cutting of all the parts and assembling and stacking using glue/nails. The compilation below consists of the specifications and an assembly guide of the design. The images can be saved and printed for references. Designed by Harshita Jhamtani."
