    body: "<p><a href=\"/archv-in/VirtualGods2020.html\">The original page on archv.in \u2197</a></p><p><strong>Home</strong></p><p><strong>Virtual Gods</strong></p><p><strong>Inspired By:</strong></p><p>WeSpinSpaces,</p><p>Sanchit Sawaria, iHeartBlob, Oleomingus, Varun Desai, Khyati Trehan, Prajjwal Chandra</p><p><strong>Participants:</strong></p><p>Kuldeep Jangid, Ishita Parmar, Sneha Desai, Nayan Mote, Devarsh Sheth , Janhavi Shinde, Shravan Suresh, Yash Pradhan , Advaita Kelkar, Sohil Soni, Jinal Wadgama, Siddhesh Kadam , Anuj Modi , Varun Mehta</p><p>Web experience created in collaboration with</p><p>Rijul Raut (Clockwerk Tech)</p><img src=\"/archv-in/images/VirtualGods/001_VG_Process-Diagram_08.07.2020_BW.gif\" alt=\"Virtual Gods\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>In a time as challenging as that of a global pandemic, there is an insistence to negate the magnitude of it. As designers, we feel a grounding sense of calm in community and inspiration.</p><p>VIRTUAL GODS was created to investigate new methods of effective collaborations and exhibitions. This experimental exercise was initiated to facilitate an essence of togetherness during the 2020 Covid-19 lockdown.</p><p>During an exchange that spanned across 3 weeks, various multi-disciplinary participants connected to trade new tools and design languages while discovering new processes &amp; theories. The goal was to traverse a beautiful dialogue while manifesting unique 3D Virtual Worlds.</p><p>These 3D creations and their formation have been documented in form of</p><p>INDIA\u2019S FIRST VIRTUAL GROUP ART EXHIBIT.</p><p>Virtual Gods is a development of our project Scarpin&#x27; which attempts to bridge the gap between architecture and visual media.</p><p>This years brief involved the participants to exchange their 2D illustrations with each other and reinterpret them to 3D compositions.</p><p><strong>Aim:</strong></p><p>To exercise the extents of virtual art, architecture, exhibition and collaboration.</p><p>The exhibition was live from 01 st AUG- 31 st AUG 2020 and has ended .</p><p>If you missed it and want to request access</p><p>Currently only accesible by our participants and patrons</p><p>download exhibition guidebook \ue08c</p><p>enter exhibition\ue04e</p><p><strong>Best Experienced on a Desktop/Laptop</strong></p>"
