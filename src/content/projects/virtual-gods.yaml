    subtitle: "India\u2019s first virtual group art exhibit"
    body: "<p class=\"ch-statement\">An experimental exercise in collaborating and exhibiting, begun to keep some togetherness during the 2020 lockdown.</p><ul class=\"ch-facts\"><li><span>Live</span><span>1\u201331 August 2020 \u00b7 India\u2019s first virtual group art exhibit</span></li><li><span>Participants</span><span><ul class=\"ch-list\"><li>Kuldeep Jangid</li><li>Ishita Parmar</li><li>Sneha Desai</li><li>Nayan Mote</li><li>Devarsh Sheth</li><li>Janhavi Shinde</li><li>Shravan Suresh</li><li>Yash Pradhan</li><li>Advaita Kelkar</li><li>Sohil Soni</li><li>Jinal Wadgama</li><li>Siddhesh Kadam</li><li>Anuj Modi</li><li>Varun Mehta</li></ul></span></li><li><span>Inspired by</span><span><ul class=\"ch-list\"><li>WeSpinSpaces</li><li>Sanchit Sawaria</li><li>iHeartBlob</li><li>Oleomingus</li><li>Varun Desai</li><li>Khyati Trehan</li><li>Prajjwal Chandra</li></ul></span></li><li><span>Web experience</span><span>With Rijul Raut, Clockwerk Tech</span></li><li><span>Aim</span><span>To exercise the extents of virtual art, architecture, exhibition and collaboration.</span></li></ul><div class=\"ch-prose\"><p>Over an exchange that spanned three weeks, multidisciplinary participants traded tools and design languages while discovering new processes and theories. This year\u2019s brief had them exchange their 2D illustrations with each other and reinterpret them as 3D compositions: one person, then a pair, then a group of four, merging into unique virtual worlds.</p><p>Virtual Gods is a development of <a href=\"/projects/scarpin\">Scarpin\u2019</a>, which set out to bridge architecture and visual media.</p></div><ul class=\"ch-list\"><li><a href=\"/virtual-gods\">Enter the exhibition \u2197</a></li><li><a href=\"/virtual-gods/wheel\">The process wheel \u2197</a></li><li><a href=\"/archv-in/VirtualGods2020.html\">As it was on archv.in \u2197</a></li></ul>"
