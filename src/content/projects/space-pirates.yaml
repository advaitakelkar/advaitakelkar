description: |
  <div class="desc-scroll">
    <p>One Piece reimagined as a unified prestige live-action portrait series: sixty-four principal characters shot under one continuous visual system. A translation from Eiichiro Oda's manga into believable flesh, fabric, weathered leather, and cinematic key light, preserving unmistakable silhouettes, facial geometry, and scale without collapsing them into generic cosplay.</p>
    <p>The system is held constant across the entire ensemble: vertical 3:4 framing, tight head-to-waist or upper-thigh body portrait, pure black seamless studio background, realistic skin textures with natural pores and battle scars, hard sculpting top light, and one restrained signature-colour rim light.</p>
    <p>Divided across four production tiers — the core Straw Hat crew (Tier S), final-saga power centres (Tier A), legendary Emperors and rivals (Tier B), and saga-defining allies and villains (Tier C).</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
      <em>Tier S · Core Crew (10): Monkey D. Luffy, Roronoa Zoro, Nami, Usopp, Vinsmoke Sanji, Tony Tony Chopper, Nico Robin, Franky, Brook, Jinbe.<br><br>
      Tier A · Final-Saga Pillars (14): Shanks, Marshall D. Teach (Blackbeard), Buggy, Dracule Mihawk, Sakazuki (Akainu), Imu, Monkey D. Dragon, Sabo, Monkey D. Garp, Koby, Trafalgar Law, Eustass Kid, Nefertari Vivi, Jewelry Bonney.<br><br>
      Tier B · Legends & Rivals (18): Portgas D. Ace, Edward Newgate (Whitebeard), Gol D. Roger, Silvers Rayleigh, Kaido, Charlotte Linlin (Big Mom), Kozuki Oden, Yamato, Boa Hancock, Crocodile, Donquixote Doflamingo, Bartholomew Kuma, Kuzan (Aokiji), Borsalino (Kizaru), Issho (Fujitora), Smoker, Rob Lucci, Charlotte Katakuri.<br><br>
      Tier C · Allies & Villains (22): Marco, King, Queen, Enel, Gecko Moria, Caesar Clown, Shirahoshi, Kozuki Momonosuke, Kin'emon, Carrot, Rebecca, Perona, Bentham (Bon Clay), Bartolomeo, Emporio Ivankov, Koala, Sengoku, Dr. Vegapunk, Saint Jaygarcia Saturn, Arlong, Magellan, Charlotte Pudding.</em>
    </p>
  </div>

