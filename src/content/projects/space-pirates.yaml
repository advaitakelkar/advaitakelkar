        <span class="copy-btn-text">Copy</span>
      </button>
    </div>
    <div class="prompt-body">
      <span class="prompt-text">"A prestige live-action character key-art portrait based on Eiichiro Oda's One Piece manga, shot as a real photograph. Vertical 3:4 frame, a tight body portrait from head to waist or upper thighs, the character centred against a pure black seamless studio background. Preserve the unmistakable manga silhouette, facial geometry, anatomy, scale, costume and hair rather than normalising the design into an ordinary person. Photorealistic skin with pores, natural asymmetry, sweat and believable scar tissue; hard sculpting studio key light from above, and one restrained rim light in the character's signature colour."</span>
    </div>
  </div>
