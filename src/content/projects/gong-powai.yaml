description: |
  <p>GONG is a Japanese-inspired restaurant and bar on the second floor in Hiranandani, Powai. The plan brings the main dining room, private dining, bar, dim sum counter, smoking terrace and service spaces together beneath one continuous spatial idea.</p>
  <p>A layered timber lattice forms the ceiling installation, finished to keep the wood pale and tactile and threaded with cherry blossom branches and warm light. Below it, burgundy leather, Japanese tattoo-patterned upholstery, dark green marble, stone and timber flooring give the large dining floor a warmer and more intimate scale.</p>
  <p>The stone bar and its suspended black metal cage anchor one end of the room, while long banquettes, upholstered lounge chairs and planting soften the perimeter. The visualisations and drawing set below follow the project from atmosphere and material character through plans, sections and bar details.</p>
aim: "To hold a large dining floor together through one continuous timber ceiling while giving each seating zone its own scale and atmosphere."
