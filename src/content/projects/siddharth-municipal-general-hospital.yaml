designBrief:
  abstract: >-
    This B.Arch design project investigates a municipal general hospital for residents of Siddharth Nagar, Goregaon, Mumbai. It asks how an everyday public institution can make care easier to reach and navigate while accommodating the operational complexity of a general hospital. The study begins with the neighbourhood, its care needs and referral connections, then translates a proposed service mix into departmental areas, adjacencies and circulation. Outpatient care, emergency access, diagnostics, inpatient wards and clinical support are examined as connected systems. HOSMAC India provides a planning reference for moving from space programming to clustering and stacking. The architectural proposal tests a legible public entrance, sheltered waiting, short clinical connections and controlled service routes, with daylight and outdoor relief where compatible with clinical requirements. Its outcome is a hospital design developed through plans, sections, flow diagrams and a coordinated schedule of accommodation.
  brief: >-
    Design a municipal hospital with clear public access, direct emergency arrival and closely linked clinical departments. Coordinate patient, staff and service routes while supporting sheltered waiting, privacy and family care.
chapterNav: "scroll"
chapters:
  - title: "Typology"
    subtitle: "Care needs before built form"
    body: |
      <div class="ch-prose">
        <p>Establish the local catchment and existing public-care network before selecting bed capacity or specialist services. Compare general-hospital layouts through OPD, emergency, diagnostics, wards, operating theatres and critical-care adjacencies.</p>
        <p>HOSMAC describes a progression from space programming and departmental schedules to clustering matrices and stack plans. Apply that sequence to compare a horizontal courtyard scheme, a compact stacked scheme and a hybrid at the same proposed service capacity.</p>
      </div>
  - title: "Programme"
    subtitle: "Public access and clinical organisation"
    body: |
      <div class="ch-prose">
        <p>Begin with registration, outpatient consultation, diagnostics and pharmacy; provide a separate emergency approach and ambulance arrival. Develop inpatient wards, surgical and critical-care areas, administration and family waiting according to the validated service brief.</p>
        <p>Plan staff access, sterile supply, kitchens, laundry, stores, engineering, biomedical waste and mortuary movement with the clinical programme. Diagram public, patient-transfer, staff, supply and waste routes, controlled crossings and vertical connections. Ventilation and pressure zoning must follow clinical function rather than a universal courtyard strategy.</p>
      </div>
  - title: "Design tests"
    subtitle: "Legibility, distance and dignity"
    body: |
      <div class="ch-prose">
        <p>Trace first-time outpatient, emergency transfer, inpatient visitor and staff journeys. Compare walking distances, decision points, lift dependence and avoidable crossings between public routes and controlled services. Check accessible movement from drop-off to consultation and wards.</p>
        <p>Test waiting capacity, visibility of destinations, daylight, privacy and family support. The design approach needs revision if a welcoming public route adds clinical transfer distance or exposes service movements. These are design proxies; clinical outcomes require operational evidence.</p>
      </div>
  - title: "References"
    subtitle: "Sources and next inputs"
    body: |
      <div class="ch-prose">
        <p><a href="https://www.hosmac.com/services-item/hospital-design/">HOSMAC India — Hospital Design</a> supports service-led programming, departmental schedules, clustering and stacking; <a href="https://www.hosmac.com/virtual-masterclass-bouquet/">Essentials of Hospital Planning &amp; Design</a> identifies clinical, clinical-support and general-support accommodation. These are planning references, with no consultancy relationship implied.</p>
        <p>Next inputs: surveyed plot and access, municipal client brief, catchment data, bed count, departmental workload and referral role. Establish applicable health-facility, fire, accessibility and infection-control requirements before assigning room dimensions or finalising the stack.</p>
      </div>
