chapters:
  - title: "Man vs Wild"
    subtitle: "Can architecture be resilient in its built form?"
    body: |
      <figure class="skd-fig skd-fig--hero"><img src="/images/skadoogee/view-south-west.webp" width="1245" height="1400" loading="eager" alt="Model view from the south-west: two circular towers on single piers joined by a long bridge over a wooded slope" /><figcaption>Working model, south-west. Towers A and B on their piers, the Hanging Pavilion between.</figcaption></figure>
      <div class="ch-prose">
        <p>The studio asked for a health and wellness centre read through the AIA COTE Top Ten. The answer treats resilience as a posture, not a bunker: a building that stands beside the forest and fights to stay standing, the way a survivor does. Three blocks hold that idea. Tower A is the wellness centre, resilience of the body. Tower B is the learning centre, resilience of the mind. Between them hangs the pavilion, the library and the Center for Resilience, where the two meet.</p>
        <p>All of it is lifted off the ground. The site in Dahlonega is steep and covered in trees; any ordinary building would cut and fill the contours and clear them. Here the ground is touched by a pier under each tower, the stair piers of the pavilion, a looped trail-road and two cut platforms, and nothing else.</p>
      </div>
  - title: "The site"
    subtitle: "A slope with trees everywhere"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/view-aerial.webp" width="2400" height="1068" loading="lazy" alt="Aerial model view: the loop road, two parking platforms and the bridge spine across the site" /><figcaption>Aerial view. The loop road, the two parking platforms and the bridge spine.</figcaption></figure>
      <div class="ch-prose">
        <p>Lumpkin County, north Georgia, on the edge of the Chattahoochee forest. The contours fall steeply across the parcel and the canopy is continuous. The model carries a road datum 7.3 m below ground datum and a terrain minimum 15 m lower still, which is the measure of how much earth a conventional scheme would have to move.</p>
        <p>The strategy is to leave the slope as it is. The lowest occupied floor sits 5.5 m above the ground datum, so the forest floor, water and wildlife pass beneath. Where the site must be cut, at the two platforms, the cut is cast back on site as permeable concrete. Terraces and a stepwell pond near the cores are the only other earthworks, and they are part of the stormwater system rather than an exception to it.</p>
      </div>
  - title: "Three blocks"
    subtitle: "Body, mind, and the pavilion between"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/tower-a-levels-00-04.svg" width="1560" height="1190" loading="lazy" alt="Schematic plans of Tower A, Levels 00 to 04: central lobby round the core, one bar of rooms on the bridge side with partitions on the radial grid, open floor to the forest" /><figcaption>Tower A, Levels 00–04. Schematic plans on the one-bar strategy; the radial grid and bridge axis are from the model.</figcaption></figure>
      <figure class="skd-fig"><img src="/images/skadoogee/tower-b-levels-00-04.svg" width="1560" height="1190" loading="lazy" alt="Schematic plans of Tower B, Levels 00 to 04, the learning centre on the same plan" /><figcaption>Tower B, Levels 00–04. The same ring and bar, given to the learning programme.</figcaption></figure>
      <div class="skd-grid">
        <figure class="skd-fig"><img src="/images/skadoogee/plan-level-03-tower-a.webp" width="1572" height="1390" loading="lazy" alt="Level 03 plan of Tower A from the working model: entrance lobby and reception, cardio gym, lockers, showers and washrooms around the central core" /><figcaption>Tower A, Level 03 in the working model: the radial rooms the new plan replaces.</figcaption></figure>
        <figure class="skd-fig"><img src="/images/skadoogee/plan-level-02-tower-a.webp" width="1362" height="938" loading="lazy" alt="Level 02 plan of Tower A from the working model: weight room, functional training and stretch, trainer office and support rooms" /><figcaption>Tower A, Level 02 in the working model.</figcaption></figure>
      </div>
      <div class="ch-prose">
        <p>Tower A, to the west, is the wellness wing: café and arrival at Level 00, movement studios at 01, weights and functional training at 02, reception and cardio at 03, restoration at 04 where the bridge lands. Tower B, to the east, is the same ring given to the learning programme: an education gallery open to the trail, classrooms and a seminar room, a research lab and a making workshop, staff, and a lecture room at the bridge. The Hanging Pavilion is the glazed spine between them, the library and the Center for Resilience, the one room both wings share.</p>
        <p>The plates are about 27 m across on eighteen perimeter columns set on a twenty-degree radial grid, roughly 570 m² a floor and 2,850 m² a tower; Levels 05 and 06 are the crown, with the tank, plant and battery. The working model planned each floor as radial wedges to the core. The revised plan keeps the grid but drops the wedges: a lobby ring runs right round the core, one bar of rooms sits on the bridge side with its partitions on the column radials so the same walls stack on every floor, and the open floor faces the forest. The pavilion is 2,084 m² of floor at Level 04 with a mezzanine under the sawtooth that sleeps a hundred people when the Center for Resilience is called on. Around 8,700 m² in all.</p>
      </div>
  - title: "Standing on one leg"
    subtitle: "Pier, crown, hangers, cantilevers"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/elevation-west.webp" width="2400" height="843" loading="lazy" alt="Model elevation from the west: each tower carried on a single central pier, the pavilion truss spanning between round piers" /><figcaption>From the west. One pier under each tower; the pavilion truss on its own round piers.</figcaption></figure>
      <div class="ch-prose">
        <p>Each tower stands on one pier: the vertical transport core of lifts, stair and service risers, which acts as a central shaft holding the building in place. A steel ring truss at the crown carries the tank and the roof. The floors work two ways at once, as radial cantilevers from the core and as plates hung from the crown ring on perimeter rods. The hybrid takes the deflection out of the cantilevers and keeps the floor plates thin.</p>
        <p>The pavilion is a two-chord steel truss whose top chord is the sawtooth roof, spanning pier to pier with stair piers below for the ground connection. The structure is steel and timber above a single concrete pier per tower, which is where most of the embodied-carbon saving over a cut-and-fill scheme comes from.</p>
      </div>
  - title: "Water towers"
    subtitle: "Rain to tank to building"
    body: |
      <div class="ch-prose">
        <p>A and B are shaped like water towers because they are water towers. Rain falling on the tower roofs and the pavilion canopy collects in a tank at the crown, and from there gravity feeds the toilets, laundry, irrigation and cooling below. The tank's mass is also a thermal buffer and a damping weight for the suspended ring.</p>
        <p>What the roofs cannot hold runs to bioswales along the trail and to the stepwell pond, so that the two-year storm is managed on the site. The permeable platforms take their own runoff. Tank volume, catchment and the storm numbers are the water metrics the COTE entry needs, and they are listed in the table.</p>
      </div>
  - title: "Roof of sun and sky"
    subtitle: "Sawtooth, polycarbonate, and the core as a chimney"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/roof-plan.webp" width="2400" height="1183" loading="lazy" alt="Roof view of the model: radial roof framing over each tower and the sawtooth truss over the pavilion" /><figcaption>Roof view. Radial framing over the towers, the sawtooth truss over the pavilion.</figcaption></figure>
      <div class="ch-prose">
        <p>The crown is a partial sawtooth. Its south-facing pitches carry photovoltaics; the north-facing pitches are transparent polycarbonate, chosen for weight and for the view of the sky from the top floor. The exterior is steel, the interior is wood, and the glass is a brown-grey that sits with the forest.</p>
        <p>The pier-core doubles as a ventilation stack. Air is drawn in at the shaded underside of the lowest floor, inside the canopy, and exhausted at the crown under the polycarbonate, which warms it: a solar chimney thirty metres tall.</p>
      </div>
  - title: "The loop"
    subtitle: "Trail, fire ring, education walk"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/view-north-low.webp" width="1400" height="700" loading="lazy" alt="Low model view from the north: towers and bridge above the loop road and platforms" /><figcaption>From the north. The road loop passes beneath the towers and meets them at the platforms.</figcaption></figure>
      <div class="ch-prose">
        <p>The road through the site is drawn as a trail: a loop that connects the whole parcel and then places the cores and the built-up areas inside it, leaving the flora and fauna in between. It is three things at once. A running and fitness trail with marked distances, part of the wellness programme. The fire-truck and evacuation ring. And a nature-education walk with stations that belong to the learning wing.</p>
        <p>Two platforms are cut from the loop for parking. They are the only cut on the site, and the cut material is cast back as permeable concrete on the spot.</p>
      </div>
  - title: "When it fails"
    subtitle: "The Center for Resilience"
    body: |
      <div class="ch-prose">
        <p>The pavilion is designed for two kinds of disruption. In flood and storm, the suspended floors sit above the slope's flow paths and the loop stays open as the evacuation route. In a power outage or an ice storm, the roof photovoltaics, a battery store and the gravity-fed tank keep the pavilion running as a community refuge for days.</p>
        <p>In ordinary weather it is the library. The refuge capacity and the days of autonomy are the resilience numbers still to be fixed.</p>
      </div>
  - title: "COTE Top Ten"
    subtitle: "Ten measures, one idea"
    body: |
      <div class="ch-prose">
        <p>The AIA Framework for Design Excellence asks ten questions. Suspension answers most of them at once: one pier, one crown, one tank and one roof do structure, water, energy and air together. The table below is how each measure is met and which metric the entry will carry.</p>
      </div>
  - title: "Studio record"
    subtitle: "ARCH 727 / 737, Grad Studio II and III"
    body: |
      <figure class="skd-fig"><img src="/images/skadoogee/elevation-east.webp" width="2400" height="743" loading="lazy" alt="Model elevation from the east" /><figcaption>From the east.</figcaption></figure>
      <div class="ch-prose">
        <p>A continuous project across two graduate studios at SCAD with Michael Hill. The model was built in Revit, transferred to BIMCraft for the drawings on this page, and is now being developed in Rhino. Drawings here are working views of the model; sections, programme areas and the metric calculations follow.</p>
      </div>
