designBrief:
  abstract: >-
    Skadoogee Health and Wellness Center is a continuous M.Arch studio project in Dahlonega, Lumpkin County, that brings wellness, learning and community resilience into one architectural programme. Its two wings establish complementary settings: a wellness wing for health, restoration and movement, and a learning wing for classrooms, research, workshops and environmental education. A central bridge houses the Center for Resilience, connecting the wings beneath a sawtooth solar canopy. This shared centre is conceived as both an everyday meeting place and a community refuge during disruption. The project studies how spatial organisation, biophilia, thermal comfort and environmental systems can support these different patterns of use. Plans, sections and building-system studies develop the relationship between individual wellbeing, collective learning and the capacity to adapt.
  brief: >-
    Bring wellness, learning and community resilience together in two wings linked by a shared Center for Resilience. Integrate accessible circulation, landscape and environmental systems beneath a solar canopy, supporting daily use and refuge during disruption.
