description: |
  <p>I grew up in Malad, close to Inorbit Mall. I went there often when I was younger and kept returning as I got older. Coming back to work on SOCIAL in that same mall made the project personal.</p>
  <p>The project began during COVID, around the time work was starting up again. My first idea was to put the bar at the centre and terrace the seating around it. The client liked it straight away. I had fun developing that arrangement and taking it through to the finished space.</p>
  <p>This was my first complete solo project. I led the design, handled the work on site and carried it through to execution myself.</p>

