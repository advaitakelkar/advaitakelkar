designBrief:
  abstract: >-
    The Veil, by Faith Andrew and Advaita Kelkar, proposes a layered, translucent setting for making and gathering within Savannah’s former Chatham County jail. Sketches, spatial models, plans and concept views trace the design from courtyard studies to a new enclosure within the historic masonry. Four parallel proposals — The Veil, Prism, The Oasis and Aurora — develop into two consolidated schemes, UNVEIL and METAMORPHOSIS, before the full studio produces one combined proposal. The final design places a floating auditorium above a reflecting courtyard and coordinates new circulation, structure, water and environmental systems within the historic masonry.
  brief: >-
    Reimagine Habersham Hall as a place for collective making and gathering. Develop an accessible arrival sequence and shared cultural spaces, coordinating new structure, water and environmental systems with the historic building.

