designBrief:
  abstract: >-
    This SCAD design-build studio explores adaptive reuse at Habersham Hall, Savannah’s former Chatham County jail. Four initial teams developed separate proposals before consolidating into Unveil and Float, then one combined team. Unveil treats the threshold as a sequence of arrival, transition and revelation. Float proposes a suspended timber auditorium above a reflecting courtyard, using water to reconsider the relationship between the historic building and a changing coastal environment. The studies examine how new circulation, structure and environmental systems can support a shared cultural programme while retaining the existing masonry. Models, sections and construction studies test the relationship between historic fabric and new intervention.
  brief: >-
    Reimagine Habersham Hall as a place for collective making and gathering. Develop an accessible arrival sequence and shared cultural spaces, coordinating new structure, water and environmental systems with the historic building.

