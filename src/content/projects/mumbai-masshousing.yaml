designBrief:
  abstract: >-
    This B.Arch design project examines residential redevelopment at Siddharth Nagar, Goregaon, Mumbai, combining middle-income and high-income housing with commercial space and a complete parking strategy. It asks how development capacity can support a viable real-estate proposal while preserving the qualities of a liveable neighbourhood. The study begins with existing residents, tenure, access and the development-control framework, then compares alternative arrangements of homes, shared open space, commercial frontage and vehicle storage. MIG and HIG dwelling types are tested through daylight, ventilation, privacy, shared amenities and efficient structural planning. A DCR study translates the applicable Mumbai regulations into an area statement and buildable envelope, making the relationship between entitlement, circulation, parking and usable housing explicit. The proposal develops through redevelopment scenarios, unit and block studies, a ground-level plan, sections and a transparent feasibility comparison.
  brief: >-
    Redevelop Siddharth Nagar with MIG and HIG housing, commercial frontage and shared open space. Coordinate daylight, privacy, parking and servicing within the development envelope, balancing residential quality with a clear feasibility strategy.
chapterNav: "scroll"
chapters:
  - title: "Typology"
    subtitle: "Redevelopment as neighbourhood design"
    body: |
      <div class="ch-prose">
        <p>Compare tower-and-podium, courtyard-block and hybrid arrangements at equivalent resident obligations and development capacity. Study MIG and HIG unit mixes, core efficiency, dwelling depth, cross-ventilation potential and shared amenities.</p>
        <p>Map existing households and businesses before defining rehabilitation and sale components. Give the street a legible commercial edge, protected residential entries and usable landscape; compare ground-level and podium open spaces for accessibility, shade and daily use.</p>
      </div>
  - title: "DCR study"
    subtitle: "From regulation to an area statement"
    body: |
      <div class="ch-prose">
        <p>Build a clause-by-clause study from the applicable Greater Mumbai DCPR and amendments. Record plot area and deductions, land use and reservations, road width, the eligible redevelopment route, FSI components and their treatment, setbacks, height, fire access, recreation space and amenity obligations.</p>
        <p>Calculate residential and commercial parking separately from the final use and area mix, including applicable visitor, accessible and service provision. Test basement, podium and mechanical options against ramps, turning, ventilation, fire access, drainage and the usable ground plane.</p>
        <p>Reconcile permissible and proposed areas with rehabilitation obligations, sale area, common circulation, parking construction, phasing and indicative costs. Do not assume an FSI incentive, a MHADA redevelopment provision or a parking ratio from the MIG/HIG labels alone.</p>
      </div>
  - title: "Design tests"
    subtitle: "Capacity, dwelling quality and feasibility"
    body: |
      <div class="ch-prose">
        <p>Compare dwelling yield and mix, net-to-gross area, daylight and ventilation proxies, privacy, usable open space per household, parking provision, vehicle-pedestrian conflicts and construction area. Separate resident entitlements from saleable development in each scenario.</p>
        <p>Test commercial servicing and parking peaks alongside residential access. Review indicative costs, revenue assumptions and temporary relocation needs transparently. The design approach needs revision if capacity depends on ineligible incentives, unusable open space, compromised homes or an unresolved parking layout.</p>
      </div>
  - title: "References"
    subtitle: "Sources and next inputs"
    body: |
      <div class="ch-prose">
        <p><a href="https://portal.mcgm.gov.in/irj/go/km/docs/documents/MCGM%20Department%20List/Chief%20Engineer%20%28Development%20Plan%29/Docs/SANCTIONED%20DP2034/DCPR/DCPR%202034.pdf">BMC — Greater Mumbai DCPR 2034, sanctioned base document</a>. Read with amendments and notifications applicable to the scheme and its chosen study date; this draft assigns no numerical entitlement.</p>
        <p>Next inputs: CTS number and surveyed plot, ownership and tenure, existing sanctioned layout, resident and commercial inventory, road width, DP remarks, applicable redevelopment category and original academic design year. These determine which regulatory provisions can be used.</p>
      </div>
