description: |
  <div class="desc-scroll">
    <p>As a student of architecture, architects themselves have always fascinated me. Each one has a signature: a way of detailing, a material palette, a geometry you can spot from across the street. This experiment asks what happens when two of those signatures collide. Every pair here is two people who never worked together — often two who never could have — and the brief given to both is the same house: remote, off grid, no road and no power line, standing in a landscape that is taking it back.</p>
    <p>Each is one photograph rather than a set of details. An earlier run made six tight crops per pair and they read as renders of a wall; a single establishing shot has to show the whole building, which is the only way to see whether the two signatures actually met.</p>
    <p style="margin-top: 16px; font-size: var(--_tokens---type--micro); color: var(--_tokens---color--muted);">
    <em>Architects in this study: Tadao Ando, Luis Barragán, Frei Otto, Lina Bo Bardi, Geoffrey Bawa, Sverre Fehn, John Lautner, Hassan Fathy, Glenn Murcutt, Rudolf Schindler, Jørn Utzon, Paulo Mendes da Rocha, Oscar Niemeyer, Álvaro Siza, B. V. Doshi, Jean Prouvé, Buckminster Fuller, Pierre Koenig, Eileen Gray, Marcel Breuer, Toyo Ito, Ricardo Bofill, Charlotte Perriand, Wang Shu, Louis Kahn, Sigurd Lewerentz, Hans Scharoun, Rogelio Salmona, Adolf Loos, Eladio Dieste, Charles Rennie Mackintosh, Kazuo Shinohara, Erich Mendelsohn, Félix Candela, Julia Morgan, Paolo Soleri, Konstantin Melnikov, Bruce Goff, Yasmeen Lari, Anna Heringer, Arata Isozaki, Ralph Erskine, I. M. Pei, Enric Miralles, Kenzo Tange, Gottfried Böhm, Marina Tabassum, Laurie Baker.</em>
  </p>
  </div>

  <div class="prompt-box">
    <div class="prompt-header">
      <span class="prompt-header-title">Prompt</span>
      <button class="copy-prompt-btn" aria-label="Copy prompt">
        <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span class="copy-btn-text">Copy</span>
      </button>
    </div>
    <div class="prompt-body">
      <span class="prompt-text">"Magnificent architectural photograph of an entire remote off-grid house that fuses [Architect A] — as in [Building A] — with [Architect B], as in [Building B]. Wide establishing landscape shot showing the full house, roofline to ground foundation, nothing cropped or cut off. [A's signature], interleaved with [B's signature], so that no single element reads as belonging to only one architect; the two halves meet across [the divide]. The house stands on [the site], completely self-sufficient — solar, rainwater, no road, no power line, no neighbouring building. [Vegetation] grow hard against the walls and reclaim the base of the house. First light, low raking sun, long shadows. Camera at eye level, house centered, wide-angle lens, corrected straight verticals. Architectural photography, tack sharp focus, natural light only, photoreal, physically based materials."</span>
    </div>
  </div>
