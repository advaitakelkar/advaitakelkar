    body: "<p><a href=\"/archv-in/Scarpin.html\">The original page on archv.in \u2197</a></p><p><strong>Home</strong></p><p><strong>Scarpin\u2019</strong></p><p><strong>Published:</strong></p><p><strong>Reject Exhibit by Design Fabric</strong></p><p>(26-30th September, 2018)</p><p><strong>Mentors:</strong></p><p><strong>Samir Raut 823</strong></p><p><strong>Participants:</strong></p><p><strong>Various Artists</strong></p><img src=\"/archv-in/images/Scarpin/001_Scarpin-Carosel_19.12.28Artboard-1.jpg\" alt=\"Scarpin&#x27;\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>The quest to find a link between architecture and graphic design drives these explorations. It gives hope to create a knot between these two worlds. The pleasure of projecting architecture in form of graphic media created this coherent visual world, which continues to be extended into something beautiful.</p><p>Initiated by expressing the complex geometries of Carlos Scarpa (Architect) in a visual format, the journey was later extended into a collaborative exercise.</p><p><strong>Aim:</strong></p><p>To express architecture through graphic design in form of digital and print media.</p><p>enter\ue04e</p><p>Scarpin has been documented in an archive of illustrations created in MAY 2020.</p><p><strong>Scarpin\u2019 2020</strong></p><p><strong>Scarpin\u2019 2020</strong></p><p><strong>Prelude</strong></p><img src=\"/archv-in/images/Scarpin-2020/003_Brions-Tomb-Carlos-Scarpa.jpg\" alt=\"Scarpin&#x27;\" loading=\"lazy\" /><p>Introduced to Carlo Scarpa by mentors at Studio 823, it was while designing a microbrewery in Bandra (which never got made) that the obsession began.</p><p>Visually Scarpa\u2019s volumes might not seem complex, but while hand illustrating them into construction details, we realise the intricacies of the geometry he worked with. Being actively involved as both, a graphic designer and architect whilst obsessing over Scarpa, gave hope to find a link between these two worlds.</p><p>Paying homage to the architect Carlo Scarpa, whose work originated this quest, the term SCARPIN\u2019 was coined. The pleasure was of projecting architecture in the form of graphic media while creating a coherent visual world, which was yet to be explored into something more beautiful.</p><p>This initiation of Scarpin&#x27; as a collaborative landscape was conceptualized by the participation of close friends and colleagues at ARC.HV while translating the works of Roberto Burle Marx and John Hedjuk.</p><p><strong>Initial Ideation &amp; Process</strong></p><p>Internal participation and the exchange of thoughts through graphic media put spotlight on the power of cross communication. Seeing others manifest their beautiful creations, made us curious to want to learn more about the architect. Our awareness and knowledge about architecture was broadening while simultaneously exploring new visual styles.</p><p>There is an untold sense of beauty in observing through someone else\u2019s lens ; this project helped instigate that . All while bringing to light the work of some of the greatest architects.</p><p>Thus, we wanted to create an experience where various artists could join in with their own interpretations. The intention was to urge architects to come out of their comfort zone and explore graphic design as a visual medium for expression; and to create a collective exhibit during the COVID-19 Lockdown.</p><p>We also personally asked graphic designers and visual artists to participate along with us, to understand how they viewed architecture.</p><p>We hope to instigate communication within the creative community about their personal process and formats of creation. After the awesome involvement from our enthusiastic participants we extended this journey of creation into another project, called Virtual Gods .</p><p><strong>Group Exhibit</strong></p><p>We are super greatful to have these beautiful minds participate with us.</p><p>Featured Participants (in no particular order) :</p><p>Bhaumik, Divya Wadgama, Ishita Parmar, Sohil Soni, Jinal Wadgama, Jhanvi, Anuj Modi, Siddhesh Kadam, Yash Pradhan, Sajid Wajid Sheikh, Samir Raut, Advaita Kelkar, Faizan Khatri, Dhruv Sachala, Shravan Suresh, Arko Saha, Devarsh Seth, Sneha Desai, Shweta Malhotra, Kuldeep Jangid, Nayan Mote, Varun Mehta</p>"
