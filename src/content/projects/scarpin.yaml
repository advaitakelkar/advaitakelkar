chapters:
  - title: "Scarpin\u2019 2020"
    subtitle: "A collective lockdown exhibit"
    body: "<p class=\"ch-statement\">Paying homage to Carlo Scarpa, whose work originated this quest, the term Scarpin\u2019 was coined.</p><div class=\"ch-split\"><div class=\"ch-prose\"><p>Introduced to Carlo Scarpa by mentors at Studio 823, it was while designing a microbrewery in Bandra (which never got made) that the obsession began.</p><p>Visually Scarpa\u2019s volumes might not seem complex, but while hand illustrating them into construction details, we realise the intricacies of the geometry he worked with. Being actively involved as both, a graphic designer and architect whilst obsessing over Scarpa, gave hope to find a link between these two worlds.</p><details class=\"ch-more\"><summary><span class=\"ch-more__open\">Read more</span><span class=\"ch-more__close\">Read less</span></summary><p>Paying homage to the architect Carlo Scarpa, whose work originated this quest, the term SCARPIN\u2019 was coined. The pleasure was of projecting architecture in the form of graphic media while creating a coherent visual world, which was yet to be explored into something more beautiful.</p><p>This initiation of Scarpin&#x27; as a collaborative landscape was conceptualized by the participation of close friends and colleagues at ARC.HV while translating the works of Roberto Burle Marx and John Hedjuk.</p><h4>Initial Ideation &amp; Process</h4><p>Internal participation and the exchange of thoughts through graphic media put spotlight on the power of cross communication. Seeing others manifest their beautiful creations, made us curious to want to learn more about the architect. Our awareness and knowledge about architecture was broadening while simultaneously exploring new visual styles.</p><p>There is an untold sense of beauty in observing through someone else\u2019s lens ; this project helped instigate that . All while bringing to light the work of some of the greatest architects.</p><p>Thus, we wanted to create an experience where various artists could join in with their own interpretations. The intention was to urge architects to come out of their comfort zone and explore graphic design as a visual medium for expression; and to create a collective exhibit during the COVID-19 Lockdown.</p><p>We also personally asked graphic designers and visual artists to participate along with us, to understand how they viewed architecture.</p><p>We hope to instigate communication within the creative community about their personal process and formats of creation. After the awesome involvement from our enthusiastic participants we extended this journey of creation into another project, called Virtual Gods .</p></details></div><figure><img src=\"/archv-in/images/Scarpin-2020/003_Brions-Tomb-Carlos-Scarpa.jpg\" alt=\"Brion Tomb, Carlo Scarpa\" loading=\"lazy\" /><figcaption><strong>Brion Tomb, Carlo Scarpa</strong></figcaption></figure></div><p class=\"ch-origin\"><a href=\"/archv-in/Scarpin-2020.html\">The original page on archv.in \u2197</a></p>"
