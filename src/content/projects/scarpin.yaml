arpin-2020/013_ARCHV_Scarpin_Siza_2_Shravan-2.jpg\" alt=\"Alvaro Siza by Shravan Suresh\" loading=\"lazy\" /><img src=\"/archv-in/images/Scarpin-2020/014_ARCHV_Scarpin_Siza_3_Shravan.jpg\" alt=\"Alvaro Siza by Shravan Suresh\" loading=\"lazy\" /></div><figcaption><strong>Alvaro Siza</strong>Shravan Suresh</figcaption></figure><figure><img src=\"/archv-in/images/Scarpin-2020/015_ARCHV_Scrapin_Devarsh.jpg\" alt=\"Tadao Ando by Devarsh Seth\" loading=\"lazy\" /><figcaption><strong>Tadao Ando</strong>Devarsh Seth</figcaption></figure><figure><img src=\"/archv-in/images/Scarpin-2020/016_ARCHV_Scrapin_Sajid.jpg\" alt=\"Le Corbusier by Sajid Wajid Sheikh\" loading=\"lazy\" /><figcaption><strong>Le Corbusier</strong>Sajid Wajid Sheikh</figcaption></figure><figure><img src=\"/archv-in/images/Scarpin-2020/017_ARCHV_Scrapin_Divya.gif\" alt=\"Carlo Scarpa by Divya Wadgama\" loading=\"lazy\" /><figcaption><strong>Carlo Scarpa</strong>Divya Wadgama</figcaption></figure><figure><div class=\"ch-slides\"><img src=\"/archv-in/images/Scarpin-2020/018_ARCHV_Scrapin_Kuldeep-1.jpg\" alt=\"Tadao Ando by Kuldeep Jhangid\" loading=\"lazy\" /><img src=\"/archv-in/images/SANAAxAndo/003_ARCHV_Scrapin_Kuldeep-2.jpg\" alt=\"Tadao Ando by Kuldeep Jhangid\" loading=\"lazy\" /></div><figcaption><strong>Tadao Ando</strong>Kuldeep Jhangid</figcaption></figure><figure><div class=\"ch-slides\"><img src=\"/archv-in/images/ItoxCorbusier/004_ARCHV_Scrapin_Sneha-2.jpg\" alt=\"Toyo Ito by Sneha Desai\" loading=\"lazy\" /><img src=\"/archv-in/images/ScarpaxIto/004_ARCHV_Scrapin_Sneha-1.jpg\" alt=\"Toyo Ito by Sneha Desai\" loading=\"lazy\" /></div><figcaption><strong>Toyo Ito</strong>Sneha Desai</figcaption></figure><figure><img src=\"/archv-in/images/Scarpin-2020/022_ARCHV_Scarpin_Sam.jpg\" alt=\"Ettore Sottass by Samir Raut\" loading=\"lazy\" /><figcaption><strong>Ettore Sottass</strong>Samir Raut</figcaption></figure><figure><img src=\"/archv-in/images/Scarpin-2020/023_ARCHV_Scrapin_Shravan.jpg\" alt=\"Jo