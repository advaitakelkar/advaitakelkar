chapters:
  - title: "VNDLS"
    subtitle: "Vandalizing for the good"
    body: "<p class=\"ch-statement\">Vandalizing for the good: quick guerrilla actions in the local urban landscape, instead of \u201cawareness\u201d as a design trigger.</p><ul class=\"ch-facts\"><li><span>Published</span><span>Platform Magazine \u00b7 November 2020</span></li><li><span>Mentor</span><span><ul class=\"ch-list\"><li>Faizan Khatri \u00b7 The Initiative</li></ul></span></li><li><span>Participants</span><span><ul class=\"ch-list\"><li>Nayan Mote</li><li>Sneha Desai</li><li>Yash Pendse</li><li>Advaita Kelkar</li><li>Varun Mehta</li></ul></span></li><li><span>Aim</span><span>To look beyond awareness of local environmental issues, through guerrilla urban interventions.</span></li></ul><div class=\"ch-prose\"><h4>Introduction</h4><p>What began as speculation and thought provoking assessment through group gatherings every Sunday,</p><p>resulted in the conception of VNDLS\u2018. Initiated through an exchange of ideas and a realization of problematic factors, our objective is to discuss and map out issues relating to the future of local environments.</p><p>Instead of using \u201cawareness\u201d as a design trigger, the group focuses its goals towards vandalizing for the good. This allows us to put conscious focus on social design through quick guerrilla actions into our local urban landscape.</p><p>VNDLS\u2018 focuses on urban intervention through recognizing the spatial interactions between humans, animals and nature and defining a co existing habitat.The scope of VNDLS\u2018 isn\u2019t limited to any predefined parameters, but rather is a constantly developing study.</p><p>This collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing.The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>There is also an emphasis on data collection + analysis, and experiments with story telling in order to guide the designs. The methodology constantly evolves and expands its horizons organically with each new development that takes form.</p><h4>Methodology \u00b7 the Sunday Service</h4><p>VNDLS is a group young designers/creative individuals allocating time every Sunday for this project.</p><p>We call this the Sunday Service meetings. This is when the group collectively meets holding dialogues towards planning and ideation.</p><p>The collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing. The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>The entire process has been meticulously guided by Faizan Khatri , who has been intensively involved with Animal Research and Design called The Initiative at studio eight twentythree, which houses most cats and dogs from the neighborhood.</p><p>The group is also incubates on data collection + analysis, and experiments with story telling in order to guide the designs. Their methodology constantly evolves and expands its horizons organically with each new development that takes form.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/008_VNDLS-Methodolgy_20.05.31.jpg\" alt=\"VNDLS methodology\" loading=\"lazy\" /><figcaption><strong>Methodology</strong></figcaption></figure></div><ul class=\"ch-facts\"><li><span>With thanks to</span><span><ul class=\"ch-list\"><li>Yash Pendse</li><li>Sneha Desai</li><li>Advaita Kelkar</li><li>Nayan Mote</li><li>Shashank Ahuja</li><li>Devarsh Seth</li><li>Dhruv Chavan</li><li>Surya Subramaniam</li><li>Varun Mehta</li></ul></span></li></ul><p class=\"ch-origin\"><a href=\"/archv-in/VNDLS.html\">The original page on archv.in \u2197</a></p>"
  - title: "Prototypes"
    subtitle: "Fifteen rapid prototypes"
    body: "<p class=\"ch-statement\">Fifteen interventions, each drawn into the street it belongs to, specified, and detailed to be built.</p><div class=\"ch-prose\"><p>Every prototype carries its street illustration, a spec sheet \u2014 materials, functions, location, cost and time \u2014 and the technical drawings to build it.</p></div><div class=\"ch-int\"><div><h4>Crate Shelf</h4><p class=\"ch-int__tagline\">Prototype 01 \u00b7 rapid prototyping</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/VNDLSmain/047_001.jpg\" alt=\"Crate Shelf\" loading=\"lazy\" /><figcaption><strong>Street illustration</strong></figcaption></figure><figure><img src=\"/archv-in/images/VNDLSmain/048_01.0.jpg\" alt=\"Crate Shelf\" loading=\"lazy\" /><figcaption><strong>Spec sheet</strong></figcaption></figure><figure><img src=\"/archv-in/images/VNDLSmain/049_01.1.jpg\" alt=\"Crate Shelf\" loading=\"lazy\" /><figcaption><strong>Technical drawings</strong></figcaption></figure><figure><img src=\"/archv-in/images/VNDLSmain/050_01.2.jpg\" alt=\"Crate Shelf\" loading=\"lazy\" /><figcaption><strong>Technical drawings</strong></figcaption></figure></div></div><div class=\"ch-int\"><div><h4>Stray Hut</h4><p class=\"ch-int__tagline\">Prototype 02 \u00b7 rapid prototyping</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/VNDLSmain/044_002.jpg\" alt=\"Stray Hut\" loading=\"lazy\" /><figcaption><strong>Street illustration</strong></figcaption></figure><figure><img src=\"/archv-in/images/VNDLSmain/045_02.0.jpg\" alt=\"Stray Hut\" loading=\"lazy\" /><figcaption><strong>Spec sheet</strong></figcaption></figure><figure><img src=\"/archv-in/images/VNDLSmain/046_02.1.jpg\" alt=\"Stray Hut\" loading=\"lazy\" /><figcaption><strong>Technical drawings</strong></figcaption></figure></div></div><div class=\"ch-int\"><div><h4>Egg</h4><p class=\"ch-int__tagline\">Prototype 03 \u00b7 rapid prototyping</p></div><div class=\"ch-grid\" style=\"-