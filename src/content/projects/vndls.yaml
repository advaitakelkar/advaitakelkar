  - title: "VNDLS"
    subtitle: "Vandalizing for the good"
    body: "<p><a href=\"/archv-in/VNDLS.html\">The original page on archv.in \u2197</a></p><img src=\"/images/vndls/01.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/02.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/03.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/04.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/05.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/06.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/07.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/08.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/09.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/10.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/11.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/12.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/13.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/14.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/15.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/16.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/17.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/18.webp\" alt=\"\" loading=\"lazy\" /><img src=\"/images/vndls/19.webp\" alt=\"\" loading=\"lazy\" /><p><strong>Home</strong></p><p><strong>VNDLS</strong></p><p><strong>Published:</strong></p><p><strong>Platform Magazine November 2020</strong></p><p><strong>Mentors:</strong></p><p><strong>Faizan Khatri</strong></p><p><strong>Participants:</strong></p><p><strong>Nayan Mote</strong></p><p><strong>Sneha Desai</strong></p><p><strong>Yash Pendse</strong></p><p><strong>Advaita Kelkar</strong></p><p><strong>Varun Mehta</strong></p><img src=\"/archv-in/images/VNDLS/001_VANDALS-GIF-Banner.gif\" alt=\"VNDLS\" loading=\"lazy\" /><p><strong>Description:</strong></p><p>Initiated through a group gathering on Sundays, VNDLS \u2018 objective is to discuss and map out issues relating to the future of local environments.</p><p>Instead of using \u201cawareness\u201d as a design trigger, the group focuses its goals towards vandalizing for the good.</p><p>This allows us to put conscious focus on social design through quick guerrilla actions into our local urban landscape.</p><p>We intend to design alternate beneficial systems for humans, that investigate local issues which the group collectively identifies. This enables us to transition change in bits and pieces into the society, rather than providing temporary solutions to a long-standing problem.</p><p><strong>Aim:</strong></p><p>To look beyond awareness of local environmental issues, through Guerrilla Urban Interventions.</p><p>member access\ue04e</p><p>This project is a WIP and is currently being documented.</p><p>It is only accesible by our participants and patrons for the time being.</p><p>Please mention your name and the project name in the form</p>"
  - title: "The study"
    subtitle: "VNDLS, the full study"
    body: "<p><strong>VNDLS</strong></p><p>Work in progress. Preview acess only for participating members</p><p>The work presented herein has been guided and inspired by Faizan Khatri,</p><p>who has been intensively involved with Street Animal Research and Design Exploration called The Initiative. His work includes Studies, mappings, photographic, video-graphic and illustrative documentations knitted over years of understanding and research.</p><p>Faizan is an architect and educator. He is one of the three partners at studio eight twentythree, a collaborative design practice based in Mumbai, India. His constant efforts and humble nature have, over the years, inspired several of his students, colleagues and employees to join in his endeavors towards bettering the lives of the street animals.</p><p>He has actively shared his resources and expertise to guide, design, document and help build the Animal Shelter Pods along with a fast-growing team of enthusiastic individuals who believe in this vision through VNDLS.</p><p><strong>You can delve deeper into his work here:</strong></p><p>https:// www.theinitiative.life/</p><p>We would also like to extend our gratitude towards all architects, artitsts and animal enthusiats that participated with us. To name a few Yash Pendse, Sneha Desai, Advaiata Kelkar, Nayan Mote, Shashank Ahuja, Devarsh Seth, Dhruv Chavan, Surya Subramaniam, Varun Mehta</p><p><strong>Index</strong></p><p>1. Introduction</p><p>1.1 Prelude</p><p>1.2 Aspiration</p><p>1.3 Objectives</p><p>2. Methodology</p><p>3. Design</p><p>3.1 Direction</p><p>3.2 Conceptual ideation</p><p>3.3 Conceptual ideation</p><p>6.5 Prototyping</p><p>6.6 Field Testing</p><p>4. General Questions</p><p>5. Links to Files</p><p>6. Timeline Archives</p><p>1. Introduction</p><p>What began as speculation and thought provoking assessment through group gatherings every Sunday,</p><p>resulted in the conception of VNDLS\u2018. Initiated through an exchange of ideas and a realization of problematic factors, our objective is to discuss and map out issues relating to the future of local environments.</p><p>Instead of using \u201cawareness\u201d as a design trigger, the group focuses its goals towards vandalizing for the good. This allows us to put conscious focus on social design through quick guerrilla actions into our local urban landscape.</p><p>VNDLS\u2018 focuses on urban intervention through recognizing the spatial interactions between humans, animals and nature and defining a co existing habitat.The scope of VNDLS\u2018 isn\u2019t limited to any predefined parameters, but rather is a constantly developing study.</p><p>This collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing.The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>There is also an emphasis on data collection + analysis, and experiments with story telling in order to guide the designs. The methodology constantly evolves and expands its horizons organically with each new development that takes form.</p><p>*** Hover over any part of the illustration and click on the arrows to view the DIY Construction details.</p><img src=\"/archv-in/images/VNDLSmain/003_015.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/004_15.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/005_15.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/006_014.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/007_14.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/008_14.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/009_14.2.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/010_013.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/011_13.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/012_13.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/013_012.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/014_12.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/015_12.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/016_011.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/017_11.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/018_11.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/019_010.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/020_10.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/021_10.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/022_10.2.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/023_009.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/024_09.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/025_09.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/026_008.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/027_08.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/028_08.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/029_007.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/030_07.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/031_07.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/032_006.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/033_06.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/034_06.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/035_005.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/036_05.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/037_05.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/036_05.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/038_004.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/039_04.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/040_04.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/041_003.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/042_03.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/043_03.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/044_002.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/045_02.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/046_02.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/047_001.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/048_01.0.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/049_01.1.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/050_01.2.jpg\" alt=\"The study\" loading=\"lazy\" /><p>2. Methodology</p><p>VNDLS is a group young designers/creative individuals allocating time every Sunday for this project.</p><p>We call this the Sunday Service meetings. This is when the group collectively meets holding dialogues towards planning and ideation.</p><p>The collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing. The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>The entire process has been meticulously guided by Faizan Khatri , who has been intensively involved with Animal Research and Design called The Initiative at studio eight twentythree, which houses most cats and dogs from the neighborhood.</p><p>The group is also incubates on data collection + analysis, and experiments with story telling in order to guide the designs. Their methodology constantly evolves and expands its horizons organically with each new development that takes form.</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/008_VNDLS-Methodolgy_20.05.31.jpg\" alt=\"The study\" loading=\"lazy\" /><p>3. Design</p><p>3.1 Direction</p><p>The design intent dabbles between what would be absolute necessities with generous sprinkles of dreams and aspirations. The direction varies from responding to materiality, temporality, efficiency, climate responsiveness, durability, reparability and minimal intrusion to aesthetics, art installation value, high detailing, sustainability, modularity, light weightiness, collapsibility, and cost effectiveness.</p><p>3.2 Triggers for Design</p><p>a. Material Archive</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/029_Hemcrete.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Hempcrete</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/030_Concrete.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Microconcrete</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/031_ABS-Plastic.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Acrylonitrile Butadiene Styrene</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/032_Plastic.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Recycled Plastic Modules</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/033_Terracotta.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Terracotta</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/034_Clay.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Clay</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/035_Waste-Fabric.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Waste Fabric</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/036_Ply.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Birch Ply</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/037_Tyre.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Tyres</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/038_PVC.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>PVC Pipes</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/039_Rammed-earth.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Rammed Earth</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/040_Polycarb.png\" alt=\"The study\" loading=\"lazy\" /><p><strong>Corrugated Plastic Sheets</strong></p><p>b. Identification of Locations for interventions</p><p>Mapping places where strays are usually found</p><ul><li>Compound Wall</li><li>Corporate Smoking zones- Ash Trays</li><li>Bus Stops</li><li>Street Furniture: Benches</li><li>Planter Boxes</li><li>Road Dividers</li><li>Gates</li><li>Dustbins</li><li>Tapris</li><li>Gardens</li><li>Street Dwellers</li></ul><p>c. Mapping realtime locations for field testing</p><p><strong>Shivaji Park</strong></p><p><strong>Dadara West</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/047_VNDLS_Maps_20.03.15Artboard-3.jpg\" alt=\"The study\" loading=\"lazy\" /><p><strong>Skate Park</strong></p><p><strong>Carter Road Bandra West</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/048_VNDLS_Maps_20.03.15Artboard-2.jpg\" alt=\"The study\" loading=\"lazy\" /><p>823</p><p>Prakash Building Garage, Dadar</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/049_VNDLS_Maps_20.03.15Artboard-1.jpg\" alt=\"The study\" loading=\"lazy\" /><p>3.3 Prototyping</p><img src=\"/archv-in/images/VNDLSmain/067_VNDLS-Prototype-5.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/068_VNDLS-Prototype-3.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/069_VNDLS-Prototype-4.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/096_002_VNDLS_Process-Images_20.03.15.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/091_00100lrPORTRAIT_00100_BURST20200203153532771_COVER.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/072_VNDLS-Prototype-2.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/VNDLSmain/073_VNDLS-Prototype.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/098_VNDLS_Maps_20.03.15Artboard-6.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/099_VNDLS_Maps_20.03.15Artboard-5.jpg\" alt=\"The study\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/100_2020-05-20.jpg\" alt=\"The study\" loading=\"lazy\" /><p>4. General Questions</p><p>(1) Why do street animals exist?</p><p>Street dogs and feral cats exist in large numbers in developing country like India:</p><ul><li>Human settlements (urban and rural both) inevitably create a noticeable amount of garbage that lies exposed. This essentially enables the street animal\u2019s existence. The animals quickly learn to scavenge. In the absence of this food source, they would have a a tougher time sustaining.</li><li>Couple this with their high reproduction rates and numbers. A female dog gives birth to an approximate of two litters of 4-10 pups each year. Cats have a higher number of three to four litters of up to 3-9 kittens annually. Thus the entire population grows exponentially over years.</li><li>Cities and towns in India have a huge amount of population surviving on the streets (Mumbai has an astonishing 60% of its population living on the streets!). The street dwellers, humans and animals, share a rather strong interdependence with regards to their psychological well-being and security taking care of each other.</li><li>Shopkeepers and others take active interest in tending to the needs of these animals, feeding them and looking out for their health.</li></ul><p>(2) Are there laws pertaining to the rights, responsibilties of care-takers and welfare of street animals?</p><p>India endorses ahimsa (non-violence) and this has always enabled people to peacefully co-exist with animals. It is a citizen\u2019s duty to show compassion towards all living creatures according to Article 51A(g) of the Constitution. A fundamental freedom guaranteed to the citizens of India, is the freedom to choose the life they wish to live, which includes facets such as living with or without companion animals and moreover assigns a duty to ensure animals are taken care of and respected whist watching out for any kind of cruelty towards them. Resident Welfare Organisations and Apartment owners associations cannot object pets as companions and cannot form laws against it, neither against permissible ways of housing and feeding street animals within society boundaries, even by majority. A \u201cban\u201d for animals/pets is considered illegal by the law.</p><p>Although the AWIB recognises pet owners and care givers to stray animals as different entities, their duties and responsibilities intersect. A pet owner or a stray care giver, should ideally take care of the health, sterilisation, and vaccination of the animal. This can either be done privately or with the help of animal welfare organisations.</p><p>Personally, it is the responsibility of the owner or the care giver to maintain cleanliness and hygiene where the animal defecates, lives and feeds.</p><p>They also have to make sure that the animals are not a nuisance to others around them.</p><p>The Animal Welfare Board of India (AWBI) has listed down in detail, all acts, rules and laws pertaining to the rights of animals and prevention of cruelty on their website. ( http://www.awbi.in/policy_acts_rules.html )</p><p>(3) Are there any provisions to keep the street animal population under control?</p><p>Large populations of stray dogs and cats turn into public health concerns. Dog bites, rabies, leptospirosis, cat scratch fever, and so on are all risks for people living in areas with large populations of strays which often leads to territorial fights and incessant barking at nights. While it\u2019s important to ensure the welfare of street animals, it\u2019s equally important to keep a check on their population to control the spread of diseases and prevent possible bites and attacks.</p><p>Animal Welfare Board prescribes Animal Birth Control Rules, 2001 (ABC) as the only effective methodology of keeping the street animal population under check along with vaccinations. The Honorable Supreme Court of India has further ordered the implementation of the ABC program to control the street dog population in all states of India since 2015.</p><p>ABC involves spaying of females and castration of male dogs so that they do not reproduce. Vaccination involves giving the dogs an anti- rabies shot. After sterilization the dogs do not reproduce and hence their population becomes stable. As they are vaccinated against Rabies and other diseases they do not pose any health hazard and live out their natural lives healthily and harmlessly, while protecting their territories from other aggressive dogs that may want to enter.</p><p>NGOs / individuals take up responsibilty to assist with ABC in their respective areas of functioning via a closed network of communication.</p><p>(4) What are the broad categories of differentiation in animal identification as a pet / a street animal?</p><p>Definitions are based on two quantifiable parameters: the level of an animal&#x27;s dependency on humans and the level of its restriction by humans (World Health Organization, 1988).</p><p>The first of these refers to the intentional provision of those needs, such as food, shelter and care, necessary for the survival and well-being of the animal. Although it was recognized that this dependency of animals on humans was a gradient ranging from total dependency to none, the following three categories of dependency were proposed:</p><ul><li>Full dependency \u2013 the animal is given all of its essential needs intentionally by humans</li><li>Semi-dependency \u2013 the animal is given some of its essential needs intentionally by humans</li><li>No dependency \u2013 the animal is given none of its essential needs intentionally by humans.</li></ul><p>The second parameter, restriction by humans, refers to the control of any contact, association and communication with other animals and people, either through physical restriction (e.g. confinement to premises, leashing) or through direct supervision and control when outside the premises. Again, three categories of restriction are recognized:</p><ul><li>Full restriction \u2013 fully restricted or supervised</li><li>Semi-restricted \u2013 movements and associations only partially restricted</li><li>No restriction \u2013 not subject to any restriction whatsoever.</li></ul><p>Four broad categories of animals which exist:</p><ul><li>Restricted animal \u2013 fully dependent on their owners and fully restricted or supervised</li><li>Family animals \u2013 fully dependent on their owners, but movement and contacts only partially restricted</li><li>Neighborhood animals \u2013 partially dependent on the intentional fulfilment of basic needs by humans, but subject to only partial or no restriction</li><li>Feral animals \u2013 independent of intentional human provisioning and unrestricted.</li></ul><p>5. File Archive</p><p><strong>Member access only</strong></p><p><strong>VNDLS_Data Archive</strong></p><p><strong>VNDLS_Material Archive</strong></p><p><strong>VNDLS_Design Archive</strong></p><p><strong>VNDLS_Interview Survey</strong></p><p><strong>VNDLS_WriteUp</strong></p><p>6. Timeline Archive</p><p>15 Dec 2019// Introductions and defining Path</p><p>22nd Dec 2019// Taking up tasks and triggering fabrication</p><p>05th Jan 2020// Research Structure, Tyre Ideation, Scans First Look, Identity Initiation</p><p>12th Jan 2020// Format and story telling discussion</p><p>19th Jan 2020// Format Documentation Parameters, AWBI laws, Prototype Model, first draft of story telling</p><p>26th Jan 2020 // Casted Billi Bowl, Tyre Material, Finalise format</p><p>9th Feb 2020// Taj mahal Tea house, Mini Review</p><p>16th Feb 2020// Interview discussion, Format, Design upgrades, Field Days, Funding and crowd funding options</p><p>23rd Feb 2020// Finally we review + Google Drive Set up</p><p>27th Feb 2020 // Tyre Prototype at Pendses</p><p>5th March 2020 // Design Digital Documentation</p><p>15th Mar 2020 // Google Drive Organisation, Web Documentation Beta 1.0, Pod Illustrations</p><p>26th March 2020 // Google Hangout Call</p><p>29th March 2020 // Sharing Speculative futures and the collective dialougue around it</p><p>5th April 2020 // Web Documentation Beta 2.0</p><p>11th April 2020 // Web narrative review</p><p>19th April 2020 // Conference call to assign tasks</p><p>1st May 2020 // Web Documentation Beta 3.0</p><p>2nd May 2020 // Tasks during the lockdown</p><p>6th May 2020 // Web 4.0</p><p>20th May 2020 // Meet to organise excels, tech sheets and illustration mock</p><p>31st May 2020 // Final Web + Revamp with material archive and text updates</p><p>6th June 2020 // Drop down menu Web, Kutta kisko bola</p><p>7th June 2020 // Tech Sheets, Crate Designs, Illustrations, The initiative Logo, Material based methodology</p><p>14th June 2020 // Tech Sheets, Crate Designs</p><p>21st June 2020 // Initiative Web Incubation</p><p>28th June 2020 // New Crate Designs, Lego Pods</p><p><strong>Thane Site Visit 1</strong></p><p>28th August 2020 // Mono Pod Proposal</p><p>6th October 2020 // Site Visit 2</p><p>6th-18th October 2020 // Sorting Out Material and Labour</p><p>20th October 2020 // Lisa Maam Pitch</p><p>22nd October 2020 // Rconnect Virtual Meet</p><p>24th October 2020 // Prototyping Round 2 on Site</p><p>October-November 2020 // Protoyping on Thane Skatepark site, with furmas made at Andheri warehouse</p><p>Somewhere around December 2020 the group parted ways in their own directions</p><p>But the core team continues its efforts in rewiring the process, understanding from the mistakes made and reviving this project</p><p>We meet stakeholders such as Jagrat. Raftar and Sanskar</p><p>1st October 20201 // The New Direction</p><p>22nd October 2021 // Bombay Underground Zine Fest</p>"
  - title: "The Initiative"
    subtitle: "Project 001: The Initiative"
    body: "<p><strong>The Initiative</strong></p><p>VNDLS // Project 001 ft. Faizan Khatri</p><p>This page is currently under construction and is accesible only by members Index</p><p>1. Introduction</p><p>1.1 Prelude</p><p>1.2 Aspiration</p><p>1.3 Objectives</p><p>2. Methodology</p><p>3. Face off</p><p>3.1 Initial Imprints</p><p>3.2 Observations</p><p>4. Research and Analysis</p><p>4.1 Kutta Kisko Bola</p><p>4.2 References</p><p><strong>Books and other resources</strong></p><p>4.3 General questions</p><p>5. Intervention</p><p>5.1 Opportunities and Vision</p><p>5.2 Design Direction</p><p>6. Design</p><p>6.1 Triggers for Design</p><p><strong>Material Archive</strong></p><p>Identification of location for interventions</p><p>Mapping real-time locations for field testing</p><p>6.2 Conceptual ideation</p><p>6.3 Design Typologies</p><p>6.4 Simulations and Technical Specifications</p><p>6.5 Prototyping</p><p>6.6 Field Testing</p><p>6.7 Proof of Concept</p><p>7. Story Telling</p><p>8. Links to Files</p><p>9. Timeline Archives</p><p><strong>About Faizan Khatri</strong></p><p><strong>The Mentor</strong></p><p>The work presented herein has been guided and inspired by Faizan Khatri, who has been intensively involved with Street Animal Research and Design Exploration called The Initiative.</p><p>His work includes Studies, mappings, photographic, video-graphic and illustrative documentations knitted over years of understanding and has been featured in this compilation.</p><p>Faizan is an architect and educator. He is one of the three partners at studio eight twentythree, a collaborative design practice based in Mumbai, India. The studio&#x27;s diverse work varies from installation art to spatial design and from visual arts to architecture, achieving a broad perspective of various design streams, through a unique mix of perceptions and influences.</p><p>His constant efforts and humble nature have, over the years, inspired several of his students, colleagues and employees to join in his endeavors towards bettering the lives of the street animals.</p><p>He has been actively sharing his resources and expertise to guide, design, document and build the Animal Shelter Pods along with a fast-growing team of enthusiastic individuals who believe in this vision through VNDLS.</p><p>Faizan would like to extend gratitude to Fatema Master, Sanchita Pawar, Shashank Ahuja, Varun Mehta, Advaita Kelkar, Ami Joshi, Baqer Mehdiyan, Osama Khan, Varun Gulavane, Bharat Sharma, and his partners at the design studio, Samir Raut, Siddhesh Kadam for helping The Initiative take shape.</p><p>1. Introduction</p><p>1.1 Prelude</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/003_Initial-Imprints_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>We notice them when we want to,</p><p>we don\u2019t when we don\u2019t.</p><p>\u201cOur concerns for the street animals and our concerns for people are probably related to one another.</p><p>The troubles that street animals face are not independent from the troubles that we face (as humans).</p><p>It would be easy to see the street animals as a problem and handle them as a problem.</p><p>Whereas if we can learn to live together again, maybe we\u2019ll solve our own problems as we try to solve theirs.</p><p>That could well be our path towards regaining our fading sense of humor and rekindle our slowly dying joy for life.\u201d</p><p>KEDI \u2013 documentary film by Ceyda Torun illustrating the lives of street cats in Istanbul, Turkey.</p><p>Drawing parallels between the urban humans with street animals like dogs/cats, we observe how they tend to interact (or not) with these co-inhabitants and the way they exist alongside each other.</p><p>How does one define a home? Would it be a sprawling built space customized to fancy our luxurious desires? Or would it be a finite volume just enough to accommodate one\u2019s daily existential needs? Or then, would it be a sheet of tarpaulin stretched over a couple of bamboo\u2019s on a neglected pavement, saving one from the onslaught of weather. Or does it simply mean that tiny space below a parked car, or a hole in the compound wall?</p><p>Stepping outside the realm of what architecture along with art notionally stands for in its literal sense, The Initiative explores a logical take on the emotional dependence of the urban animals with humans through the lens of what one may call their safe haven \u2018my space\u2019.</p><p>1.2 Aspiration</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/004_1.2-Aspiration.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>There lies immense merit in the argument in today\u2019s time that designers should utilize their skills to resolve societal and environmental problems in the manner of an anti-consumerist approach rather than in support of the capitalist world. From supporting a single user, to a group of users, designers have the ability to create an impact through social design. (Interestingly, social design limits itself to certain sections of society, more so, society implying humans.)</p><p>While we share our world with fellow humans as well as animals along with nature, social design in densely populated human areas currently lacks exploration that empathizes with the welfare of street animals. The Initiative aspires to explore bridging that gap, combining art and design towards this endeavor of creating architecture for the non-human component of cities.</p><p>1.3 Objectives</p><p>The Initiative presents a study and illustration of the lives of stray animals and their habitat in different given cultural and physical conditions in the city of Mumbai. This further culminates into building animal shelter pods and feeders as usable/habitable art installations in different areas by deconstructing a typical street usage in a given city in India and intervening accordingly with the opportunities that present themselves. These pods would then begin to act as a safe haven for animals along with a pause point for humans, facilitating interaction if they desire acting as non-intrusive art inserts for the street dwellers and passers-by alike.</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/005_Objectives_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/006_Objectives_04.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/007_Objectives_06.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>2. Methodology</p><p>VNDLS is a group young designers/creative individuals allocating time every Sunday for this project.</p><p>We call this the Sunday Service meetings. This is when the group collectively meets holding dialogues towards planning and ideation.</p><p>The collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing. The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>The entire process has been meticulously guided by Faizan Khatri , who has been intensively involved with Animal Research and Design called The Initiative at studio eight twentythree, which houses most cats and dogs from the neighborhood.</p><p>The group is also incubates on data collection + analysis, and experiments with story telling in order to guide the designs. Their methodology constantly evolves and expands its horizons organically with each new development that takes form.</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/008_VNDLS-Methodolgy_20.05.31.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>3. Face Off</p><p>3.1 Initial Imprints</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/009_Initial-Imprints_02.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/003_Initial-Imprints_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/010_Observations_01.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/011_Observations_04.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>Mumbai city houses (or rather, witnesses) a stray or street dog population of close to one lakh. Out of which the population of street dogs in the Suburban Mumbai district is eight times larger. [1] (There is are no statistics available for the street cat population as of today.) Compare this to the 220 lakh human population of Mumbai, out of which the number of humans populating the slums/streets is close to an astonishing 60%. That\u2019s 132 lakh in numbers. [2]</p><p>Interestingly, the street dwellers, humans and animals, share a rather strong interdependence with regards to their psychological well-being and security. These animals are often conferred upon a name and considered as a close family member by those who live with them on streets. They end up forming an inseparable bond, which continues through life and generations. The street animals are found taking shelters under parked vehicle and other unsafe areas in proximity, often running a high risk of meeting with critical physical damage being run over and a lot times with an utterly painful death.</p><p>[1] As per survey carried out by the Mumbai Municipal Corporation in Oct 2017. Sources: the Asian Age, the Indian Express</p><p>[2] As per survey carried out by the Mumbai Municipal Corporation. Source: the Indian Express</p><p>3.2 Observations</p><p>It emerges strongly that their existence is easy to be ignored (we assume \u2018their\u2019 in this regard to be animals as well as humans that dwell on the streets); Ironically, shutting off their presence from the spectrum of vision for the (remaining) privileged 88 lakh urban dwellers of the city equipped with a shelter above their heads is often the case than not. Here probably lies the germination of the problem, and hence an attempt at a design intervention to address this lacuna.</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/012_Animal-Perspectiv-003.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/013_Observations_02.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/014_Observations_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/015_Animal-Perspectiv-001.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>4. Research + Analysis</p><p>4.1 Kutta Kisko Bola</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/016_A.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/017_B.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/018_C.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>The mapping exercises carried out by Faizan Khatri involved observing the animals through days to understand their movement patterns, pause points, resting points, covered / open to sky at different times of the day/night. The paths and pauses were then articulated through an illustrative circulation diagram helping us understand their interesting lives in the urban environment created by humans.</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/019_Jenny-1_Shivaji-Park.gif\" alt=\"The Initiative\" loading=\"lazy\" /><p>Dog Name: Jenny</p><p>Location: Shivaji Park</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/020_KKBColaba.gif\" alt=\"The Initiative\" loading=\"lazy\" /><p>Dog Name: Boy</p><p>Location: Colaba</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/021_KKBVersova.gif\" alt=\"The Initiative\" loading=\"lazy\" /><p>Dog Name:Rani/Puppi</p><p>Location: Versova</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/022_KKBNerul.gif\" alt=\"The Initiative\" loading=\"lazy\" /><p>Dog Name:Moti</p><p>Location: Nerul</p><p>4.4 References</p><p><strong>Books and articles</strong></p><p>1.</p><p><strong>Author:</strong></p><p><strong>Rishi Dev</strong></p><p><strong>Book Name:</strong></p><p>The Ekistics of Animal and Human Conflict // 2014</p><p>2.</p><p><strong>Author:</strong></p><p><strong>Alan Beck</strong></p><p><strong>Book Name:</strong></p><p>Between Pets and People, the Importance of Animal Companionship // 1983</p><p>The Ecology of Stray Dogs: A study of free ranging urban animals // 1973 &amp; 2002</p><p>New Perspectives on our Lives with Companion Animals // 1983</p><p>3.</p><p><strong>Author:</strong></p><p><strong>Aysha Akhtar</strong></p><p><strong>Book Name:</strong></p><p><strong>Animals and Public Health // 2011</strong></p><p><strong>Our Symphony with Animals // 2019</strong></p><p>4.</p><p><strong>Author:</strong></p><p><strong>Arnold Arluke</strong></p><p><strong>Book Name:</strong></p><p><strong>Regarding Animals // 1996</strong></p><p><strong>Just a Dog // 2006</strong></p><p>Beauty and Beast (postcard book) // 2010</p><p>5.</p><p><strong>Author:</strong></p><p><strong>Clinton Sanders</strong></p><p><strong>Book Name:</strong></p><p><strong>Between Species // 2009</strong></p><p>6.</p><p><strong>Author:</strong></p><p><strong>Frank Ascione</strong></p><p><strong>Book Name:</strong></p><p>International Handbook of Animal Abuse and Cruelty // 2008</p><p>7.</p><p><strong>Author:</strong></p><p><strong>Phil Arkow</strong></p><p><strong>Book Name:</strong></p><p>Animal Cruelty, Antisocial Behaviour and Aggresion // 2012</p><p>8.</p><p><strong>Author:</strong></p><p><strong>Caroline Stevens</strong></p><p><strong>Book Name:</strong></p><p><strong>Voice s for Animal LIberation // 2020</strong></p><p>9.</p><p><strong>Author:</strong></p><p><strong>Doris Lessing</strong></p><p><strong>Book Name:</strong></p><p>The old woman and her cat (fiction) // 2013</p><p>4.5 General Questions</p><p>(1) Why do street animals exist?</p><p>Street dogs and feral cats exist in large numbers in developing country like India:</p><ul><li>Human settlements (urban and rural both) inevitably create a noticeable amount of garbage that lies exposed. This essentially enables the street animal\u2019s existence. The animals quickly learn to scavenge. In the absence of this food source, they would have a a tougher time sustaining.</li><li>Couple this with their high reproduction rates and numbers. A female dog gives birth to an approximate of two litters of 4-10 pups each year. Cats have a higher number of three to four litters of up to 3-9 kittens annually. Thus the entire population grows exponentially over years.</li><li>Cities and towns in India have a huge amount of population surviving on the streets (Mumbai has an astonishing 60% of its population living on the streets!). The street dwellers, humans and animals, share a rather strong interdependence with regards to their psychological well-being and security taking care of each other.</li><li>Shopkeepers and others take active interest in tending to the needs of these animals, feeding them and looking out for their health.</li></ul><p>(2) Are there laws pertaining to the rights, responsibilties of care-takers and welfare of street animals?</p><p>India endorses ahimsa (non-violence) and this has always enabled people to peacefully co-exist with animals. It is a citizen\u2019s duty to show compassion towards all living creatures according to Article 51A(g) of the Constitution. A fundamental freedom guaranteed to the citizens of India, is the freedom to choose the life they wish to live, which includes facets such as living with or without companion animals and moreover assigns a duty to ensure animals are taken care of and respected whist watching out for any kind of cruelty towards them. Resident Welfare Organisations and Apartment owners associations cannot object pets as companions and cannot form laws against it, neither against permissible ways of housing and feeding street animals within society boundaries, even by majority. A \u201cban\u201d for animals/pets is considered illegal by the law.</p><p>Although the AWIB recognises pet owners and care givers to stray animals as different entities, their duties and responsibilities intersect. A pet owner or a stray care giver, should ideally take care of the health, sterilisation, and vaccination of the animal. This can either be done privately or with the help of animal welfare organisations.</p><p>Personally, it is the responsibility of the owner or the care giver to maintain cleanliness and hygiene where the animal defecates, lives and feeds.</p><p>They also have to make sure that the animals are not a nuisance to others around them.</p><p>The Animal Welfare Board of India (AWBI) has listed down in detail, all acts, rules and laws pertaining to the rights of animals and prevention of cruelty on their website. ( http://www.awbi.in/policy_acts_rules.html )</p><p>(3) Are there any provisions to keep the street animal population under control?</p><p>Large populations of stray dogs and cats turn into public health concerns. Dog bites, rabies, leptospirosis, cat scratch fever, and so on are all risks for people living in areas with large populations of strays which often leads to territorial fights and incessant barking at nights. While it\u2019s important to ensure the welfare of street animals, it\u2019s equally important to keep a check on their population to control the spread of diseases and prevent possible bites and attacks.</p><p>Animal Welfare Board prescribes Animal Birth Control Rules, 2001 (ABC) as the only effective methodology of keeping the street animal population under check along with vaccinations. The Honorable Supreme Court of India has further ordered the implementation of the ABC program to control the street dog population in all states of India since 2015.</p><p>ABC involves spaying of females and castration of male dogs so that they do not reproduce. Vaccination involves giving the dogs an anti- rabies shot. After sterilization the dogs do not reproduce and hence their population becomes stable. As they are vaccinated against Rabies and other diseases they do not pose any health hazard and live out their natural lives healthily and harmlessly, while protecting their territories from other aggressive dogs that may want to enter.</p><p>NGOs / individuals take up responsibilty to assist with ABC in their respective areas of functioning via a closed network of communication.</p><p>(4) What are the broad categories of differentiation in animal identification as a pet / a street animal?</p><p>Definitions are based on two quantifiable parameters: the level of an animal&#x27;s dependency on humans and the level of its restriction by humans (World Health Organization, 1988).</p><p>The first of these refers to the intentional provision of those needs, such as food, shelter and care, necessary for the survival and well-being of the animal. Although it was recognized that this dependency of animals on humans was a gradient ranging from total dependency to none, the following three categories of dependency were proposed:</p><ul><li>Full dependency \u2013 the animal is given all of its essential needs intentionally by humans</li><li>Semi-dependency \u2013 the animal is given some of its essential needs intentionally by humans</li><li>No dependency \u2013 the animal is given none of its essential needs intentionally by humans.</li></ul><p>The second parameter, restriction by humans, refers to the control of any contact, association and communication with other animals and people, either through physical restriction (e.g. confinement to premises, leashing) or through direct supervision and control when outside the premises. Again, three categories of restriction are recognized:</p><ul><li>Full restriction \u2013 fully restricted or supervised</li><li>Semi-restricted \u2013 movements and associations only partially restricted</li><li>No restriction \u2013 not subject to any restriction whatsoever.</li></ul><p>Four broad categories of animals which exist:</p><ul><li>Restricted animal \u2013 fully dependent on their owners and fully restricted or supervised</li><li>Family animals \u2013 fully dependent on their owners, but movement and contacts only partially restricted</li><li>Neighborhood animals \u2013 partially dependent on the intentional fulfilment of basic needs by humans, but subject to only partial or no restriction</li><li>Feral animals \u2013 independent of intentional human provisioning and unrestricted.</li></ul><p>5. Intervention</p><p>5.1 Opportunities and Vision</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/023_Screen-Shot-2020-05-07-at-12.58.30-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/024_Screen-Shot-2020-05-07-at-12.58.36-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/025_Screen-Shot-2020-05-07-at-12.58.43-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/026_Screen-Shot-2020-05-07-at-12.58.45-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/027_Screen-Shot-2020-05-07-at-12.58.46-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/028_Screen-Shot-2020-05-07-at-12.58.51-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /><p>With these imprints at hand, we begin to envision design/ art in a uniquely layered city such as Mumbai. This offers an opportunity to dab into the tangible and intangibles while exploring the overlaps between various paradigms like culture, emotions and \u2018human\u2019 values.</p><p>Locations such as a busy street corner, a dilapidated dysfunctional planter at the edge of the main road, the neglected dead end at a mohallah, the niche in the compound wall of a housing society. These give way to a collapsible pod for temporary fosters on the street or inside a structure for a frail pup or that tiny abandoned kitten amongst many other locations, thus believing in making a difference, a tiny one nevertheless, to those whose lives matter.</p><p>5.2 Design Direction</p><p>The design intent dabbles between what would be absolute necessities with generous sprinkles of dreams and aspirations. The direction varies from responding to materiality, temporality, efficiency, climate responsiveness, durability, reparability and minimal intrusion to aesthetics, art installation value, high detailing, sustainability, modularity, light weightiness, collapsibility, and cost effectiveness.</p><p>6. Design</p><p>6.1 Triggers for Design</p><p>a. Material Archive</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/029_Hemcrete.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Hempcrete</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/030_Concrete.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Microconcrete</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/031_ABS-Plastic.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Acrylonitrile Butadiene Styrene</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/032_Plastic.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Recycled Plastic Modules</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/033_Terracotta.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Terracotta</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/034_Clay.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Clay</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/035_Waste-Fabric.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Waste Fabric</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/036_Ply.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Birch Ply</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/037_Tyre.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Tyres</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/038_PVC.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>PVC Pipes</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/039_Rammed-earth.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Rammed Earth</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/040_Polycarb.png\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Corrugated Plastic Sheets</strong></p><p>b. Identification of Locations for interventions</p><p>Mapping places where strays are usually found</p><ul><li>Compound Wall</li><li>Corporate Smoking zones- Ash Trays</li><li>Bus Stops</li><li>Street Furniture: Benches</li><li>Planter Boxes</li><li>Road Dividers</li><li>Gates</li><li>Dustbins</li><li>Tapris</li><li>Gardens</li><li>Street Dwellers</li></ul><img src=\"/archv-in/images/The-Initiative-Beta-3-0/041_003.gif\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/042_004.gif\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/043_005.gif\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/044_001.gif\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/045_002.gif\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/046_006.gif\" alt=\"The Initiative\" loading=\"lazy\" /><p>c. Mapping realtime locations for field testing</p><p><strong>Shivaji Park</strong></p><p><strong>Dadara West</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/047_VNDLS_Maps_20.03.15Artboard-3.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p><strong>Skate Park</strong></p><p><strong>Carter Road Bandra West</strong></p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/048_VNDLS_Maps_20.03.15Artboard-2.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>823</p><p>Prakash Building Garage, Dadar</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/049_VNDLS_Maps_20.03.15Artboard-1.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>6.2 Conceptual Ideation</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/050_Cleaned-Scanned-Sketches-page-001.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/051_Cleaned-Scanned-Sketches-page-002.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/052_Cleaned-Scanned-Sketches-page-003.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/053_Cleaned-Scanned-Sketches-page-005.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/054_Cleaned-Scanned-Sketches-page-006.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/055_Cleaned-Scanned-Sketches-page-010.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/056_Cleaned-Scanned-Sketches-page-011.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/057_Cleaned-Scanned-Sketches-page-013.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><p>6.3 Simulations</p><img src=\"/archv-in/images/The-Initiative-Beta-3-0/058_20171028_085958.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/059_20171028_090209.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/060_20171028_090627.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/061_20171028_090714.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/062_20171028_091135.jpg\" alt=\"The Initiative\" loading=\"lazy\" /><img src=\"/archv-in/images/The-Initiative-Beta-3-0/063_20171028_110127.jpg\" alt=\"The Initiative\" loading=\"lazy\" />