description: >
  <p>VANDLS is an urban intervention research project by ARCHV, developed
  through the Sunday Service sessions with The Initiative. It moves beyond
  awareness of local environmental issues toward small guerrilla interventions
  that support shared habitats for people, street animals and nature.</p>

  <p>The process combines observation, mapping, design, full-scale prototyping and field testing. Guided by Faizan Khatri of The Initiative, the participants were Nayan Mote, Sneha Desai, Yash Pendse, Varun Mehta and Advaita Kelkar.</p>

  <p>Published in Platform Magazine, November 2020.</p>
