n 2020// Research Structure, Tyre Ideation, Scans First Look, Identity Initiation</p><p>12th Jan 2020// Format and story telling discussion</p><p>19th Jan 2020// Format Documentation Parameters, AWBI laws, Prototype Model, first draft of story telling</p><p>26th Jan 2020 // Casted Billi Bowl, Tyre Material, Finalise format</p><p>9th Feb 2020// Taj mahal Tea house, Mini Review</p><p>16th Feb 2020// Interview discussion, Format, Design upgrades, Field Days, Funding and crowd funding options</p><p>23rd Feb 2020// Finally we review + Google Drive Set up</p><p>27th Feb 2020 // Tyre Prototype at Pendses</p><p>5th March 2020 // Design Digital Documentation</p><p>15th Mar 2020 // Google Drive Organisation, Web Documentation Beta 1.0, Pod Illustrations</p><p>26th March 2020 // Google Hangout Call</p><p>29th March 2020 // Sharing Speculative futures and the collective dialougue around it</p><p>5th April 2020 // Web Documentation Beta 2.0</p><p>11th April 2020 // Web narrative review</p><p>19th April 2020 // Conference call to assign tasks</p><p>1st May 2020 // Web Documentation Beta 3.0</p><p>2nd May 2020 // Tasks during the lockdown</p><p>6th May 2020 // Web 4.0</p><p>20th May 2020 // Meet to organise excels, tech sheets and illustration mock</p><p>31st May 2020 // Final Web + Revamp with material archive and text updates</p><p>6th June 2020 // Drop down menu Web, Kutta kisko bola</p><p>7th June 2020 // Tech Sheets, Crate Designs, Illustrations, The initiative Logo, Material based methodology</p><p>14th June 2020 // Tech Sheets, Crate Designs</p><p>21st June 2020 // Initiative Web Incubation</p><p>28th June 2020 // New Crate Designs, Lego Pods</p><p><strong>Thane Site Visit 1</strong></p><p>28th August 2020 // Mono Pod Proposal</p><p>6th October 2020 // Site Visit 2</p><p>6th-18th October 2020 // Sorting Out Material and Labour</p><p>20th October 2020 // Lisa Maam Pitch</p><p>22nd October 2020 // Rconnect Virtual Meet</p><p>7th November 2020 // Introduction with Vinod</p><p>