  - title: "Research"
    subtitle: "Triggers for design"
    body: "<p class=\"ch-statement\">Triggers for design: what the city already offers, where the strays already are.</p><div class=\"ch-prose\"><h4>Direction</h4><p>The design intent dabbles between what would be absolute necessities with generous sprinkles of dreams and aspirations. The direction varies from responding to materiality, temporality, efficiency, climate responsiveness, durability, reparability and minimal intrusion to aesthetics, art installation value, high detailing, sustainability, modularity, light weightiness, collapsibility, and cost effectiveness.</p><h4>Material archive</h4></div><div class=\"ch-grid ch-grid--frame\" style=\"--cols:6;--cols-sm:3\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/029_Hemcrete.png\" alt=\"Hempcrete\" loading=\"lazy\" /><figcaption><strong>Hempcrete</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/030_Concrete.png\" alt=\"Microconcrete\" loading=\"lazy\" /><figcaption><strong>Microconcrete</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/031_ABS-Plastic.png\" alt=\"Acrylonitrile Butadiene Styrene\" loading=\"lazy\" /><figcaption><strong>Acrylonitrile Butadiene Styrene</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/032_Plastic.png\" alt=\"Recycled Plastic Modules\" loading=\"lazy\" /><figcaption><strong>Recycled Plastic Modules</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/033_Terracotta.png\" alt=\"Terracotta\" loading=\"lazy\" /><figcaption><strong>Terracotta</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/034_Clay.png\" alt=\"Clay\" loading=\"lazy\" /><figcaption><strong>Clay</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/035_Waste-Fabric.png\" alt=\"Waste Fabric\" loading=\"lazy\" /><figcaption><strong>Waste Fabric</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/036_Ply.png\" alt=\"Birch Ply\" loading=\"lazy\" /><figcaption><strong>Birch Ply</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/037_Tyre.png\" alt=\"Tyres\" loading=\"lazy\" /><figcaption><strong>Tyres</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/038_PVC.png\" alt=\"PVC Pipes\" loading=\"lazy\" /><figcaption><strong>PVC Pipes</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/039_Rammed-earth.png\" alt=\"Rammed Earth\" loading=\"lazy\" /><figcaption><strong>Rammed Earth</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/040_Polycarb.png\" alt=\"Corrugated Plastic Sheets\" loading=\"lazy\" /><figcaption><strong>Corrugated Plastic Sheets</strong></figcaption></figure></div><div class=\"ch-prose\"><h4>Where strays are found</h4></div><ul class=\"ch-list\"><li>Compound Wall</li><li>Corporate Smoking zones- Ash Trays</li><li>Bus Stops</li><li>Street Furniture: Benches</li><li>Planter Boxes</li><li>Road Dividers</li><li>Gates</li><li>Dustbins</li><li>Tapris</li><li>Gardens</li><li>Street Dwellers</li></ul><div class=\"ch-prose\"><h4>Field-testing sites</h4></div><div class=\"ch-grid\" style=\"--cols:3\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/047_VNDLS_Maps_20.03.15Artboard-3.jpg\" alt=\"VNDLS map\" loading=\"lazy\" /><figcaption><strong>Shivaji Park</strong><span>Dadar West</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/048_VNDLS_Maps_20.03.15Artboard-2.jpg\" alt=\"VNDLS map\" loading=\"lazy\" /><figcaption><strong>Skate Park</strong><span>Carter Road, Bandra West</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/049_VNDLS_Maps_20.03.15Artboard-1.jpg\" alt=\"VNDLS map\" loading=\"lazy\" /><figcaption><strong>823</strong><span>Prakash Building Garage, Dadar</span></figcaption></figure></div><div class=\"ch-prose\"><h4>Prototyping</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/VNDLSmain/067_VNDLS-Prototype-5.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/VNDLSmain/068_VNDLS-Prototype-3.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/VNDLSmain/069_VNDLS-Prototype-4.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/096_002_VNDLS_Process-Images_20.03.15.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/091_00100lrPORTRAIT_00100_BURST20200203153532771_COVER.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/VNDLSmain/072_VNDLS-Prototype-2.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/VNDLSmain/073_VNDLS-Prototype.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/098_VNDLS_Maps_20.03.15Artboard-6.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/099_VNDLS_Maps_20.03.15Artboard-5.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/100_2020-05-20.jpg\" alt=\"VNDLS prototyping\" loading=\"lazy\" /></figure></div>"
  - title: "The Initiative"
    subtitle: "Project 001: The Initiative"
    body: "<p class=\"ch-statement\">Project 001, with Faizan Khatri: habitats where people, street animals and plants share one small patch of the city.</p><ul class=\"ch-facts\"><li><span>Guided by</span><span><ul class=\"ch-list\"><li>Faizan Khatri</li></ul></span></li><li><span>Studio</span><span>studio eight twentythree, Mumbai</span></li><li><span>More</span><span>theinitiative.life</span></li></ul><div class=\"ch-prose\"><h4>The habitats</h4></div><div class=\"ch-grid ch-grid--frame\" style=\"--cols:4;--cols-sm:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/066_ARCHV_-VNDLS_01-Planter-Pod.jpg\" alt=\"Planter Pod\" loading=\"lazy\" /><figcaption><strong>Planter Pod</strong><span>Habitat 01</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/070_ARCHV_-VNDLS_02-Bubble-Pod.jpg\" alt=\"Bubble Pod\" loading=\"lazy\" /><figcaption><strong>Bubble Pod</strong><span>Habitat 02</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/071_ARCHV_-VNDLS_03-Pyramid-Pod.jpg\" alt=\"Pyramid Pod\" loading=\"lazy\" /><figcaption><strong>Pyramid Pod</strong><span>Habitat 03</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/072_ARCHV_-VNDLS_04-Tyre-Pod.jpg\" alt=\"Tyre Pod\" loading=\"lazy\" /><figcaption><strong>Tyre Pod</strong><span>Habitat 04</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/073_ARCHV_-VNDLS_05-Flatpack-Pod.jpg\" alt=\"Flatpack Pod\" loading=\"lazy\" /><figcaption><strong>Flatpack Pod</strong><span>Habitat 05</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/074_ARCHV_-VNDLS_06-Lego-Pod.jpg\" alt=\"Lego Pod\" loading=\"lazy\" /><figcaption><strong>Lego Pod</strong><span>Habitat 06</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/075_ARCHV_-VNDLS_07-Carrier-Pod.jpg\" alt=\"Carrier Pod\" loading=\"lazy\" /><figcaption><strong>Carrier Pod</strong><span>Habitat 07</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/076_ARCHV_-VNDLS_08-Tunnel-Pod.jpg\" alt=\"Tunnel Pod\" loading=\"lazy\" /><figcaption><strong>Tunnel Pod</strong><span>Habitat 08</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/077_ARCHV_-VNDLS_09-Pancake-Pod.jpg\" alt=\"Pancake Pod\" loading=\"lazy\" /><figcaption><strong>Pancake Pod</strong><span>Habitat 09</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/078_ARCHV_-VNDLS_10-Stone-Bench.jpg\" alt=\"Stone Bench\" loading=\"lazy\" /><figcaption><strong>Stone Bench</strong><span>Habitat 10</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/079_ARCHV_-VNDLS_11-Earth-Wall-Bench.jpg\" alt=\"Earth Wall Bench\" loading=\"lazy\" /><figcaption><strong>Earth Wall Bench</strong><span>Habitat 11</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/080_ARCHV_-VNDLS_12-Crate-Pod.jpg\" alt=\"Crate Pod\" loading=\"lazy\" /><figcaption><strong>Crate Pod</strong><span>Habitat 12</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/084_ARCHV_-VNDLS_13-Circle-Earth-Bench.jpg\" alt=\"Circle Earth Bench\" loading=\"lazy\" /><figcaption><strong>Circle Earth Bench</strong><span>Habitat 13</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/085_ARCHV_-VNDLS_14-Wall-Crate-Pod.jpg\" alt=\"Wall Crate Pod\" loading=\"lazy\" /><figcaption><strong>Wall Crate Pod</strong><span>Habitat 14</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/086_ARCHV_-VNDLS_15-Concrete-Seat.jpg\" alt=\"Concrete Seat\" loading=\"lazy\" /><figcaption><strong>Concrete Seat</strong><span>Habitat 15</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/087_ARCHV_-VNDLS_16-Mono-Pod.jpg\" alt=\"Mono Pod\" loading=\"lazy\" /><figcaption><strong>Mono Pod</strong><span>Habitat 16</span></figcaption></figure></div><div class=\"ch-prose\"><h4>1.1 Prelude</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/003_Initial-Imprints_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>We notice them when we want to,</h4><p>we don\u2019t when we don\u2019t.</p><p>\u201cOur concerns for the street animals and our concerns for people are probably related to one another.</p><p>The troubles that street animals face are not independent from the troubles that we face (as humans).</p><p>It would be easy to see the street animals as a problem and handle them as a problem.</p><p>Whereas if we can learn to live together again, maybe we\u2019ll solve our own problems as we try to solve theirs.</p><p>That could well be our path towards regaining our fading sense of humor and rekindle our slowly dying joy for life.\u201d</p><p>KEDI \u2013 documentary film by Ceyda Torun illustrating the lives of street cats in Istanbul, Turkey.</p><p>Drawing parallels between the urban humans with street animals like dogs/cats, we observe how they tend to interact (or not) with these co-inhabitants and the way they exist alongside each other.</p><p>How does one define a home? Would it be a sprawling built space customized to fancy our luxurious desires? Or would it be a finite volume just enough to accommodate one\u2019s daily existential needs? Or then, would it be a sheet of tarpaulin stretched over a couple of bamboo\u2019s on a neglected pavement, saving one from the onslaught of weather. Or does it simply mean that tiny space below a parked car, or a hole in the compound wall?</p><p>Stepping outside the realm of what architecture along with art notionally stands for in its literal sense, The Initiative explores a logical take on the emotional dependence of the urban animals with humans through the lens of what one may call their safe haven \u2018my space\u2019.</p><h4>1.2 Aspiration</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/004_1.2-Aspiration.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><p>There lies immense merit in the argument in today\u2019s time that designers should utilize their skills to resolve societal and environmental problems in the manner of an anti-consumerist approach rather than in support of the capitalist world. From supporting a single user, to a group of users, designers have the ability to create an impact through social design. (Interestingly, social design limits itself to certain sections of society, more so, society implying humans.)</p><p>While we share our world with fellow humans as well as animals along with nature, social design in densely populated human areas currently lacks exploration that empathizes with the welfare of street animals. The Initiative aspires to explore bridging that gap, combining art and design towards this endeavor of creating architecture for the non-human component of cities.</p><h4>1.3 Objectives</h4><p>The Initiative presents a study and illustration of the lives of stray animals and their habitat in different given cultural and physical conditions in the city of Mumbai. This further culminates into building animal shelter pods and feeders as usable/habitable art installations in different areas by deconstructing a typical street usage in a given city in India and intervening accordingly with the opportunities that present themselves. These pods would then begin to act as a safe haven for animals along with a pause point for humans, facilitating interaction if they desire acting as non-intrusive art inserts for the street dwellers and passers-by alike.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/005_Objectives_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/006_Objectives_04.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/007_Objectives_06.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>2. Methodology</h4><p>VNDLS is a group young designers/creative individuals allocating time every Sunday for this project.</p><p>We call this the Sunday Service meetings. This is when the group collectively meets holding dialogues towards planning and ideation.</p><p>The collaboration has devised a process which mainly involves learning from observation, designing, prototyping and field testing. The group believes in the intimacy involved with creating mock ups and trying them out in actual sizes.</p><p>The entire process has been meticulously guided by Faizan Khatri , who has been intensively involved with Animal Research and Design called The Initiative at studio eight twentythree, which houses most cats and dogs from the neighborhood.</p><p>The group is also incubates on data collection + analysis, and experiments with story telling in order to guide the designs. Their methodology constantly evolves and expands its horizons organically with each new development that takes form.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/008_VNDLS-Methodolgy_20.05.31.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>3. Face Off</h4><h4>3.1 Initial Imprints</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/009_Initial-Imprints_02.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/010_Observations_01.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/011_Observations_04.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><p>Mumbai city houses (or rather, witnesses) a stray or street dog population of close to one lakh. Out of which the population of street dogs in the Suburban Mumbai district is eight times larger. [1] (There is are no statistics available for the street cat population as of today.) Compare this to the 220 lakh human population of Mumbai, out of which the number of humans populating the slums/streets is close to an astonishing 60%. That\u2019s 132 lakh in numbers. [2]</p><p>Interestingly, the street dwellers, humans and animals, share a rather strong interdependence with regards to their psychological well-being and security. These animals are often conferred upon a name and considered as a close family member by those who live with them on streets. They end up forming an inseparable bond, which continues through life and generations. The street animals are found taking shelters under parked vehicle and other unsafe areas in proximity, often running a high risk of meeting with critical physical damage being run over and a lot times with an utterly painful death.</p><p>[1] As per survey carried out by the Mumbai Municipal Corporation in Oct 2017. Sources: the Asian Age, the Indian Express</p><p>[2] As per survey carried out by the Mumbai Municipal Corporation. Source: the Indian Express</p><h4>3.2 Observations</h4><p>It emerges strongly that their existence is easy to be ignored (we assume \u2018their\u2019 in this regard to be animals as well as humans that dwell on the streets); Ironically, shutting off their presence from the spectrum of vision for the (remaining) privileged 88 lakh urban dwellers of the city equipped with a shelter above their heads is often the case than not. Here probably lies the germination of the problem, and hence an attempt at a design intervention to address this lacuna.</p></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/012_Animal-Perspectiv-003.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/013_Observations_02.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/014_Observations_05.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/015_Animal-Perspectiv-001.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><h4>4. Research + Analysis</h4><h4>4.1 Kutta Kisko Bola</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/016_A.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/017_B.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/018_C.jpg\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><p>The mapping exercises carried out by Faizan Khatri involved observing the animals through days to understand their movement patterns, pause points, resting points, covered / open to sky at different times of the day/night. The paths and pauses were then articulated through an illustrative circulation diagram helping us understand their interesting lives in the urban environment created by humans.</p></div><div class=\"ch-grid\" style=\"--cols:5;--cols-sm:3\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/019_Jenny-1_Shivaji-Park.gif\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Dog Name: Jenny</strong><span>Location: Shivaji Park</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/020_KKBColaba.gif\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Dog Name: Boy</strong><span>Location: Colaba</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/021_KKBVersova.gif\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Dog Name:Rani/Puppi</strong><span>Location: Versova</span></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/022_KKBNerul.gif\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Dog Name:Moti</strong><span>Location: Nerul</span></figcaption></figure></div><div class=\"ch-prose\"><h4>4.4 References</h4><h4>Books and articles</h4><p>1.</p><h4>Author</h4><h4>Rishi Dev</h4><h4>Book Name</h4><h4>The Ekistics of Animal and Human Conflict // 2014</h4><p>2.</p><h4>Author</h4><h4>Alan Beck</h4><h4>Book Name</h4><p>Between Pets and People, the Importance of Animal Companionship // 1983</p><p>The Ecology of Stray Dogs: A study of free ranging urban animals // 1973 &amp; 2002</p><p>New Perspectives on our Lives with Companion Animals // 1983</p><p>3.</p><h4>Author</h4><h4>Aysha Akhtar</h4><h4>Book Name</h4><h4>Animals and Public Health // 2011</h4><h4>Our Symphony with Animals // 2019</h4><p>4.</p><h4>Author</h4><h4>Arnold Arluke</h4><h4>Book Name</h4><h4>Regarding Animals // 1996</h4><h4>Just a Dog // 2006</h4><h4>Beauty and Beast (postcard book) // 2010</h4><p>5.</p><h4>Author</h4><h4>Clinton Sanders</h4><h4>Book Name</h4><h4>Between Species // 2009</h4><p>6.</p><h4>Author</h4><h4>Frank Ascione</h4><h4>Book Name</h4><p>International Handbook of Animal Abuse and Cruelty // 2008</p><p>7.</p><h4>Author</h4><h4>Phil Arkow</h4><h4>Book Name</h4><p>Animal Cruelty, Antisocial Behaviour and Aggresion // 2012</p><p>8.</p><h4>Author</h4><h4>Caroline Stevens</h4><h4>Book Name</h4><h4>Voice s for Animal LIberation // 2020</h4><p>9.</p><h4>Author</h4><h4>Doris Lessing</h4><h4>Book Name</h4><h4>The old woman and her cat (fiction) // 2013</h4><h4>4.5 General Questions</h4><p>(1) Why do street animals exist?</p><p>Street dogs and feral cats exist in large numbers in developing country like India:</p><ul><li>Human settlements (urban and rural both) inevitably create a noticeable amount of garbage that lies exposed. This essentially enables the street animal\u2019s existence. The animals quickly learn to scavenge. In the absence of this food source, they would have a a tougher time sustaining.</li><li>Couple this with their high reproduction rates and numbers. A female dog gives birth to an approximate of two litters of 4-10 pups each year. Cats have a higher number of three to four litters of up to 3-9 kittens annually. Thus the entire population grows exponentially over years.</li><li>Cities and towns in India have a huge amount of population surviving on the streets (Mumbai has an astonishing 60% of its population living on the streets!). The street dwellers, humans and animals, share a rather strong interdependence with regards to their psychological well-being and security taking care of each other.</li><li>Shopkeepers and others take active interest in tending to the needs of these animals, feeding them and looking out for their health.</li></ul><p>(2) Are there laws pertaining to the rights, responsibilties of care-takers and welfare of street animals?</p><p>India endorses ahimsa (non-violence) and this has always enabled people to peacefully co-exist with animals. It is a citizen\u2019s duty to show compassion towards all living creatures according to Article 51A(g) of the Constitution. A fundamental freedom guaranteed to the citizens of India, is the freedom to choose the life they wish to live, which includes facets such as living with or without companion animals and moreover assigns a duty to ensure animals are taken care of and respected whist watching out for any kind of cruelty towards them. Resident Welfare Organisations and Apartment owners associations cannot object pets as companions and cannot form laws against it, neither against permissible ways of housing and feeding street animals within society boundaries, even by majority. A \u201cban\u201d for animals/pets is considered illegal by the law.</p><p>Although the AWIB recognises pet owners and care givers to stray animals as different entities, their duties and responsibilities intersect. A pet owner or a stray care giver, should ideally take care of the health, sterilisation, and vaccination of the animal. This can either be done privately or with the help of animal welfare organisations.</p><p>Personally, it is the responsibility of the owner or the care giver to maintain cleanliness and hygiene where the animal defecates, lives and feeds.</p><p>They also have to make sure that the animals are not a nuisance to others around them.</p><p>The Animal Welfare Board of India (AWBI) has listed down in detail, all acts, rules and laws pertaining to the rights of animals and prevention of cruelty on their website. ( http://www.awbi.in/policy_acts_rules.html )</p><p>(3) Are there any provisions to keep the street animal population under control?</p><p>Large populations of stray dogs and cats turn into public health concerns. Dog bites, rabies, leptospirosis, cat scratch fever, and so on are all risks for people living in areas with large populations of strays which often leads to territorial fights and incessant barking at nights. While it\u2019s important to ensure the welfare of street animals, it\u2019s equally important to keep a check on their population to control the spread of diseases and prevent possible bites and attacks.</p><p>Animal Welfare Board prescribes Animal Birth Control Rules, 2001 (ABC) as the only effective methodology of keeping the street animal population under check along with vaccinations. The Honorable Supreme Court of India has further ordered the implementation of the ABC program to control the street dog population in all states of India since 2015.</p><p>ABC involves spaying of females and castration of male dogs so that they do not reproduce. Vaccination involves giving the dogs an anti- rabies shot. After sterilization the dogs do not reproduce and hence their population becomes stable. As they are vaccinated against Rabies and other diseases they do not pose any health hazard and live out their natural lives healthily and harmlessly, while protecting their territories from other aggressive dogs that may want to enter.</p><p>NGOs / individuals take up responsibilty to assist with ABC in their respective areas of functioning via a closed network of communication.</p><p>(4) What are the broad categories of differentiation in animal identification as a pet / a street animal?</p><p>Definitions are based on two quantifiable parameters: the level of an animal&#x27;s dependency on humans and the level of its restriction by humans (World Health Organization, 1988).</p><p>The first of these refers to the intentional provision of those needs, such as food, shelter and care, necessary for the survival and well-being of the animal. Although it was recognized that this dependency of animals on humans was a gradient ranging from total dependency to none, the following three categories of dependency were proposed:</p><ul><li>Full dependency \u2013 the animal is given all of its essential needs intentionally by humans</li><li>Semi-dependency \u2013 the animal is given some of its essential needs intentionally by humans</li><li>No dependency \u2013 the animal is given none of its essential needs intentionally by humans.</li></ul><p>The second parameter, restriction by humans, refers to the control of any contact, association and communication with other animals and people, either through physical restriction (e.g. confinement to premises, leashing) or through direct supervision and control when outside the premises. Again, three categories of restriction are recognized:</p><ul><li>Full restriction \u2013 fully restricted or supervised</li><li>Semi-restricted \u2013 movements and associations only partially restricted</li><li>No restriction \u2013 not subject to any restriction whatsoever.</li></ul><h4>Four broad categories of animals which exist</h4><ul><li>Restricted animal \u2013 fully dependent on their owners and fully restricted or supervised</li><li>Family animals \u2013 fully dependent on their owners, but movement and contacts only partially restricted</li><li>Neighborhood animals \u2013 partially dependent on the intentional fulfilment of basic needs by humans, but subject to only partial or no restriction</li><li>Feral animals \u2013 independent of intentional human provisioning and unrestricted.</li></ul><h4>5. Intervention</h4><h4>5.1 Opportunities and Vision</h4></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/023_Screen-Shot-2020-05-07-at-12.58.30-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/024_Screen-Shot-2020-05-07-at-12.58.36-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/025_Screen-Shot-2020-05-07-at-12.58.43-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/026_Screen-Shot-2020-05-07-at-12.58.45-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/027_Screen-Shot-2020-05-07-at-12.58.46-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/028_Screen-Shot-2020-05-07-at-12.58.51-AM.png\" alt=\"The Initiative\" loading=\"lazy\" /></figure></div><div class=\"ch-prose\"><p>With these imprints at hand, we begin to envision design/ art in a uniquely layered city such as Mumbai. This offers an opportunity to dab into the tangible and intangibles while exploring the overlaps between various paradigms like culture, emotions and \u2018human\u2019 values.</p><p>Locations such as a busy street corner, a dilapidated dysfunctional planter at the edge of the main road, the neglected dead end at a mohallah, the niche in the compound wall of a housing society. These give way to a collapsible pod for temporary fosters on the street or inside a structure for a frail pup or that tiny abandoned kitten amongst many other locations, thus believing in making a difference, a tiny one nevertheless, to those whose lives matter.</p><h4>5.2 Design Direction</h4><p>The design intent dabbles between what would be absolute necessities with generous sprinkles of dreams and aspirations. The direction varies from responding to materiality, temporality, efficiency, climate responsiveness, durability, reparability and minimal intrusion to aesthetics, art installation value, high detailing, sustainability, modularity, light weightiness, collapsibility, and cost effectiveness.</p><h4>6. Design</h4><h4>6.1 Triggers for Design</h4><p>a. Material Archive</p></div><div class=\"ch-grid\" style=\"--cols:5;--cols-sm:3\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/029_Hemcrete.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Hempcrete</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/030_Concrete.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Microconcrete</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/031_ABS-Plastic.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Acrylonitrile Butadiene Styrene</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/032_Plastic.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Recycled Plastic Modules</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/033_Terracotta.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Terracotta</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/034_Clay.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Clay</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/035_Waste-Fabric.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Waste Fabric</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/036_Ply.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Birch Ply</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/037_Tyre.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Tyres</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/038_PVC.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>PVC Pipes</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/039_Rammed-earth.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Rammed Earth</strong></figcaption></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/040_Polycarb.png\" alt=\"The Initiative\" loading=\"lazy\" /><figcaption><strong>Corrugated Plastic Sheets</strong></figcaption></figure></div><div class=\"ch-prose\"><p>b. Identification of Locations for interventions</p><h4>Mapping places where strays are usually found</h4><ul><li>Compound Wall</li><li>Corporate Smoking zones- Ash Trays</li><li>Bus Stops</li><li>Street Furniture: Benches</li><li>Planter Boxes</li><li>Road Dividers</li><li>Gates</li><li>Dustbins</li><li>Tapris</li><li>Gardens</li><li>Street Dwellers</li></ul></div><div class=\"ch-grid\" style=\"--cols:2\"><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/041_003.gif\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/042_004.gif\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv-in/images/The-Initiative-Beta-3-0/043_005.gif\" alt=\"The Initiative\" loading=\"lazy\" /></figure><figure><img src=\"/archv