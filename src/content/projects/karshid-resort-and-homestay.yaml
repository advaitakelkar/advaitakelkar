name: "Karshid Beach Resort"
template: "project-01"
shortName: "KASD RESORT"
location: "Karshid, Alibag, India"
status: "Design study"
featured: false
smallIntro: "A five-star coastal resort: villas, rooms and shared amenities organised around the beach, landscape and hospitality operations."
category: "academic"
studio: barch
tags:
  - architecture
designBrief:
  abstract: >-
    This B.Arch design project proposes a five-star beach resort at Karshid, Alibag, bringing hotel rooms, private villas and shared leisure amenities into one coastal landscape. It asks how a resort can offer privacy and a strong experience of the sea while supporting the daily work of hospitality. The study compares hotel and resort typologies through guest arrival, accommodation clusters, dining, recreation and back-of-house operations. These relationships inform a sequence from arrival court to shared gardens and permitted beachfront amenities, with quieter residential clusters beyond the busiest public spaces. Shaded movement, monsoon shelter, drainage and durable materials shape the proposal alongside views and outdoor life. The design develops through a site masterplan, accommodation modules, circulation diagrams and building sections that test how hospitality can inhabit the coast.
  hypothesis: >-
    A coastal resort organised as shaded clusters of rooms and villas around shared landscape can provide privacy and a continuous experience of the sea while keeping guest movement and service operations clear and efficient.
chapterNav: "scroll"
chapters:
  - title: "Typology"
    subtitle: "Hospitality as an operating system"
    body: |
      <div class="ch-prose">
        <p>Compare a compact hotel block, dispersed villa resort and hybrid layout at an equivalent accommodation capacity. Trace arrival, check-in, room access, dining, recreation and departure alongside housekeeping, deliveries, kitchens, laundry and waste.</p>
        <p>Study room and villa modules, accessible accommodation, privacy thresholds, sea-view distribution and distances to shared facilities. Use the Ministry of Tourism classification framework as a programme reference; five-star is the design ambition, with operational classification a separate process.</p>
      </div>
  - title: "Programme"
    subtitle: "From arrival to the shore"
    body: |
      <div class="ch-prose">
        <p>Develop reception and lounge, rooms and suites, villas, restaurants and kitchens, pool and changing facilities, wellness, recreation and flexible gathering space. Include staff facilities, stores, engineering, water treatment and service access from the outset.</p>
        <p>Locate buildings and beachfront amenities after mapping the surveyed plot, high-tide line, applicable coastal zone, access, drainage and vegetation. Test shaded walks, monsoon-protected connections and landscape buffers within the permitted development area.</p>
      </div>
  - title: "Design tests"
    subtitle: "Privacy, climate and service"
    body: |
      <div class="ch-prose">
        <p>Compare guest and service walking distances, circulation conflicts, accessible routes, room privacy and the distribution of views. Test shade and rain protection along principal routes and sections through room, veranda and landscape.</p>
        <p>The hypothesis weakens if dispersed accommodation creates excessive service distances or if views compromise privacy and coastal constraints. Fix capacity, key mix and targets after establishing site and operator requirements.</p>
      </div>
  - title: "References"
    subtitle: "Sources and next inputs"
    body: |
      <div class="ch-prose">
        <p><a href="https://nidhi.tourism.gov.in/uploads/gallery/1667476361.pdf">Ministry of Tourism — hotel project approval and star classification guidelines (2018 document)</a>. Confirm the applicable edition before setting dimensional or service requirements.</p>
        <p><a href="https://mczma.gov.in/">Maharashtra Coastal Zone Management Authority</a> — starting point for the applicable coastal plan and permissions. Karshid is retained as the site name supplied in the brief; confirm its mapped location, surveyed boundary, coastal classification, topography and approach road before fixing the footprint.</p>
      </div>
